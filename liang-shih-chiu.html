while(q.length){const[x,y]=q.shift();if(ni>=0?Math.abs(x-tx)+Math.abs(y-ty)==1:(x==tx&&y==ty)){e=[x,y];break}
for(let d=0;d<4;d++){const nx=x+DX[d],ny=y+DY[d];if(prev[K(nx,ny)]===undefined&&free(nx,ny)){prev[K(nx,ny)]=K(x,y);q.push([nx,ny])}}}
if(!e)return;route=[];let k=K(e[0],e[1]);while(prev[k]!==-1){route.unshift([k%W,(k/W)|0]);k=prev[k]}goalNpc=ni}
cv.addEventListener('pointerdown',e=>{if(st!=='play')return;const r=cv.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*VW,sy=(e.clientY-r.top)/r.height*VH;tap={x:sx,y:sy,t:performance.now()};goTo(Math.floor((sx+cam.x)/T),Math.floor((sy+cam.y)/T));beep(660,.04,.03)});
function upd(dt){if(st!=='play')return;
if(P.m){P.m.p+=dt/150;if(P.m.p>=1){P.x=P.m.x;P.y=P.m.y;P.m=null;P.s^=1}}
if(held.length){route=[];goalNpc=-1}
if(!P.m&&held.length){const d=held[held.length-1];P.d=d;const nx=P.x+DX[d],ny=P.y+DY[d];if(free(nx,ny))P.m={x:nx,y:ny,p:0}}
else if(!P.m&&route.length){const[nx,ny]=route.shift(),d=[0,1,2,3].find(d=>DX[d]==nx-P.x&&DY[d]==ny-P.y);if(d!==undefined&&free(nx,ny)){P.d=d;P.m={x:nx,y:ny,p:0}}else route=[]}
else if(!P.m&&goalNpc>=0){const g=NP[goalNpc],d=[0,1,2,3].find(d=>DX[d]==g.x-P.x&&DY[d]==g.y-P.y);goalNpc=-1;if(d!==undefined){P.d=d;act()}}}
const ready=()=>6-met.size;
function draw(t){
const ppx=P.x*T+(P.m?(P.m.x-P.x)*T*P.m.p:0),ppy=P.y*T+(P.m?(P.m.y-P.y)*T*P.m.p:0);
cam.x=Math.max(0,Math.min(W*T-VW,Math.round(ppx+8-VW/2)));cam.y=Math.max(0,Math.min(H*T-VH,Math.round(ppy+8-VH/2)));
cx.drawImage(off,cam.x,cam.y,VW,VH,0,0,VW,VH);
const fl=.22+.08*Math.sin(t/110);cx.fillStyle='rgba(255,170,60,'+fl+')';[13,18].forEach(x=>{cx.beginPath();cx.arc(x*T+8-cam.x,6*T+6-cam.y,14,0,7);cx.fill()});
const L=[{y:ppy,f:()=>spr(cx,ppx-cam.x,ppy-cam.y,PK,P.d,P.m?(P.s?1:2):0,0)}];
NP.forEach((n,i)=>L.push({y:n.y*T,f:()=>{const X=n.x*T-cam.x,Y=n.y*T-cam.y;spr(cx,X,Y,n.k,n.d,0,((t/520|0)+i)%2);
const show=n.gate?ready()==0&&qi<Q.length:!met.has(i);if(show){const b=Math.round(Math.sin(t/200+i)*1.5),col=n.gate?'#ff6050':'#ffd04a';cx.fillStyle='#222';cx.fillRect(X+6,Y-10+b,4,9);cx.fillRect(X+6,Y+1+b,4,3);cx.fillStyle=col;cx.fillRect(X+7,Y-9+b,2,6);cx.fillRect(X+7,Y+2+b,2,1)}}}));
L.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
if(tap){const a=(performance.now()-tap.t)/500;if(a<1){cx.strokeStyle='rgba(255,208,74,'+(1-a)+')';cx.lineWidth=2;cx.beginPath();cx.arc(tap.x,tap.y,3+a*14,0,7);cx.stroke()}else tap=null}
$('#ctl').classList.toggle('on',st==='play');
cx.fillStyle='rgba(15,35,20,.12)';for(let k=0;k<3;k++){cx.beginPath();cx.ellipse(((t/90+k*130)%420)-80,40+k*60,50,16,0,0,7);cx.fill()}
const bl=(t%3200)<140,op=Math.floor(t/130)%2&&talking;
if(st==='talk'&&D)face(pc,NP[D.i].k,op,bl);if(st==='quiz')face(qp,NP[6].k,0,bl)}
/* 對話 */
let D=null,tmr=null,talking=false;
const AR=$('#ar'),TX=$('#tx');
function say(i,lines,end){st='talk';D={i,lines,k:0,end};NP[i].d=[3,2,1,0][P.d];$('#dlg').style.display='flex';show()}
function show(){const t=D.lines[D.k];$('#nm').textContent=NP[D.i].n;TX.textContent='';AR.style.visibility='hidden';let j=0;talking=true;clearInterval(tmr);
if(matchMedia('(prefers-reduced-motion:reduce)').matches){fin();return}
tmr=setInterval(()=>{TX.textContent=t.slice(0,++j);if(j%2)beep(440+D.i*40,.03,.025);if(j>=t.length)fin()},36)}
function fin(){clearInterval(tmr);talking=false;TX.textContent=D.lines[D.k];AR.style.visibility='visible'}
function adv(){if(talking){fin();return}if(++D.k<D.lines.length){show();return}
$('#dlg').style.display='none';const e=D.end;D=null;st='play';e&&e()}
function act(){if(st==='talk')return adv();if(st==='quiz')return pick(qsel);if(st!=='play'||P.m)return;
const i=npcAt(P.x+DX[P.d],P.y+DY[P.d]);if(i<0)return;const n=NP[i];
if(n.gate){if(ready()>0)return say(i,['要結案，得先把村裡的人都拜訪完。還有 '+ready()+' 位等著你。']);
return say(i,qi>=Q.length?['你已經答完所有題目了。']:['我有 '+Q.length+' 個問題。答對一題，就能帶走一件道具。'],qi>=Q.length?null:quiz)}
say(i,n.L,()=>{met.add(i);jingle([660,880]);hud()})}
/* 答題 */
let OP=[],qsel=0;
function setOp(l){OP=l;qsel=Math.min(qsel,l.length-1);ro()}
function ro(){$('#op').innerHTML=OP.map((o,i)=>`<button data-i="${i}" class="${i===qsel?'on':''}${o.x?' x':''}">${o.t}</button>`).join('')}
function pick(i){const o=OP[i];o&&!o.x&&o.fn()}
$('#op').onclick=e=>{const b=e.target.closest('button');if(b){qsel=+b.dataset.i;ro();pick(qsel)}};
const fb=t=>$('#fb').textContent=t;
function quiz(){st='quiz';$('#qz').style.display='flex';rq()}
function rq(){const q=Q[qi];if(!q){$('#qz').style.display='none';return end()}
$('#qh').textContent='第 '+(qi+1)+'/'+Q.length+' 題　'+q.q;fb('');qsel=0;
setOp(q.o.map((t,j)=>({t,fn:()=>{if(j===q.a){won.add(qi);hud();jingle([523,659,784,1047]);fb('答對了！獲得 '+q.i+q.t);qsel=0;setOp([{t:qi+1<Q.length?'下一題':'完成',fn:()=>{qi++;rq()}}])}
else{wrong++;beep(150,.2,.06);OP[j].x=1;fb('不太對。提示：去找「'+NP[q.f].n+'」再聽一次。');ro()}}})).concat([{t:'回去再問問',fn:()=>{$('#qz').style.display='none';st='play'}}]))}
function end(){st='end';const e=$('#en');e.style.display='grid';e.firstChild.innerHTML=`<h1 style="font-size:max(26px,8cqw);margin:0 0 1cqw;color:#ffd04a">結案成功</h1><p style="font-size:max(26px,8cqw);margin:0;letter-spacing:.2em">${Q.map(q=>q.i).join('')}</p><p>你帶回了 ${won.size} 件道具，答錯 ${wrong} 次。<br>梁實秋：北京出生、哈佛留學，在簡陋的雅舍寫小品，用三十多年譯完莎士比亞，也在妻子離世後寫下《槐園夢憶》。</p><button class="go" onclick="location.reload()">再玩一次</button>`;jingle([523,659,784,1047,784,1047])}
function hud(){$('#cnt').textContent='拜訪 '+met.size+'/6';$('#inv').innerHTML=Q.map((q,i)=>`<b class="${won.has(i)?'on':''}">${won.has(i)?q.i:'？'}</b>`).join('')}
/* 輸入 */
const KM={arrowdown:0,s:0,arrowleft:1,a:1,arrowright:2,d:2,arrowup:3,w:3};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(st==='quiz'&&(k in KM)){e.preventDefault();if(KM[k]==3)qsel=(qsel+OP.length-1)%OP.length;if(KM[k]==0)qsel=(qsel+1)%OP.length;ro();return}
if(k in KM){e.preventDefault();if(!held.includes(KM[k]))held.push(KM[k])}
else if(['z','e','enter',' '].includes(k)){e.preventDefault();if(!e.repeat)act()}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in KM){const i=held.indexOf(KM[k]);if(i>=0)held.splice(i,1)}});
document.querySelectorAll('#dp button').forEach(b=>{const d=+b.dataset.d;
b.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='quiz'){if(d==3)qsel=(qsel+OP.length-1)%OP.length;if(d==0)qsel=(qsel+1)%OP.length;ro();return}if(!held.includes(d))held.push(d)});
['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>{const i=held.indexOf(d);if(i>=0)held.splice(i,1)}))});
$('#ab').addEventListener('pointerdown',e=>{e.preventDefault();act()});
$('#dlg').onclick=()=>act();
$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent='音效：'+(mute?'關':'開')};
$('#fs').onclick=()=>{const d=document;Promise.resolve().then(()=>d.fullscreenElement?d.exitFullscreen():$('#g').requestFullscreen()).catch(()=>{})};
$('#start').onclick=()=>{try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}$('#ti').style.display='none';st='play';jingle([523,784]);hud()};
/* 主迴圈 */
buildMap();let last=0;
(function loop(t){requestAnimationFrame(loop);upd(Math.min(50,t-last||0));last=t;draw(t)})(0);
hud();
</script>
</body>
