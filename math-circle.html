<head>

<style>
:root{--navy:#183d63;--blue:#347eae;--sky:#eaf5fc;--gold:#f1c765;--ink:#243b50}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background-color:#eaf4fb;background-image:linear-gradient(rgba(79,143,184,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(79,143,184,.09) 1px,transparent 1px),radial-gradient(circle at 80% 8%,#fff 0,transparent 28%),linear-gradient(135deg,#eaf5fc,#dcecf7);background-size:28px 28px,28px 28px,auto,auto}
header{max-width:1050px;margin:auto;padding:26px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a.back{color:#245c83;text-decoration:none;font-weight:700;background:#fff;border:1px solid #c7deed;border-radius:999px;padding:10px 16px}
.hero{max-width:1010px;margin:8px auto 20px;padding:26px 24px;background:linear-gradient(120deg,#214f79,#397fa9);color:white;border-radius:24px;box-shadow:0 12px 28px #2457782b;position:relative;overflow:hidden}
.hero:after{content:"△  ◯  □  ∠";position:absolute;right:25px;bottom:12px;font-size:38px;letter-spacing:8px;color:#ffffff38}
.kicker{font-size:14px;letter-spacing:2px;color:#f8d986}.hero h1{margin:8px 0;font-size:clamp(25px,4vw,36px)}.hero p{margin:0;line-height:1.8;color:#e6f4ff;max-width:720px}
main{max-width:1010px;margin:0 auto;padding:0 20px 48px}.guide{background:#fff;border:1px solid #d8e7f1;border-radius:18px;padding:16px 20px;margin-bottom:18px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.unit{border:1px solid #d1e2ee;background:#fff;border-radius:20px;padding:19px;text-align:left;box-shadow:0 7px 18px #254e6710;cursor:pointer;transition:.18s;color:var(--ink);min-height:178px}.unit:hover{transform:translateY(-3px);box-shadow:0 12px 24px #254e6720;border-color:#77b2d3}.num{display:inline-block;background:#e7f3fb;color:#28658f;border-radius:9px;padding:5px 10px;font-weight:800}.unit h2{font-size:21px;margin:13px 0 7px}.unit p{line-height:1.65;color:#5c7181;margin:0}.unit .go{display:block;color:#2c78a8;font-weight:700;margin-top:13px}
.panel{display:none;margin-top:20px;background:#fff;border:1px solid #d3e4ef;border-radius:20px;padding:22px;box-shadow:0 10px 24px #214f7914}.panel.show{display:block}.panel h2{margin:0 0 8px}.hint{color:#5b7183;line-height:1.7}.visual{margin:14px 0 18px;padding:14px;background:linear-gradient(135deg,#f2f9fd,#e8f3fa);border:1px solid #d5e7f2;border-radius:16px}.visual svg{display:block;width:100%;max-height:230px}.visual-note{font-size:14px;color:#557086;margin:8px 0 0;line-height:1.7}.step-card{display:none;gap:10px;align-items:flex-start;background:#fff8e6;border:1px solid #f0dda7;border-radius:13px;padding:12px 14px;margin:12px 0;color:#674f1d;line-height:1.7}.step-card strong{white-space:nowrap}.question{font-size:20px;font-weight:800;line-height:1.7;margin:20px 0 14px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{border:2px solid #d6e5ef;background:#f8fbfd;border-radius:13px;padding:13px;text-align:left;font-size:17px;cursor:pointer;color:#243b50}.answer:hover{border-color:#75b3d4}.answer:disabled{cursor:default}.answer.correct{border-color:#48a47c;background:#e8f7ef}.answer.wrong{border-color:#dc8c82;background:#fff0ee}.feedback{margin-top:15px;line-height:1.8;font-weight:700;min-height:48px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.action{border:0;border-radius:999px;padding:11px 18px;background:#286f9e;color:white;font-weight:800;font-size:15px;cursor:pointer}.action.secondary{background:#edf4f8;color:#28536f}.progress{height:8px;background:#e8f0f5;border-radius:10px;margin-top:18px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#55a2c8;transition:width .2s}
.tool-row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}.tool-btn{border:1px solid #c7deed;background:#fff;color:#245c83;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}.calculator{display:none;background:#fff;border:1px solid #cbdfea;border-radius:18px;padding:16px;margin:0 0 18px;max-width:360px;box-shadow:0 8px 20px #214f7914}.calculator.show{display:block}.calc-display{width:100%;padding:13px 12px;margin:0 0 10px;border:1px solid #d4e3ec;border-radius:10px;background:#f5f9fc;text-align:right;font-size:25px;font-weight:800;color:#203d54}.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-keys button{border:1px solid #d5e3ec;border-radius:10px;background:#f5f9fc;padding:12px 4px;font-size:18px;font-weight:700;color:#294e69;cursor:pointer}.calc-keys button.op{background:#e7f3fb}.calc-keys button.equal{background:#286f9e;color:#fff}.calc-note{font-size:13px;color:#63798a;margin:9px 0 0}.work-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;align-items:start}.work-main{min-width:0}.calculator{position:sticky;top:12px;margin:0}.step-question{font-size:18px;font-weight:800;line-height:1.7;margin:14px 0}.step-prompt{background:#f1f7fb;border:1px solid #d5e5ef;border-radius:13px;padding:14px;margin:12px 0;line-height:1.7}.step-entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.step-entry input{flex:1;min-width:130px;padding:12px;border:2px solid #cbdfea;border-radius:10px;font-size:18px}.step-status{font-weight:700;line-height:1.7;margin-top:10px;min-height:28px}.step-count{font-size:14px;color:#5c7181;margin:8px 0}.answer-note{font-size:14px;color:#5c7181;margin-top:8px}@media(max-width:760px){.work-layout{grid-template-columns:1fr}.calculator{position:static;max-width:none}.calculator.show{display:block}}@media(max-width:560px){header{padding-top:18px}.hero{margin:8px 12px 16px;padding:22px 18px}.hero:after{font-size:23px}.answers{grid-template-columns:1fr}main{padding-left:12px;padding-right:12px}}

/* 答對時的中央彈出慶祝動畫 */
.correct-pop{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(20,35,48,.24);animation:popFade .95s ease forwards;pointer-events:none}
.correct-pop-card{background:linear-gradient(145deg,#fffdf0,#fff);border:3px solid #ffd45c;border-radius:26px;padding:28px 38px;text-align:center;box-shadow:0 16px 45px rgba(42,65,80,.24);animation:popBounce .72s cubic-bezier(.2,1.5,.4,1) both}
.correct-pop-stars{font-size:32px;letter-spacing:8px;animation:starSpin .8s ease both}
.correct-pop-title{font-size:30px;font-weight:900;color:#df8a16;margin:8px 0}
.correct-pop-sub{font-size:17px;font-weight:700;color:#52704a}
@keyframes popBounce{0%{opacity:0;transform:scale(.35) translateY(35px)}65%{opacity:1;transform:scale(1.12) translateY(-5px)}100%{opacity:1;transform:scale(1)}}
@keyframes popFade{0%,72%{opacity:1}100%{opacity:0}}
@keyframes starSpin{0%{transform:rotate(-18deg) scale(.4)}70%{transform:rotate(12deg) scale(1.2)}100%{transform:rotate(0) scale(1)}}

.subunit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:12px 0 20px}.subunit-card{display:flex;flex-direction:column;align-items:flex-start;gap:9px;text-align:left;padding:20px;border:2px solid #b8d2e2;border-radius:18px;background:linear-gradient(145deg,#f7fcff,#e7f2f8);color:#294e69;box-shadow:0 5px 0 #c6dce8;cursor:pointer}.subunit-card .num{font-size:13px;font-weight:900;color:#5a91b1}.subunit-card strong{font-size:20px}.subunit-card small{color:#58778b}.subunit-card .go{font-weight:800;color:#397b9f;margin-top:5px}@media(max-width:650px){.subunit-grid{grid-template-columns:1fr}}</style>
</head>
<body>
<header><strong>🔬 數學研究室｜九年級</strong><a class="back" href="./index.html">← 返回學習島</a></header>
<section class="hero"><div class="kicker">南一版・九年級上學期・第二章</div><h1>圓的性質</h1><p>先選擇小節，再開始練習。搭配圓形示意圖、分步提示與計算機，一步一步認識點、直線、弧與圓周角。</p></section>
<main>
<div class="tool-row"><button class="tool-btn" id="hintToggle" onclick="toggleHint()">💡 點我看提示</button><button class="tool-btn" id="calcToggle" onclick="toggleCalculator()">🧮 開啟計算機</button></div>

<div class="guide"><strong>🧭 本章學習地圖</strong><br>依照南一版九上第二章順序：2-1 圓形及點、直線、圓之間的關係 → 2-2 弧與圓周角。每個小節都可以分開學習與練習。</div>
<div class="grid" id="units">
<button class="unit" onclick="startUnit(0)"><span class="num">2-1</span><h2>圓形及點、直線、圓之間的關係</h2><p>認識圓心、半徑、弦、切線，以及點和直線與圓的位置關係。</p><span class="go">進入小節學習 →</span></button>
<button class="unit" onclick="startUnit(1)"><span class="num">2-2</span><h2>弧與圓周角</h2><p>認識弧的度數、圓心角、圓周角，以及同弧所對的角。</p><span class="go">進入小節學習 →</span></button>
</div>
<section class="panel" id="practice" aria-live="polite"><div class="num" id="unitNum">1-1</div><h2 id="unitTitle">連比</h2><p class="hint" id="unitHint"></p><div class="visual" id="visual" aria-label="本題數學示意圖"></div><div class="step-card" id="stepCard"><strong>🔎 下一步</strong><span id="stepText">先觀察圖形，再找出題目給你的數字。</span></div><div class="work-layout"><div class="work-main"><div class="question" id="question"></div><div class="step-count" id="stepCount"></div><div class="step-question" id="stepQuestion"></div><div class="step-prompt" id="stepPrompt"></div><div class="step-entry" id="stepEntry"><input id="stepInput" type="text" autocomplete="off" placeholder="在這裡填入答案"><button class="action" onclick="checkStep()">確認</button></div><div class="step-status" id="stepStatus" aria-live="polite"></div><div class="feedback" id="feedback"></div></div><section class="calculator" id="calculator" aria-label="基本計算機"><div class="calc-display" id="calcDisplay" aria-live="polite">0</div><div class="calc-keys"><button onclick="calcInput(7)">7</button><button onclick="calcInput(8)">8</button><button onclick="calcInput(9)">9</button><button class="op" onclick="calcOperator('/')">÷</button><button onclick="calcInput(4)">4</button><button onclick="calcInput(5)">5</button><button onclick="calcInput(6)">6</button><button class="op" onclick="calcOperator('*')">×</button><button onclick="calcInput(1)">1</button><button onclick="calcInput(2)">2</button><button onclick="calcInput(3)">3</button><button class="op" onclick="calcOperator('-')">−</button><button onclick="calcInput(0)">0</button><button onclick="calcDecimal()">.</button><button class="op" onclick="calcClear()">清除</button><button class="op" onclick="calcOperator('+')">+</button><button class="equal" style="grid-column:span 4" onclick="calcEquals()">＝ 計算</button></div><p class="calc-note">計算機會留在題目旁邊，需要時再按上方按鈕開啟。</p></section></div><div class="progress"><span id="bar"></span></div><div class="actions"><button class="action" onclick="nextQuestion()">下一題</button><button class="action secondary" onclick="backToUnits()">返回小節選單</button></div></section>
</main>
<script>
const units=[
{n:'2-1',title:'圓形及點、直線、圓之間的關係',hint:'先比較點到圓心的距離和半徑，再觀察直線與圓有幾個交點。',qs:[
{q:'圓的半徑是 5 公分。點 A 到圓心的距離是 3 公分，點 A 在哪裡？',steps:[{p:'點 A 到圓心的距離是幾公分？',a:'3',h:'題目已經告訴你距離是 3 公分。'},{p:'3 和半徑 5 比較，哪一個比較小？',a:'3',h:'3 小於 5。'},{p:'距離小於半徑，點 A 在圓的哪裡？',a:'圓內',h:'點到圓心距離小於半徑，點就在圓內。'}]},
{q:'圓的半徑是 4 公分。點 B 到圓心的距離也是 4 公分，點 B 在哪裡？',steps:[{p:'點 B 到圓心的距離是多少？',a:'4',h:'題目給的是 4 公分。'},{p:'半徑是多少？',a:'4',h:'半徑也是 4 公分。'},{p:'距離等於半徑，點 B 在哪裡？',a:'圓上',h:'距離等於半徑，點就在圓周上。'}]},
{q:'一條直線和圓只有一個交點，這條直線叫什麼？',steps:[{p:'先數一數：直線和圓有幾個交點？',a:'1',h:'題目說只有一個交點。'},{p:'只有一個交點的直線叫做什麼線？',a:'切線',h:'切線只會碰到圓一次。'}]},
{q:'切線碰到圓的地方，半徑和切線形成幾度？',steps:[{p:'切線和通過切點的半徑互相垂直。',a:'垂直',h:'垂直表示兩條線形成直角。'},{p:'直角是幾度？',a:'90',h:'記得直角是 90 度。'}]}
]},
{n:'2-2',title:'弧與圓周角',hint:'同一弧所對的圓周角，是圓心角的一半。先找圓心角，再除以 2。',qs:[
{q:'一段弧所對的圓心角是 80°，這段弧的度數是多少？',steps:[{p:'弧的度數和所對的圓心角有什麼關係？',a:'相等',h:'弧的度數等於所對圓心角的度數。'},{p:'圓心角是 80°，弧的度數就是幾度？',a:'80',h:'兩者度數相同。'}]},
{q:'同一弧所對的圓心角是 100°，圓周角是多少度？',steps:[{p:'圓周角是圓心角的幾分之幾？',a:'一半',h:'同弧所對的圓周角等於圓心角的一半。'},{p:'用 100 除以 2，答案是多少？',a:'50',h:'100 ÷ 2 = 50。'}]},
{q:'同一圓中，同一弧所對的兩個圓周角，大小有什麼關係？',steps:[{p:'同弧所對的圓周角，度數會相同還是不同？',a:'相同',h:'同弧所對的圓周角相等。'}]},
{q:'直徑所對的圓周角是幾度？',steps:[{p:'直徑把圓分成一個半圓。半圓所對的圓周角是直角。',a:'直角',h:'直角是 90 度。'},{p:'直角的度數是幾度？',a:'90',h:'記得直角是 90 度。'}]}
]}
];
let current=0,index=0,answered=false;
function startUnit(i){
 current=i;index=0;
 document.getElementById('units').style.display='none';
 document.getElementById('practice').classList.add('show');
 document.getElementById('unitNum').textContent=units[i].n;
 document.getElementById('unitTitle').textContent=units[i].title;
 document.getElementById('unitHint').textContent=units[i].hint;
 if(i===3){
  document.getElementById('visual').innerHTML='<div class="subunit-grid"><button class="subunit-card" onclick="startApplicationPractice()"><span class="num">01</span><strong>對應邊的比</strong><small>步驟式練習</small><span class="go">開始練習 →</span></button><button class="subunit-card" onclick="window.open(' + "'./trig-intro.html','_blank','noopener'" + ')"><span class="num">04</span><strong>sin／cos／tan</strong><small>三角比練習題</small><span class="go">前往練習 →</span></button></div>';
  document.getElementById('question').textContent='請選擇下方的練習單元';
  document.getElementById('stepCount').textContent='';
  document.getElementById('stepQuestion').textContent='';
  document.getElementById('stepPrompt').textContent='';
  document.getElementById('stepEntry').style.display='none';
  document.getElementById('stepStatus').textContent='';
  document.getElementById('feedback').textContent='';
  document.getElementById('stepCard').style.display='none';
  document.querySelector('#practice .progress').style.display='none';
  document.querySelector('#practice .actions .action').style.display='none';
  return;
 }
 document.getElementById('stepEntry').style.display='flex';
 document.getElementById('stepCard').style.display='';
 document.querySelector('#practice .progress').style.display='';
 document.querySelector('#practice .actions .action').style.display='';
 render();
}
function startApplicationPractice(){
 document.getElementById('stepEntry').style.display='flex';
 document.getElementById('stepCard').style.display='';
 document.querySelector('#practice .progress').style.display='';
 document.querySelector('#practice .actions .action').style.display='';
 document.getElementById('visual').innerHTML='';
 document.getElementById('question').textContent=units[3].qs[0].q;
 index=0;render();
}
function illustration(i){
const art=[
'<svg viewBox="0 0 560 190" role="img" aria-label="圓內、圓上、圓外的點"><circle cx="270" cy="95" r="65" fill="#dceefa" stroke="#347eae" stroke-width="4"/><circle cx="270" cy="95" r="4" fill="#244f70"/><path d="M270 95 L315 48" stroke="#d18d3d" stroke-width="3"/><circle cx="315" cy="48" r="6" fill="#d18d3d"/><circle cx="335" cy="95" r="6" fill="#48a47c"/><circle cx="385" cy="95" r="6" fill="#dc8c82"/><g fill="#294e69" font-size="15"><text x="270" y="112" text-anchor="middle">圓心</text><text x="320" y="35">圓上</text><text x="342" y="78">圓內</text><text x="392" y="78">圓外</text><text x="292" y="61">半徑</text></g></svg>',
'<svg viewBox="0 0 560 190" role="img" aria-label="切線與割線示意圖"><circle cx="270" cy="95" r="62" fill="#eaf5fc" stroke="#347eae" stroke-width="4"/><path d="M270 95 L332 95" stroke="#d18d3d" stroke-width="3"/><path d="M332 25 L332 165" stroke="#48a47c" stroke-width="4"/><path d="M185 35 L355 155" stroke="#dc8c82" stroke-width="4"/><circle cx="332" cy="95" r="5" fill="#d18d3d"/><g fill="#294e69" font-size="15"><text x="342" y="35">切線</text><text x="365" y="150">割線</text><text x="280" y="84">半徑</text><text x="338" y="113">切點</text></g></svg>'
];
const notes=['比較點到圓心的距離與半徑：小於在圓內、等於在圓上、大於在圓外。','觀察直線與圓的交點：一個交點是切線，兩個交點是割線。'];
document.getElementById('visual').innerHTML=art[i]+'<p class="visual-note">看圖小提醒：'+notes[i]+'</p>';
}
function render(){const q=units[current].qs[index];answered=false;stepIndex=0;document.getElementById('stepCard').style.display='none';document.getElementById('hintToggle').textContent='💡 點我看提示';illustration(current);document.getElementById('question').textContent='第 '+(index+1)+' 題｜'+q.q;document.getElementById('feedback').textContent='';document.getElementById('stepStatus').textContent='';document.getElementById('stepInput').value='';document.getElementById('stepInput').disabled=false;document.getElementById('bar').style.width='0%';showStep()}
let stepIndex=0;
function normalize(v){return String(v).trim().replace(/[：﹕]/g,':').replace(/\s/g,'').replace(/[．。]/g,'.').toLowerCase()}
function showStep(){const q=units[current].qs[index],st=q.steps[stepIndex];document.getElementById('stepCount').textContent='計算步驟 '+(stepIndex+1)+'／'+q.steps.length;document.getElementById('stepQuestion').textContent=st.p;document.getElementById('stepPrompt').textContent='💡 小提醒：'+st.h;document.getElementById('stepInput').value='';document.getElementById('stepStatus').textContent='';document.getElementById('stepInput').disabled=false;document.getElementById('stepInput').focus()}
function showCorrectPopup(){const pop=document.createElement('div');pop.className='correct-pop';pop.innerHTML='<div class="correct-pop-card"><div class="correct-pop-stars">⭐ ✨ ⭐</div><div class="correct-pop-title">答對了！太棒了！</div><div class="correct-pop-sub">你做到了，繼續加油！</div></div>';document.body.appendChild(pop);window.setTimeout(()=>pop.remove(),1000)}
function checkStep(){if(answered)return;const q=units[current].qs[index],st=q.steps[stepIndex],v=normalize(document.getElementById('stepInput').value);if(!v){document.getElementById('stepStatus').textContent='先在空格填入答案，再按確認喔！';return}if(v!==normalize(st.a)){document.getElementById('stepStatus').textContent='再想一想喔！'+st.h;return}showCorrectPopup();document.getElementById('stepStatus').textContent='✓ 答對了！這一步完成。';document.getElementById('stepInput').disabled=true;if(stepIndex<q.steps.length-1){document.getElementById('stepPrompt').textContent='太好了！'+st.a+'。準備好後，按「下一步」繼續。';document.querySelector('#practice .actions .action').textContent='下一步';}else{answered=true;document.getElementById('feedback').textContent='🎉 太棒了！你已完成本題所有步驟。';document.getElementById('bar').style.width='100%';document.querySelector('#practice .actions .action').textContent='下一題';document.getElementById('stepPrompt').textContent='本題完成！你可以按「下一題」繼續練習。'}}
function nextQuestion(){if(!answered){const q=units[current].qs[index];if(document.getElementById('stepInput').disabled&&stepIndex<q.steps.length-1){stepIndex++;showStep();document.querySelector('#practice .actions .action').textContent='下一步';return}document.getElementById('stepStatus').textContent='請先完成這一步，再繼續喔！';return}index=(index+1)%units[current].qs.length;render();document.querySelector('#practice .actions .action').textContent='下一步'}
function backToUnits(){document.getElementById('practice').classList.remove('show');document.getElementById('units').style.display='grid';document.getElementById('stepCard').style.display='none';document.getElementById('hintToggle').textContent='💡 點我看提示'}
function toggleHint(){const card=document.getElementById('stepCard');const show=card.style.display!=='block';card.style.display=show?'block':'none';document.getElementById('hintToggle').textContent=show?'🙈 收起提示':'💡 點我看提示'}
function toggleCalculator(){const c=document.getElementById('calculator');const show=!c.classList.contains('show');c.classList.toggle('show',show);document.getElementById('calcToggle').textContent=show?'🧮 收起計算機':'🧮 開啟計算機'}
let calcValue='0',calcStored=null,calcOp=null,calcFresh=false;
function calcUpdate(){document.getElementById('calcDisplay').textContent=calcValue}
function calcInput(n){if(calcFresh||calcValue==='0'){calcValue=String(n);calcFresh=false}else if(calcValue.length<12){calcValue+=String(n)}calcUpdate()}
function calcDecimal(){if(calcFresh){calcValue='0.';calcFresh=false}else if(!calcValue.includes('.'))calcValue+='.';calcUpdate()}
function calcClear(){calcValue='0';calcStored=null;calcOp=null;calcFresh=false;calcUpdate()}
function calcOperator(op){if(calcOp&& !calcFresh)calcEquals();calcStored=Number(calcValue);calcOp=op;calcFresh=true}
function calcEquals(){if(calcOp===null||calcStored===null)return;const b=Number(calcValue);let r=calcOp==='+'?calcStored+b:calcOp==='-'?calcStored-b:calcOp==='*'?calcStored*b:calcStored/b;calcValue=Number.isFinite(r)?String(Number(r.toFixed(8))):'不能除以 0';calcStored=null;calcOp=null;calcFresh=true;calcUpdate()}
</script>
