<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8fc9dc"><title>作者島｜文學家的故事</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#563b29;background:linear-gradient(#75c7e5 0 35%,#b4d990 35% 100%);min-height:100vh}
.scene{max-width:1050px;margin:auto;padding:28px 18px 55px}.back{display:inline-block;padding:10px 17px;border-radius:22px;background:#fff4d8;border:3px solid #b9824b;color:#654127;text-decoration:none;font-weight:900;box-shadow:0 4px 0 #87552f}
.hero{margin:24px auto 20px;text-align:center;padding:28px 18px;border:8px solid #e6c68a;border-radius:32px;background:linear-gradient(145deg,#fff8e7ed,#f2dfb9ed);box-shadow:0 12px 0 #9a7049}
.hero .island-icon{font-size:68px;filter:drop-shadow(0 6px 2px #80613e55)}h1{font-size:clamp(30px,5vw,48px);margin:6px 0;color:#744126} .subtitle{font-weight:800;color:#987047}
.card{display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center;padding:24px;border-radius:26px;background:#fff8e8;border:5px solid #c99c5e;box-shadow:0 9px 0 #865b38}
.portrait{min-height:220px;border-radius:20px;background:linear-gradient(#b9e4ed 0 55%,#9bc57e 55%);display:grid;place-items:center;font-size:100px;box-shadow:inset 0 0 0 5px #fff5d9}
h2{margin:0 0 12px;font-size:28px;color:#80452b}.facts{display:grid;gap:10px}.fact{padding:12px 15px;background:#f4e6c9;border-left:5px solid #c28c4c;border-radius:10px;line-height:1.8}.quote{margin-top:15px;padding:16px;border-radius:14px;background:#e8f1d8;color:#49623c;font-weight:900;line-height:1.8}
@media(max-width:650px){.card{grid-template-columns:1fr;padding:15px}.portrait{min-height:150px;font-size:78px}.hero{padding:20px 12px}}
</style>
</head>
<body><main class="scene">
<a class="back" href="./index.html">← 返回學習島</a>
<header class="hero"><div class="island-icon">📚 🏝️ ✨</div><h1>歡迎來到作者島</h1><p class="subtitle">搭乘小飛機，認識寫下經典作品的文學家！</p></header>
<section class="card">
<div class="portrait" aria-label="古代書院與蓮花插圖">🪷</div>
<div><h2>周敦頤</h2><div class="facts">
<div class="fact"><strong>朝代：</strong>北宋</div>
<div class="fact"><strong>身分：</strong>思想家、哲學家、文學家</div>
<div class="fact"><strong>代表作品：</strong>《愛蓮說》</div>
<div class="fact"><strong>作品特色：</strong>藉由蓮花「出淤泥而不染」的形象，表達潔身自愛、不與世俗同流合污的品格。</div>
</div><p class="quote">學習小提醒：讀《愛蓮說》時，可以想一想——作者為什麼喜歡蓮花？蓮花代表什麼樣的人格特質？</p></div>
</section></main></body></html>
