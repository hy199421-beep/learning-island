<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>學習島｜學生準時簽到</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eaf5fb,#fbf5e8);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#263746}
main{max-width:680px;margin:0 auto;padding:22px 15px 40px}.hero{background:linear-gradient(120deg,#477da8,#6f9eb9);color:#fff;padding:23px;border-radius:22px;text-align:center;box-shadow:0 10px 25px #315c7a22}.island{font-size:36px}h1{font-size:27px;margin:7px 0}.hero p{margin:0;opacity:.94}.card{background:#fffdf7;border:1px solid #e7e1d5;border-radius:18px;padding:19px;margin-top:16px;box-shadow:0 5px 18px #4353630b}
label{display:block;font-weight:800;margin:0 0 8px}select{width:100%;padding:14px;border:1px solid #d8dfe4;border-radius:11px;font:inherit;background:#fff;color:#263746}.date{margin-top:13px;color:#687887;font-size:13px}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:15px}.student{border:1px solid #e7e1d5;border-radius:14px;background:white;padding:17px 10px;color:#263746;font:700 18px inherit;cursor:pointer;min-height:76px;transition:.15s}.student:hover{border-color:#d6ad58;transform:translateY(-2px);box-shadow:0 5px 14px #9d824322}.student:disabled{cursor:default;opacity:.7;background:#edf6ef;color:#287a55}.student small{display:block;font-size:12px;font-weight:500;margin-top:6px}.status{padding:13px;border-radius:12px;margin-top:14px;background:#eef4f7;color:#36556b;line-height:1.6;min-height:48px}.status.ok{background:#eaf5ee;color:#236744}.status.err{background:#fff0ed;color:#9b3932}.note{font-size:12px;line-height:1.7;color:#687887;margin-top:14px}@media(max-width:420px){.roster{grid-template-columns:1fr 1fr}.student{font-size:16px;padding:15px 7px}}
</style></head>
<body><main>
<header class="hero"><div class="island">🏝️</div><h1>學習島・每日準時簽到</h1><p>先選擇班級，再點自己的名字即可完成簽到</p></header>
<section class="card">
<label for="group">① 選擇組別</label><select id="group"><option value="數學9A">數學9A</option><option value="國文8A">國文8A</option><option value="國文8B">國文8B</option></select>
<div class="date" id="today"></div>
<label style="margin-top:17px">② 點選自己的姓名，立即簽到</label>
<div class="roster" id="roster"></div>
<div id="status" class="status">請先選擇組別，再點選自己的名字。</div>
<div class="note">上課開始後 5 分鐘內簽到：準時 +2 點；超過 5 分鐘：遲到打卡 +0 點。每位學生同一天只能簽到一次。請勿代替同學簽到。</div>
</section></main>
<script>
const API="https://script.google.com/macros/s/AKfycbyZZ_i7LTq9pxuRAjPI9HUyy07CAK0TfTBcXT7HIfzxGPQpy3n5o6VsbE00daDZuHAd/exec";
const rosters={"數學9A":["慶豐","詠甯","祺叡","冠閔","鴻昱","聖民","柏曜"],"國文8A":["淮喆","鼎杰","佳瑋","子田","司浩"],"國文8B":["昱佑","奕訢","日良","羽琪","世賢","宣澔"]};
const $=id=>document.getElementById(id);let attendance=[];let busy=new Set();
function today(){const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const o=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`}
const date=today();$("today").textContent=`簽到日期：${date}`;
function eventId(group,name){return `daily-${date}-${group}-${name}`}
function getAttendanceStatus(group,data){
 const weekdays=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
 const weekday=weekdays[new Date().getDay()];
 const lesson=(data.schedule||[]).find(x=>x.group===group&&x.weekday===weekday);
 if(!lesson) throw Error("今天課表中沒有這個班級的課程，請確認組別。");
 const m=String(lesson.start_time||"").match(/(\d{1,2}):(\d{2})/);
 if(!m) throw Error("課表未設定正確的上課開始時間。");
 const now=new Date(); const startMinutes=Number(m[1])*60+Number(m[2]);
 const elapsed=now.getHours()*60+now.getMinutes()+now.getSeconds()/60-startMinutes;
 return {status:elapsed<=5?"準時":"遲到",points:elapsed<=5?2:0,start:String(lesson.start_time),elapsed};
}
function msg(s,c=""){ $("status").className="status "+c;$("status").textContent=s }
function hasChecked(group,name){return attendance.some(x=>x.event_id===eventId(group,name))}
function render(){const group=$("group").value;const root=$("roster");root.innerHTML="";rosters[group].forEach(name=>{const b=document.createElement("button");b.className="student";b.disabled=busy.has(name)||hasChecked(group,name);b.textContent=name;const small=document.createElement("small");small.textContent=busy.has(name)?"簽到處理中…":hasChecked(group,name)?"今日已簽到 ✓":"點我簽到";b.appendChild(small);b.addEventListener("click",()=>checkin(group,name));root.appendChild(b)})}
async function getData(){const r=await fetch(API+"?action=getData&t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("讀取資料庫失敗");const d=await r.json();if(!d.ok)throw Error(d.error||"資料庫回應錯誤");return d}
async function refresh(){try{const d=await getData();attendance=d.attendance||[];render()}catch(e){msg("暫時無法讀取簽到狀態："+e.message,"err")}}
async function checkin(group,name){if(busy.has(name))return;if(hasChecked(group,name)){msg(`${name} 今天已經簽到過囉！`);return}busy.add(name);render();msg(`正在為 ${name} 簽到，請稍候……`);
const id=eventId(group,name);try{const d=await getData();attendance=d.attendance||[];if(hasChecked(group,name)){msg(`${name} 今天已經簽到過囉！`);return}
const timing=getAttendanceStatus(group,d);
await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"markAttendance",eventId:id,date,group,name,status:timing.status})});
await new Promise(r=>setTimeout(r,1200));const after=await getData();attendance=after.attendance||[];if(hasChecked(group,name)){msg(timing.points===2?`🎉 ${name} 準時簽到成功！上課時間 ${timing.start}，獲得 +2 點。`:`${name} 已完成遲到打卡。上課時間 ${timing.start}，超過 5 分鐘，本次 +0 點。`,"ok")}else{msg("簽到送出後尚未在資料庫確認到紀錄，請稍後重新整理或請老師協助。","err")}
}catch(e){msg("簽到未完成："+e.message,"err")}finally{busy.delete(name);render()}}
$("group").addEventListener("change",()=>{render();msg(`已切換至 ${$("group").value}，請點選自己的姓名。`)});render();refresh();
</script></body></html>
