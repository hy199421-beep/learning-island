<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>國文書坊｜課文學習</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3e8d4;color:#493321;font-family:"Noto Serif TC","Microsoft JhengHei",serif}
header{padding:24px 18px;text-align:center;background:linear-gradient(135deg,#62412b,#321d14);color:#f8dda0;border-bottom:5px double #d5ad65;box-shadow:0 5px 14px #4b2b1d33}
header h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:.2em}header p{margin:8px 0 0;color:#f5dfb3}
main{width:min(980px,calc(100% - 28px));margin:28px auto 60px}
.page-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-actions a{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:11px 20px;border-radius:999px;text-decoration:none;font-weight:800;transition:transform .15s,box-shadow .15s}
.page-actions a:hover{transform:translateY(-2px)}
.back-island{color:#fff8e8;background:linear-gradient(135deg,#64894d,#3d6843);border:2px solid #d4c18a;box-shadow:0 4px 0 #294c34,0 7px 14px #3f583326}
.back{margin:0;color:#765034;background:#fffaf0;border:1px solid #d2bd91;box-shadow:0 2px 4px #54351c20}
@media(max-width:480px){.page-actions{gap:8px}.page-actions a{flex:1;padding:10px 12px;font-size:15px}}
h2{text-align:center;font-size:clamp(25px,4vw,34px);margin:8px 0 22px;color:#68452e}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 18px}
.tabs button{padding:15px 8px;border:2px solid #c39a5d;border-radius:12px;background:#fff8e9;color:#704b2c;font-size:18px;font-weight:800;cursor:pointer}
.tabs button.active{background:linear-gradient(#a96e38,#754323);color:#fff3d8;border-color:#8e5c2e}
.panel{display:none;padding:clamp(18px,4vw,34px);border:5px double #bd9253;background:#fff9ed;box-shadow:0 8px 20px #52331f20;border-radius:8px;line-height:2;font-size:18px}
.panel.active{display:block}.panel h3{margin-top:0;color:#80522f}.poem{font-size:21px;line-height:2.2;white-space:pre-line;text-align:center}
.note{padding:13px 16px;background:#f5ead7;border-left:4px solid #bd9253;border-radius:4px;margin:14px 0}
ruby rt{font-size:.65em;color:#a04d36} .muted{color:#806f5c;font-size:15px}
@media(max-width:560px){.tabs{gap:6px}.tabs button{font-size:15px;padding:12px 4px}.panel{font-size:16px}.poem{font-size:18px}}

/* 全站統一使用標楷體 */
*,*::before,*::after{font-family:"標楷體","DFKai-SB","BiauKai",serif !important}

/* 測驗介面視覺：參考米金紙紋與深咖啡色測驗畫面 */
body{background:repeating-linear-gradient(90deg,rgba(164,127,73,.045) 0,rgba(164,127,73,.045) 1px,transparent 1px,transparent 22px),linear-gradient(135deg,#f7efd9,#efe1c1);color:#38271d}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(16px,4vw,52px);text-align:left;background:linear-gradient(110deg,#583622,#321d14);border-bottom:4px solid #c9a65e}
header h1{font-size:clamp(21px,3vw,30px);letter-spacing:.08em;color:#fff0cf}
header p{margin:4px 0 0;font-size:14px}
main{width:min(1040px,calc(100% - 28px));margin:24px auto 56px}
.back{display:inline-block;padding:10px 18px;border-radius:30px;background:#fffaf0;border:1px solid #d2bd91;box-shadow:0 2px 4px #54351c20}
h2{color:#39271d;font-size:clamp(26px,4vw,36px);margin:12px 0 22px}
.tabs{gap:12px;margin-bottom:20px}
.tabs button{border:2px solid #c7ad7a;border-radius:16px;background:#fdf7e9;color:#553923;box-shadow:0 3px 0 #d8c69f;padding:14px 10px}
.tabs button.active{background:linear-gradient(#69452e,#432819);border-color:#9e7b48;color:#fff1d1;box-shadow:0 3px 0 #b99a62}
.panel{padding:clamp(20px,4vw,38px);border:2px solid #d5c092;border-radius:26px;background:rgba(255,251,240,.94);box-shadow:0 7px 0 #d7c59c,0 12px 26px #53351c18;line-height:1.9}
.panel h3{color:#563723}
.note{background:linear-gradient(110deg,#fff8e7,#f4e8c9);border:2px solid #d1bb88;border-left:5px solid #b99b63;border-radius:16px;padding:16px 18px;box-shadow:0 2px 0 #d7c49b}
#paragraphGame{max-width:820px;margin:24px auto 0}
#paragraphGame>h3{text-align:center;font-size:clamp(22px,3vw,30px)}
#gameScore{text-align:center;font-weight:800;border-left:0;border-radius:14px}
#gameQuestions .note{padding:22px;margin:18px 0!important}
#gameQuestions .note>b{font-size:18px;color:#68452e}
#gameQuestions .note>p{font-size:20px;line-height:1.8;margin:14px 0}
#gameQuestions select{width:100%;display:block;margin:12px 0;border:2px solid #cbb27e!important;border-radius:14px!important;background:#fffaf0!important;padding:14px!important;font-size:18px!important}
#gameQuestions button{padding:12px 18px!important;border-radius:12px!important;background:linear-gradient(#a92b29,#861b1a)!important;box-shadow:0 4px 0 #5d1715;color:#fff!important;font-size:16px}
#gameQuestions button:disabled{opacity:.55;box-shadow:none}
@media(max-width:600px){header{align-items:flex-start;flex-direction:column;gap:4px}.tabs{gap:7px}.tabs button{font-size:15px;padding:12px 5px}.panel{border-radius:20px}}


/* 國字注音專用測驗卡：依照使用者提供的測驗畫面 */
#zhuyin{background:transparent}
#zhuyin>h3{text-align:center;font-size:clamp(25px,4vw,34px);color:#493020;margin:8px 0 10px}
#zhuyin>p.muted{text-align:center;font-size:16px;color:#80694e}
#zhuyin #wordProgress{max-width:820px;margin:18px auto 8px;text-align:center;background:#eee7ff;border:0;border-radius:5px;padding:8px;color:#5d526c;font-weight:800}
#zhuyin #wordCard{max-width:960px;margin:18px auto 24px;padding:clamp(24px,5vw,54px);min-height:360px;border:2px solid #d7c392;border-radius:28px;background:linear-gradient(145deg,#fffaf0,#f8efd9);box-shadow:0 7px 0 #d3c097,0 12px 25px #4b321b1c}
#zhuyin #wordCard h2{font-size:clamp(32px,5vw,52px)!important;text-align:center!important;color:#2f2119!important;margin:8px 0 20px!important}
#zhuyin #wordCard p{color:#38291e}
#zhuyin #wordCard p:nth-of-type(1){font-size:clamp(17px,2vw,21px)!important;line-height:1.85!important;text-align:left!important;margin:0 auto 22px!important;max-width:780px}
#zhuyin #wordCard p:nth-of-type(2){font-size:18px;margin:10px 0 16px}
#zhuyin #wordCard>div{max-width:760px;margin:0 auto;gap:14px!important}
#zhuyin #wordCard label{min-height:76px;background:linear-gradient(110deg,#fff9e9,#f1e4bf)!important;border:2px solid #cbb47f!important;border-radius:20px!important;box-shadow:0 4px 0 #d3c092;font-size:clamp(16px,2vw,20px)!important;color:#39291e;transition:.15s}
#zhuyin #wordCard label:has(input:checked){background:#f4e6bf!important;border:3px solid #a72b28!important;box-shadow:0 4px 0 #c4a36a}
#zhuyin #wordCard input{accent-color:#a52624}
#zhuyin #wordPrev,#zhuyin #wordNext,#zhuyin #wordFinish{border-radius:13px!important;padding:13px 22px!important;font-size:17px!important}
#zhuyin #wordFinish{background:linear-gradient(#b52d2b,#8d1d1b)!important;box-shadow:0 4px 0 #5c1715!important;color:#fff!important}
#zhuyin #wordResult{text-align:center;font-size:19px;font-weight:800}
@media(max-width:620px){#zhuyin #wordCard>div{grid-template-columns:1fr!important}#zhuyin #wordCard{padding:22px 16px}#zhuyin #wordCard label{min-height:60px}}


/* 喇叭報讀鍵與確認答案按鍵分離，採圖示輕量樣式 */
.read-aloud-btn{display:inline-flex!important;align-items:center;justify-content:center;width:44px;height:44px;padding:0!important;margin:0 0 12px!important;border:2px solid #cbb47f!important;border-radius:50%!important;background:#fffaf0!important;color:#7d4a2c!important;box-shadow:none!important;font-size:22px!important;line-height:1;cursor:pointer}
.read-aloud-btn:hover{background:#f1e4c7!important;transform:scale(1.05)}
#zhuyin #wordCard .zhuyin-choice[aria-pressed="true"]{background:linear-gradient(120deg,#e7f1d9,#f5f0d9)!important;border:3px solid #6c9552!important;box-shadow:0 5px 0 #b5c99a!important;transform:translateY(-2px)}
#zhuyin #wordCard .zhuyin-choice:disabled{opacity:.85;cursor:default}
#zhuyin #wordCard .zhuyin-choice:focus-visible{outline:3px solid #8b6ac0;outline-offset:3px}
#zhuyin #wordCard>div{gap:16px!important}
#meaning #matchProgress{max-width:820px;margin:18px auto 8px;text-align:center;border:0;border-radius:12px;font-weight:800}
#meaning #matchCard{max-width:900px;margin:18px auto 22px;padding:clamp(22px,4vw,38px);border:2px solid #d7c392;border-radius:24px;background:linear-gradient(145deg,#fffaf0,#f8efd9);box-shadow:0 6px 0 #d3c097}
#meaning #matchCard h2{font-size:clamp(22px,3.5vw,30px);line-height:1.6;margin:10px 0 18px}
#meaning #matchCard .match-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:780px;margin:18px auto}
#meaning #matchCard .match-choice{min-height:78px;padding:15px;border:2px solid #cbb47f;border-radius:16px;background:linear-gradient(110deg,#fff9e9,#f1e4bf);color:#39291e;font-size:clamp(16px,2vw,19px);font-weight:700;text-align:left;box-shadow:0 4px 0 #d3c092;cursor:pointer}
#meaning #matchCard .match-choice:disabled{opacity:.9;cursor:default}
#meaning #matchPrev,#meaning #matchNext,#meaning #matchFinish{padding:12px 20px;border:0;border-radius:12px;background:#765034;color:white;font-weight:800;cursor:pointer}
#meaning #matchFinish{background:linear-gradient(#b52d2b,#8d1d1b);box-shadow:0 4px 0 #5c1715}
#meaning #matchPrev:disabled,#meaning #matchNext:disabled,#meaning #matchFinish:disabled{opacity:.45;cursor:default}
#meaning #matchResult{text-align:center;font-size:19px;font-weight:800}
@media(max-width:620px){#meaning #matchCard .match-options{grid-template-columns:1fr}#meaning #matchCard{padding:20px 14px}}

.answer-celebrate{position:relative!important;animation:correctPop .55s ease!important;border-color:#65a66b!important;box-shadow:0 0 0 4px #bde8a8,0 8px 22px #79b86a66!important}
.answer-correct{color:#246c3a!important;background:linear-gradient(100deg,#e5f8d9,#fff5c9)!important;animation:correctGlow .7s ease both}
.answer-correct:before{content:"🌟 🎉 ✨";display:block;font-size:24px;letter-spacing:8px;margin-bottom:6px;animation:starBounce .7s ease}
@keyframes correctPop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes correctGlow{0%{transform:scale(.96);opacity:.5}65%{transform:scale(1.025)}100%{transform:scale(1);opacity:1}}
@keyframes starBounce{0%{transform:translateY(8px) scale(.5);opacity:0}70%{transform:translateY(-4px) scale(1.15)}100%{transform:translateY(0) scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.answer-celebrate,.answer-correct,.answer-correct:before{animation:none!important}}

/* 答對時的中央彈出慶祝動畫 */
.correct-pop{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(20,35,48,.24);animation:popFade .95s ease forwards;pointer-events:none}
.correct-pop-card{background:linear-gradient(145deg,#fffdf0,#fff);border:3px solid #ffd45c;border-radius:26px;padding:28px 38px;text-align:center;box-shadow:0 16px 45px rgba(42,65,80,.24);animation:popBounce .72s cubic-bezier(.2,1.5,.4,1) both}
.correct-pop-stars{font-size:32px;letter-spacing:8px;animation:starSpin .8s ease both}
.correct-pop-title{font-size:30px;font-weight:900;color:#df8a16;margin:8px 0}
.correct-pop-sub{font-size:17px;font-weight:700;color:#52704a}
@keyframes popBounce{0%{opacity:0;transform:scale(.35) translateY(35px)}65%{opacity:1;transform:scale(1.12) translateY(-5px)}100%{opacity:1;transform:scale(1)}}
@keyframes popFade{0%,72%{opacity:1}100%{opacity:0}}
@keyframes starSpin{0%{transform:rotate(-18deg) scale(.4)}70%{transform:rotate(12deg) scale(1.2)}100%{transform:rotate(0) scale(1)}}

.flashcard-stage{margin:18px 0 22px;padding:clamp(18px,3vw,28px);border:2px solid #d8c18d;border-radius:22px;background:linear-gradient(145deg,#fffaf0,#f4e8cb);box-shadow:0 6px 0 #e2d3ae}
.flashcard-stage[hidden],.flashcard-practice[hidden]{display:none!important}
.flashcard-heading{text-align:center;font-size:20px;font-weight:900;color:#76502e;margin:0 0 8px}
.flashcard-count{text-align:center;color:#8a795d;font-weight:800;margin-bottom:12px}
.flashcard-face{position:relative;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;border:2px solid #e0cfaa;border-radius:18px;background:#fffdf6;text-align:center;perspective:1000px;transform-style:preserve-3d}
.flashcard-face.flashcard-flip-in{animation:flashcardFlipIn .65s cubic-bezier(.2,.75,.25,1) both}
.flashcard-countdown{display:flex;align-items:center;justify-content:center;width:66px;height:82px;margin:0 auto 10px;background:transparent;border:0;box-shadow:none;perspective:none}
.flashcard-hourglass{width:58px;height:78px;overflow:visible}
.flashcard-hourglass .sand-top{transform-box:fill-box;transform-origin:50% 0%;animation:sandDrain 5s linear forwards}
.flashcard-hourglass .sand-bottom{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(.08);animation:sandCollect 5s linear forwards}
.flashcard-hourglass .sand-stream{animation:sandStream 5s linear forwards}
.flashcard-hourglass .glass-frame{fill:none;stroke:#987343;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.flashcard-hourglass .sand{fill:#d6ad62}
@keyframes sandDrain{from{transform:scaleY(1)}to{transform:scaleY(0)}}
@keyframes sandCollect{from{transform:scaleY(.08)}to{transform:scaleY(1)}}
@keyframes sandStream{0%,92%{opacity:1}100%{opacity:0}}
.flashcard-practice.flashcard-reveal{transform-origin:center;backface-visibility:visible;animation:questionCardFlip .78s cubic-bezier(.18,.75,.25,1) both}
@keyframes flashcardFlipIn{0%{opacity:0;transform:rotateY(-88deg) scale(.92)}70%{opacity:1;transform:rotateY(10deg) scale(1.02)}100%{opacity:1;transform:rotateY(0) scale(1)}}
@keyframes questionCardFlip{0%{opacity:0;transform:perspective(1100px) rotateY(88deg) scale(.94)}65%{opacity:1;transform:perspective(1100px) rotateY(-8deg) scale(1.015)}100%{opacity:1;transform:perspective(1100px) rotateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.flashcard-face.flashcard-flip-in,.flashcard-hourglass .sand-top,.flashcard-hourglass .sand-bottom,.flashcard-hourglass .sand-stream,.flashcard-practice.flashcard-reveal{animation:none!important}}
.flashcard-front{font-size:clamp(20px,3vw,27px);font-weight:900;line-height:1.7;color:#4f4438}
.flashcard-answer{font-size:clamp(22px,3.4vw,31px);font-weight:900;line-height:1.6;color:#38734a}
.flashcard-note{font-size:16px;line-height:1.7;color:#806c50}
.flashcard-actions{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.flashcard-actions button{border:0;border-radius:12px;padding:11px 18px;background:#765034;color:#fff8e8;font-weight:900;cursor:pointer}
.flashcard-actions button:disabled{opacity:.4;cursor:default}

<body>

<script>
const params=new URLSearchParams(location.search);
const key=params.get('lesson')||'ailian';
const isAilian=key==='ailian';
const isBird=key==='bird';

// 學徒模式：每題先看 5 秒閃卡，接著練習同一道題；答題後再看下一張。
let learningMode=localStorage.getItem('learningIslandMode_'+key)||'challenge';
const flashcardModules=[];
function registerFlashcardModule(practiceEl,cards,title){
 if(!practiceEl||!cards||!cards.length)return null;
 const stage=document.createElement('section');stage.className='flashcard-stage';
 const heading=document.createElement('h3');heading.className='flashcard-heading';heading.textContent='🎓 學徒閃卡｜'+title;
 const count=document.createElement('div');count.className='flashcard-count';
 const countdown=document.createElement('div');countdown.className='flashcard-countdown';countdown.setAttribute('role','img');countdown.setAttribute('aria-label','沙漏倒數五秒');
 countdown.innerHTML='<svg class="flashcard-hourglass" viewBox="0 0 60 84" aria-hidden="true"><path class="glass-frame" d="M9 4H51 M9 80H51 M13 6C13 24 23 29 30 42C37 55 47 60 47 78 M47 6C47 24 37 29 30 42C23 55 13 60 13 78"/><path class="sand sand-top" d="M16 10H44C43 22 36 28 30 36C24 28 17 22 16 10Z"/><path class="sand sand-bottom" d="M30 48C36 57 43 63 44 74H16C17 63 24 57 30 48Z"/><path class="sand sand-stream" d="M29 35H31V51H29Z"/></svg>';
 const face=document.createElement('div');face.className='flashcard-face';
 const front=document.createElement('div');front.className='flashcard-front';
 const answer=document.createElement('div');answer.className='flashcard-answer';
 const note=document.createElement('div');note.className='flashcard-note';
 face.append(front,answer,note);stage.append(heading,count,countdown,face);
 let index=0,timer=null,waiter=null,token=0,renderer=null,nextTimer=null,revealTimer=null;
 function stop(){token++;clearTimeout(timer);clearTimeout(waiter);clearTimeout(nextTimer);clearTimeout(revealTimer);}
 function show(i){
  stop();index=i;
  if(learningMode!=='apprentice'){stage.hidden=true;practiceEl.hidden=false;practiceEl.classList.remove('flashcard-reveal');renderer?.(i);return;}
  stage.hidden=false;practiceEl.hidden=true;const t=token;
  const begin=()=>{if(t!==token)return;if(!stage.getClientRects().length){waiter=setTimeout(begin,150);return;}
   const item=cards[index]||{};count.textContent='閃卡 '+(index+1)+'／'+cards.length+'｜記住答案，倒數後作答';front.textContent=item.front||'請記住這個重點';answer.textContent='正確答案：'+(item.back||'');note.textContent='倒數結束，這一題就會翻轉出現！';
   face.classList.remove('flashcard-flip-in');void face.offsetWidth;face.classList.add('flashcard-flip-in');
   timer=setTimeout(()=>{if(t!==token)return;stage.hidden=true;practiceEl.hidden=false;renderer?.(index);practiceEl.classList.remove('flashcard-reveal');void practiceEl.offsetWidth;practiceEl.classList.add('flashcard-reveal');revealTimer=setTimeout(()=>practiceEl.classList.remove('flashcard-reveal'),900);},5000);
  };begin();
 }
 function advance(i){if(learningMode!=='apprentice'||i!==index)return;if(i<cards.length-1)nextTimer=setTimeout(()=>show(i+1),800);}
 function apply(reset){if(reset)index=0;if(learningMode==='apprentice')show(0);else{stop();stage.hidden=true;practiceEl.hidden=false;renderer?.(index);}}
 practiceEl.classList.add('flashcard-practice');practiceEl.parentNode.insertBefore(stage,practiceEl);
 const api={apply,advance,setRenderer(fn){renderer=fn;}};flashcardModules.push(api);apply(true);return api;
 }
function setLearningMode(mode){
 learningMode=mode;localStorage.setItem('learningIslandMode_'+key,mode);
 const apprentice=mode==='apprentice';
 document.getElementById('apprenticeMode').setAttribute('aria-pressed',String(apprentice));
 document.getElementById('challengeMode').setAttribute('aria-pressed',String(!apprentice));
 document.getElementById('modeDescription').textContent=apprentice?'目前是學徒模式：先看每個練習單元的正確答案閃卡，再按「開始練習」。':'目前是挑戰模式：不提供答案提示，直接作答，完成作答後才公布正確答案。';
 flashcardModules.forEach(module=>module.apply(true));
}
document.getElementById('apprenticeMode').addEventListener('click',()=>setLearningMode('apprentice'));
document.getElementById('challengeMode').addEventListener('click',()=>setLearningMode('challenge'));
document.getElementById('apprenticeMode').setAttribute('aria-pressed',String(learningMode==='apprentice'));
document.getElementById('challengeMode').setAttribute('aria-pressed',String(learningMode!=='apprentice'));
document.getElementById('modeDescription').textContent=learningMode==='apprentice'?'目前是學徒模式：先看每個練習單元的正確答案閃卡，再按「開始練習」。':'目前是挑戰模式：不提供答案提示，直接作答，完成作答後才公布正確答案。';

// === 各課文獨立修練進度 ===
const progressKey='learningIslandTraining_'+key;
const training={modules:{},answers:{}};
function registerTrainingModule(id,total){
 training.modules[id]=total;
 if(!training.answers[id])training.answers[id]={};
 renderTrainingProgress();
}
function recordTrainingAnswer(id,index,correct){
 if(!training.answers[id])training.answers[id]={};
 training.answers[id][index]=!!correct;
 renderTrainingProgress();
}
function renderTrainingProgress(){
 Object.entries(training.modules).forEach(([id,total])=>{
  const answers=training.answers[id]||{};
  const answered=Object.keys(answers).length;
  if(total>0&&answered>=total&&!training.completedModules?.[id]){
   if(!training.completedModules)training.completedModules={};
   training.completedModules[id]=true;
   const correct=Object.values(answers).filter(Boolean).length;
   const points=Math.max(0,Math.min(10,Math.round(correct/total*10)));
   showTrainingScore(points,correct,total,id);
  }
 });
}
function showTrainingScore(points,correct,total,moduleId){
 const overlay=document.createElement('div');
 overlay.className='training-victory';
 overlay.innerHTML='<div class="victory-card"><div class="victory-stars">✨ ⭐ ✨</div><div class="victory-trophy">🏆</div><h2>本單元練習完成！</h2><p>答對 '+correct+'／'+total+' 題</p><p style="font-size:24px;font-weight:900;color:#8a5b20">本次加分：+'+points+' 分</p><div class="victory-confetti">🎉 🌟 🎊 🌸 🎉</div><button type="button">繼續學習</button></div>';
 document.body.appendChild(overlay);
 overlay.querySelector('button').addEventListener('click',()=>overlay.remove());
 setTimeout(()=>overlay.classList.add('show'),30);
}
function showTrainingVictory(){
 const overlay=document.createElement('div');
 overlay.className='training-victory';
 overlay.innerHTML='<div class="victory-card"><div class="victory-stars">✨ ⭐ ✨</div><div class="victory-trophy">🏆</div><h2>修練完成！</h2><p>太棒了！本課所有題目都答對了！</p><div class="victory-confetti">🎉 🌟 🎊 🌸 🎉</div><button type="button">繼續學習</button></div>';
 document.body.appendChild(overlay);
 overlay.querySelector('button').addEventListener('click',()=>overlay.remove());
 setTimeout(()=>overlay.classList.add('show'),30);
}

document.querySelector('.tabs button[data-tab="meaning"]').textContent='📚 解釋';
document.getElementById('lessonTitle').textContent=isAilian?'愛蓮說':(isBird?'鳥':'生命中的碎珠');
let sections=isAilian?{
text:`<h3>《愛蓮說》｜周敦頤</h3><div class="poem">水陸草木之花，可愛者甚蕃。
晉陶淵明獨愛菊；自李唐來，世人甚愛牡丹。
予獨愛蓮之出淤泥而不染，濯清漣而不妖，
中通外直，不蔓不枝，香遠益清，亭亭淨植，
可遠觀而不可褻玩焉。

予謂菊，花之隱逸者也；
牡丹，花之富貴者也；
蓮，花之君子者也。
噫！菊之愛，陶後鮮有聞。
蓮之愛，同予者何人？
牡丹之愛，宜乎眾矣。</div><p class="muted">※ 課文標點與用字請以學校使用的課本版本為準。</p>`,
zhuyin:`<h3>重要國字注音</h3><p>以下整理課文中較容易讀錯的字：</p>
<div class="note"><ruby>蕃<rt>ㄈㄢˊ</rt></ruby>：多。　<ruby>濯<rt>ㄓㄨㄛˊ</rt></ruby>：洗滌。　<ruby>漣<rt>ㄌㄧㄢˊ</rt></ruby>：水面細小的波紋。</div>
<div class="note"><ruby>蔓<rt>ㄇㄢˋ</rt></ruby>：細長、延伸的莖。　<ruby>褻<rt>ㄒㄧㄝˋ</rt></ruby>：不莊重、不尊敬。　<ruby>鮮<rt>ㄒㄧㄢˇ</rt></ruby>：少。</div>
<div class="note"><ruby>逸<rt>ㄧˋ</rt></ruby>：安閒、隱居。　<ruby>宜<rt>ㄧˊ</rt></ruby>：應當、理所當然。</div>`,
meaning:`<h3>語句解釋</h3>
<div class="note"><b>出淤泥而不染：</b>蓮花從污泥中長出，卻不被污泥沾染。比喻身處不良環境，仍能保持純潔。</div>
<div class="note"><b>濯清漣而不妖：</b>經過清水洗滌，卻不顯得過分艷麗。形容端莊而不媚俗。</div>
<div class="note"><b>中通外直：</b>蓮的內部通透、外形挺直，比喻胸襟通達、行為正直。</div>
<div class="note"><b>不蔓不枝：</b>不牽牽連連，也不旁生枝節，比喻處事簡潔、不攀附。</div>
<div class="note"><b>香遠益清，亭亭淨植：</b>香氣傳得越遠越清幽，蓮花潔淨地挺立著。</div>
<div class="note"><b>花之君子者也：</b>蓮是花中的君子，作者藉蓮花讚美正直、清廉、自持的品格。</div>
<div class="note"><b>全文主旨：</b>作者以菊、牡丹、蓮象徵不同的人生態度，藉愛蓮表達對君子品格的推崇。</div>`
}:{
text:`<h3>《生命中的碎珠》｜課文</h3>
<div class="poem" style="text-align:left;font-size:18px;line-height:2.15;white-space:normal">
<p>沒有一樣事物，比現在的按鍵電話更能具體地說明這是一個分秒必爭的世界了。的確，現代人連讓電話轉盤撥轉回來的一兩秒時間都不願等待，我們還能懷疑這不是個節奏迅速、步履匆忙的時代嗎？</p>
<p>也許，正因為點點滴滴的時間，都可能是致勝的關鍵，值得我們加以珍惜、爭取。因此，能掌握時間—尤其是零碎時間—的人，往往也都是令人欽佩仰慕的智者、成功者。</p>
<p>胡適先生曾以「不做無益事，一日當三日，人活五十歲，我活百五十」的生活哲學來自勉。雖然他每日在著書立說<sup>1</sup>、從事學術研究和教育工作之外，還要親自處理諸多繁雜事務，但由於能充分掌握、支配零碎時間，因此，仍然生活得從容自如<sup>2</sup>，處處流露出一個溫藹<sup>3</sup>學者的修養與風範，從不覺得時間不敷<sup>4</sup>使用。</p>
<p>美國歷史上最年輕的總統甘迺迪先生，常常在他接見的第一位客人起身離去，第二位客人尚未踏進會客室之前，也必拿起手邊的書籍閱讀，絕不輕易浪費這些短暫的空檔。正因為他善用時間來充實學識，所以當有人批評他的髮型過於古板難看時，甘迺迪才能自信地回答：「我相信治國的本領，不在頭皮上面，而在頭皮下面。」</p>
<p>撇開<sup>5</sup>近人不談，在古代從容、悠閒的農業社會裡，就已有許多懂得珍惜生命、善於利用瑣碎時間的哲人了。陶淵明曾經說過：「盛年不重來，一日難再晨，及時當勉勵，歲月不待人<sup>6</sup>。」千字文<sup>7</sup>中也有「尺璧非寶，寸陰是競<sup>8</sup>」的格言。而宋代大儒歐陽脩，更是一個善於利用零碎時間的生活藝術家。他常利用「三上」的工夫構思文章，何謂「三上」？那便是「枕上、廁上、馬上」。生活在今天的我們，如果每天也能利用這些短暫的時間，有恆地記誦一首唐詩、宋詞、一句格言或背幾個英文單字，一年下來，該有多少的收穫啊！</p>
<p>有一個發人深省的比喻：在一個空無一物的箱子裡，我們最初可以放進一些大石頭，等到再也放不進大石頭時，餘下的空隙，我們可放進不少小石頭；當小石頭已放滿時，還可容納許多細沙；等到細沙也把箱子裡所有的空間都填實了，我們仍可再注入不少清水……。</p>
<p>如果我們每天的二十四小時，就是這口大箱，而我們吃飯、睡覺、洗澡、上學、辦公、休閒、沉思的時間，就相當於箱裡大大小小的石頭，那麼，仍有不少零星、分散的空隙，可供我們完成許多事務。能不能掌握、利用它們，讓每天的生活更加充實，就全靠我們自己了。</p>
<p>積沙能夠成塔<sup>9</sup>，集腋可以成裘<sup>10</sup>。零碎的時間，應該是生命中的碎珠、沙金、片玉，能勤於撿拾，並集合它們，那的確是一宗<sup>11</sup>可觀的財富！</p>
</div>`,

 <h3>《愛蓮說》｜課文句子重組</h3>
 
 <section id="ailianRebuild" class="note" style="background:#fff9ed;border:2px solid #d4bd8a;border-radius:18px;padding:20px">

 const rebuildItems=[

  {prompt:'第一段｜請重組句子：',parts:['予獨愛蓮之','出淤泥而不染，','濯清漣而不妖。']},

 const tileHost=document.getElementById('ailianTiles'),slotHost=document.getElementById('ailianSlots');
 const feedback=document.getElementById('ailianFeedback');
 function drawRebuild(){
  const q=rebuildItems[rebuildIndex];placed=Array(q.parts.length).fill(null);
  document.getElementById('ailianPrompt').textContent='';
  feedback.textContent='';
  tileHost.innerHTML='';slotHost.innerHTML='';

 });

}

/* 答對即時回饋：短音效、亮起與星星動畫 */
function celebrateCorrect(target,feedback){
 const pop=document.createElement('div');pop.className='correct-pop';pop.innerHTML='<div class="correct-pop-card"><div class="correct-pop-stars">⭐ ✨ ⭐</div><div class="correct-pop-title">答對了！太棒了！</div><div class="correct-pop-sub">你做到了，繼續加油！</div></div>';document.body.appendChild(pop);window.setTimeout(()=>pop.remove(),1000);
 try{
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  if(AudioCtx){
   const ctx=new AudioCtx();
   const now=ctx.currentTime;
   [[659.25,0],[783.99,.13],[987.77,.26]].forEach(([freq,delay])=>{
    const osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.type='sine';osc.frequency.setValueAtTime(freq,now+delay);
    gain.gain.setValueAtTime(.0001,now+delay);
    gain.gain.exponentialRampToValueAtTime(.16,now+delay+.02);
    gain.gain.exponentialRampToValueAtTime(.0001,now+delay+.2);
    osc.connect(gain);gain.connect(ctx.destination);osc.start(now+delay);osc.stop(now+delay+.22);
   });
   window.setTimeout(()=>ctx.close(),900);
  }
 }catch(e){}
 if(target){target.classList.remove('answer-celebrate');void target.offsetWidth;target.classList.add('answer-celebrate');}
 if(feedback){feedback.classList.remove('answer-correct');void feedback.offsetWidth;feedback.classList.add('answer-correct');}
}

function renderWordQuestion(){
 const q=wordQuiz[wordIndex];
 zy.querySelector('#wordProgress').textContent='第 '+(wordIndex+1)+' 題／共 '+wordQuiz.length+' 題　｜　已答 '+wordAnswers.filter(x=>x!==null).length+' 題';
 wordCard.innerHTML='';
 const heading=document.createElement('h2');
 heading.style.cssText='font-size:30px;text-align:center;margin:16px 0 22px;color:#68452e';
 heading.textContent=(q.display||((q.askZhuyin?'注音：':'國字：')+q.stimulus)).replace(/（　　　　）/g,'');
 wordCard.appendChild(heading);
 if(isBird&&q.question){const prompt=document.createElement('p');prompt.textContent=q.question;prompt.style.cssText='margin:0 auto 18px;text-align:center;font-size:22px;font-weight:800;color:#765034';wordCard.appendChild(prompt);}

 const choices=document.createElement('div');
 choices.style.cssText='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px';
 q.options.forEach((opt,k)=>{
  const button=document.createElement('button');
  button.type='button';
  button.className='zhuyin-choice';
  button.setAttribute('aria-pressed',String(wordAnswers[wordIndex]===k));
  button.disabled=wordAnswers[wordIndex]!==null;
  button.style.cssText='display:flex;align-items:center;gap:12px;text-align:left;background:#fff9ed;border:2px solid #d7bd91;border-radius:18px;padding:18px;cursor:pointer;font-size:clamp(17px,2vw,21px);font-weight:700;color:#493321;min-height:78px;box-shadow:0 5px 0 #d4c092;overflow-wrap:anywhere';
  const badge=document.createElement('span');
  badge.textContent=['🌱','⭐','🔔','💎'][k];
  badge.style.cssText='font-size:24px;flex:0 0 auto';
  const label=document.createElement('span');
  label.textContent=wordLetters[k]+'．'+opt;
  button.appendChild(badge);
  button.appendChild(label);
  button.addEventListener('click',()=>{
   if(wordAnswers[wordIndex]!==null)return;
   wordAnswers[wordIndex]=k;
   recordTrainingAnswer('pronunciation',wordIndex,k===q.answer);
   if(k===q.answer)celebrateCorrect(wordCard);
   renderWordQuestion();wordFlash?.advance(wordIndex);
  });
  choices.appendChild(button);
 });
 wordCard.appendChild(choices);
 if(wordAnswers[wordIndex]!==null){
  const correct=wordAnswers[wordIndex]===q.answer;
  const feedback=document.createElement('p');
  feedback.style.cssText='margin:22px auto 0;padding:16px;border-radius:14px;text-align:center;font-size:20px;font-weight:800;background:'+(correct?'#e7f2df':'#f8e5dc')+';color:'+(correct?'#356b38':'#9b332b');
  feedback.textContent=(correct?'🎉 答對了！太棒了！':'再加油！')+' 正確答案：'+wordLetters[q.answer]+'．'+q.options[q.answer];if(correct)feedback.classList.add('answer-correct');
  wordCard.appendChild(feedback);
 }
 zy.querySelector('#wordPrev').disabled=wordIndex===0;
 zy.querySelector('#wordNext').disabled=wordIndex===wordQuiz.length-1;
 zy.querySelector('#wordFinish').disabled=wordAnswers.some(x=>x===null);
}
zy.querySelector('#wordPrev').addEventListener('click',()=>{
 if(wordIndex>0){wordIndex--;renderWordQuestion();}
});
zy.querySelector('#wordNext').addEventListener('click',()=>{
 if(wordIndex<wordQuiz.length-1){wordIndex++;renderWordQuestion();}
});
zy.querySelector('#wordFinish').addEventListener('click',()=>{
 if(wordAnswers.some(x=>x===null))return;
 const score=wordQuiz.filter((q,i)=>wordAnswers[i]===q.answer).length;
 zy.querySelector('#wordResult').textContent='🎊 挑戰完成！答對 '+score+'／'+wordQuiz.length+' 題。';
});
wordFlash?.setRenderer(i=>{wordIndex=i;renderWordQuestion();});
renderWordQuestion();

  {term:'一行白鷺上青天',definition:'一排白鷺鳥飛向高高的青色天空。',distractors:['一群黑鳥停在地面上。','一隻白鷺站在河邊喝水。','許多鳥兒飛進茂密的樹林。']},
  {term:'黛',definition:'青黑色，常用來形容山色或眉色。',distractors:['鮮豔明亮的紅色。','淡淡柔和的黃色。','潔白透明的顏色。']},
  {term:'釉綠',definition:'像陶瓷釉面一樣，油亮而有光澤的綠色。',distractors:['乾燥暗淡的灰綠色。','鮮紅明亮的顏色。','沒有光澤的土黃色。']},
  {term:'煙突',definition:'煙囪，讓煙往外排出的管道。',distractors:['用來收集雨水的水管。','讓新鮮空氣進入屋內的窗戶。','用來儲存柴火的小房間。']},
  {term:'鼓噪',definition:'大聲喧嘩吵鬧。',distractors:['輕聲細語，保持安靜。','整齊有節奏地唱歌。','安靜地坐著聽別人說話。']}
 ];;
 const birdQuestions=birdMeaningEntries.map((entry,index)=>{
  const answer=index%4;
  const options=[];
  let distractor=0;
  for(let slot=0;slot<4;slot++){
   if(slot===answer){options.push(entry.definition);}
   else{options.push(entry.distractors[distractor++]);}
  }
  return {prompt:'「'+entry.term+'」的意思是？',answer,options};
 });
 const letters=['A','B','C','D'],answers=Array(birdQuestions.length).fill(null);
 const meaningPanel=document.getElementById('meaning');
 const birdPractice=document.createElement('div');
 while(meaningPanel.firstChild)birdPractice.appendChild(meaningPanel.firstChild);
 meaningPanel.appendChild(birdPractice);
 const birdFlash=registerFlashcardModule(birdPractice,birdQuestions.map(q=>({front:q.prompt,back:q.options[q.answer],note:'先記住詞語的正確意思，再進入選擇題。'})),'鳥課文詞語解釋');
 registerTrainingModule('explanation',birdQuestions.length);
 let current=0;const card=document.getElementById('matchCard');
 function renderBirdMatch(){
  const q=birdQuestions[current];
  document.getElementById('matchProgress').textContent='第 '+(current+1)+' 題／共 '+birdQuestions.length+' 題　｜　已答 '+answers.filter(x=>x!==null).length+' 題';
  card.innerHTML='';
  const h=document.createElement('h2');h.textContent=q.prompt;card.appendChild(h);
  const read=document.createElement('button');read.type='button';read.className='read-aloud-btn';read.textContent='🔊';read.title='報讀題目';read.addEventListener('click',()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.prompt+'。'+q.options.join('。'));u.lang='zh-TW';u.rate=.78;speechSynthesis.speak(u);}});card.appendChild(read);
  const options=document.createElement('div');options.className='match-options';
  q.options.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='match-choice';b.textContent=letters[i]+'．'+v;b.disabled=answers[current]!==null;b.addEventListener('click',()=>{if(answers[current]!==null)return;answers[current]=i;recordTrainingAnswer('explanation',current,i===q.answer);if(i===q.answer)celebrateCorrect(card);renderBirdMatch();birdFlash?.advance(current);});options.appendChild(b);});
  card.appendChild(options);
  if(answers[current]!==null){const ok=answers[current]===q.answer;const p=document.createElement('p');p.style.cssText='margin:18px auto 0;padding:14px;border-radius:14px;text-align:center;font-weight:800;background:'+(ok?'#e7f2df':'#f8e5dc')+';color:'+(ok?'#356b38':'#9b332b');p.textContent=(ok?'🎉 答對了！':'再加油！')+' 正確答案：'+letters[q.answer]+'．'+q.options[q.answer];card.appendChild(p);}
  document.getElementById('matchPrev').disabled=current===0;document.getElementById('matchNext').disabled=current===birdQuestions.length-1;document.getElementById('matchFinish').disabled=answers.some(x=>x===null);
 }
 document.getElementById('matchPrev').addEventListener('click',()=>{if(current>0){current--;renderBirdMatch();}});
 document.getElementById('matchNext').addEventListener('click',()=>{if(current<birdQuestions.length-1){current++;renderBirdMatch();}});
 document.getElementById('matchFinish').addEventListener('click',()=>{const score=birdQuestions.filter((q,i)=>answers[i]===q.answer).length;document.getElementById('matchResult').textContent='🎊 練習完成！答對 '+score+'／'+birdQuestions.length+' 題。';});
 birdFlash?.setRenderer(i=>{current=i;renderBirdMatch();});
 renderBirdMatch();
}

document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===btn.dataset.tab));}));



</script>
</body>
