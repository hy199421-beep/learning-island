<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相似字守衛戰 - 字辨小學堂</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
            user-select: none; /* 防止意外反白文字 */
        }

        /* 隱藏未顯示的畫面 */
        .hidden-screen {
            display: none !important;
        }

        /* 3D 按鈕效果 */
        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 6px 0 var(--btn-shadow, #94a3b8);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0px 0 var(--btn-shadow, #94a3b8);
        }
        .btn-3d:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .btn-blue { background-color: #3b82f6; --btn-shadow: #2563eb; color: white; }
        .btn-green { background-color: #22c55e; --btn-shadow: #16a34a; color: white; }
        .btn-yellow { background-color: #eab308; --btn-shadow: #ca8a04; color: white; }
        
        /* 選項按鈕樣式 */
        .option-btn {
            background-color: white;
            --btn-shadow: #cbd5e1;
            color: #334155;
            border: 2px solid #e2e8f0;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f8fafc;
            border-color: #94a3b8;
        }
        .option-btn.correct {
            background-color: #dcfce7;
            border-color: #22c55e;
            --btn-shadow: #16a34a;
            color: #166534;
        }
        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: #ef4444;
            --btn-shadow: #dc2626;
            color: #991b1b;
        }

        /* 注音標音樣式 */
        rt {
            font-size: 0.5em;
            color: #64748b;
            font-weight: normal;
        }
        .option-btn.correct rt { color: #166534; }
        .option-btn.wrong rt { color: #991b1b; }

        /* 動畫 */
        @keyframes bounce-in {
            0% { transform: scale(0.8); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-bounce-in {
            animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 題目空格 */
        .blank-space {
            display: inline-block;
            min-width: 3rem;
            border-bottom: 4px solid #cbd5e1;
            text-align: center;
            color: #3b82f6;
            font-weight: 900;
            padding: 0 0.5rem;
            line-height: 1;
        }

        /* 填滿畫布用的 confetti */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 粒子特效畫布 (過關時顯示) -->
    <canvas id="confetti-canvas" class="hidden"></canvas>

    <!-- 遊戲容器 -->
    <div id="app" class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl overflow-hidden border-4 border-green-200">
        
        <!-- 畫面 1：開始畫面 -->
        <div id="screen-start" class="p-8 text-center animate-bounce-in">
            <div class="text-6xl mb-4">🧙‍♂️</div>
            <h1 class="text-4xl md:text-5xl font-black text-green-700 mb-4 tracking-wider">相似字守衛戰</h1>
            <p class="text-lg text-gray-600 mb-8 font-medium">幫忙找出正確的字，修復被破壞的魔法句子！<br>挑戰你的形音義辨別能力！</p>
            <button onclick="startGame()" class="btn-3d btn-green text-2xl font-bold py-4 px-12 rounded-2xl w-full sm:w-auto">
                開始挑戰 🚀
            </button>
        </div>

        <!-- 畫面 2：遊戲畫面 -->
        <div id="screen-game" class="hidden-screen flex flex-col h-full">
            <!-- 頂部資訊列 -->
            <div class="bg-green-100 p-4 flex justify-between items-center border-b-4 border-green-200">
                <div class="text-green-800 font-bold text-lg bg-white px-4 py-1 rounded-full shadow-sm">
                    第 <span id="ui-question-num" class="text-xl text-green-600">1</span>/<span id="ui-total-questions">10</span> 題
                </div>
                <div class="text-green-800 font-bold text-lg bg-white px-4 py-1 rounded-full shadow-sm">
                    ⭐ 積分: <span id="ui-score" class="text-xl text-yellow-500">0</span>
                </div>
            </div>

            <!-- 題目區域 -->
            <div class="p-6 md:p-8 flex-grow flex flex-col justify-center">
                <div class="text-2xl md:text-3xl font-bold text-gray-800 leading-relaxed mb-8 text-center" id="ui-question-text">
                    <!-- 題目將透過 JS 注入 -->
                </div>

                <!-- 新增：部首記憶提示區 (在題目下方、選項上方) -->
                <div id="ui-hint-box" class="mb-8 w-full max-w-xl mx-auto bg-yellow-50 border-2 border-yellow-300 p-4 rounded-xl text-yellow-800 text-md md:text-lg shadow-sm flex flex-col items-center transition-all">
                    <button id="btn-show-hint" onclick="showHint()" class="btn-3d btn-yellow py-2 px-6 rounded-full text-white text-base md:text-lg font-bold flex items-center gap-2 hover:bg-yellow-500">
                        💡 需要部首小提示嗎？點我！
                    </button>
                    <div id="hint-content" class="hidden w-full flex items-start gap-3 mt-2">
                        <span class="text-3xl drop-shadow-sm">💡</span>
                        <div class="flex-grow">
                            <div class="text-yellow-600 text-sm mb-1 font-bold">部首小提示</div>
                            <span id="ui-hint-text" class="leading-relaxed font-bold"></span>
                        </div>
                    </div>
                </div>

                <!-- 選項按鈕區 -->
                <div id="ui-options" class="grid grid-cols-2 gap-4 md:gap-6 justify-center">
                    <!-- 選項將透過 JS 注入 -->
                </div>
            </div>

            <!-- 底部回饋與解說區塊 (預設隱藏) -->
            <div id="ui-feedback" class="hidden h-0 bg-gray-50 border-t-4 border-gray-200 p-6 flex flex-col items-center transition-all duration-300">
                <div class="flex items-center gap-4 mb-3 w-full justify-center">
                    <div id="feedback-icon" class="text-4xl">✅</div>
                    <div id="feedback-title" class="text-2xl font-black text-green-600">答對了！</div>
                </div>
                <p id="feedback-desc" class="text-gray-700 text-lg font-medium text-center mb-4 w-full max-w-xl"></p>

                <button id="btn-next" onclick="nextQuestion()" class="btn-3d btn-blue text-xl font-bold py-3 px-8 rounded-xl w-full sm:w-64">
                    下一題 ➡️
                </button>
            </div>
        </div>

        <!-- 畫面 3：結算畫面 -->
        <div id="screen-result" class="hidden-screen p-8 text-center">
            <div id="result-emoji" class="text-7xl mb-4">🏆</div>
            <h2 class="text-4xl font-black text-gray-800 mb-2">挑戰完成！</h2>
            <p class="text-xl text-gray-600 mb-6">你總共獲得了</p>
            <div class="text-6xl font-black text-yellow-500 mb-8 drop-shadow-md">
                <span id="ui-final-score">0</span> 分
            </div>
            <p id="result-message" class="text-lg text-gray-700 font-bold mb-8 bg-yellow-100 p-4 rounded-xl"></p>
            <div class="flex gap-4 justify-center flex-wrap">
                <button onclick="resetGame()" class="btn-3d btn-green text-xl font-bold py-3 px-8 rounded-xl">
                    🔄 再玩一次
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- 題庫資料 (融合使用者提供的易混淆字與部首記憶策略) ---
        const allQuestions = [
            // 第一組：淤 vs 瘀
            {
                text: "他不小心撞到桌角，大腿上多了一大塊[___]青。",
                options: [ { char: "淤", pinyin: "ㄩ" }, { char: "瘀", pinyin: "ㄩ" } ],
                answer: "瘀",
                explanation: "「瘀」指血液凝滯，常與受傷有關，如「瘀青」、「瘀血」。",
                memoryTip: "【部首記憶法】想一想，受傷、生病跟哪個部首有關呢？找找看哪個選項有「疒」（病字邊）！"
            },
            {
                text: "颱風過後，下水道積滿了[___]泥，導致嚴重淹水。",
                options: [ { char: "淤", pinyin: "ㄩ" }, { char: "瘀", pinyin: "ㄩ" } ],
                answer: "淤",
                explanation: "「淤」指水道被泥沙阻塞，如「淤積」、「淤泥」。",
                memoryTip: "【部首記憶法】下水道堵住跟泥沙、水流有關。找找看哪個選項帶有「氵」（水部）！"
            },
            
            // 第二組：褻 vs 褒
            {
                text: "校長在全校朝會上，特別[___]揚了見義勇為的同學。",
                options: [ { char: "褻", pinyin: "ㄒㄧㄝˋ" }, { char: "褒", pinyin: "ㄅㄠ" } ],
                answer: "褒",
                explanation: "「褒」字有讚美、表揚的意思，如「褒揚」、「褒獎」。",
                memoryTip: "【部首記憶法】表現優良值得被大家「保」護和讚美，看看哪個選項裡面藏著「保」字？"
            },
            {
                text: "在莊嚴的寺廟裡大聲喧嘩，是對神明的[___]瀆。",
                options: [ { char: "褻", pinyin: "ㄒㄧㄝˋ" }, { char: "褒", pinyin: "ㄅㄠ" } ],
                answer: "褻",
                explanation: "「褻」指不恭敬、輕浮，如「褻瀆」。",
                memoryTip: "【部首記憶法】態度不莊重，就像一個人很固「執」不聽勸。找找看哪個字裡有「執」？"
            },

            // 第三組：濯 擢 躍 耀
            {
                text: "聽到明天要去遊樂園校外教學，弟弟開心得雀[___]萬分。",
                options: [ 
                    { char: "濯", pinyin: "ㄓㄨㄛˊ" }, { char: "擢", pinyin: "ㄓㄨㄛˊ" }, 
                    { char: "躍", pinyin: "ㄩㄝˋ" }, { char: "耀", pinyin: "ㄧㄠˋ" } 
                ],
                answer: "躍",
                explanation: "「躍」有跳起的意思，如「雀躍」、「跳躍」。",
                memoryTip: "【部首記憶法】開心地跳起來，需要用到哪個身體部位呢？找找有「足」部的字！"
            },
            {
                text: "經理看中他的才華與努力，特別拔[___]他為部門主管。",
                options: [ 
                    { char: "濯", pinyin: "ㄓㄨㄛˊ" }, { char: "擢", pinyin: "ㄓㄨㄛˊ" }, 
                    { char: "躍", pinyin: "ㄩㄝˋ" }, { char: "耀", pinyin: "ㄧㄠˋ" } 
                ],
                answer: "擢",
                explanation: "「擢」有抽取、提拔之意，如「拔擢」。",
                memoryTip: "【部首記憶法】長官要提拔你，就像用手把你拉上來一樣。找找看有沒有「扌」（手部）的字！"
            },
            {
                text: "蓮花出[___]泥而不染。（在清水中洗過，卻不顯妖媚）",
                options: [ 
                    { char: "濯", pinyin: "ㄓㄨㄛˊ" }, { char: "擢", pinyin: "ㄓㄨㄛˊ" }, 
                    { char: "躍", pinyin: "ㄩㄝˋ" }, { char: "耀", pinyin: "ㄧㄠˋ" } 
                ],
                answer: "濯",
                explanation: "「濯」有洗滌的意思。這句古文形容蓮花高潔。",
                memoryTip: "【部首記憶法】洗東西一定需要用到水！找找看哪個字是「氵」（水部）？"
            },
            {
                text: "太陽出來了，平靜的湖面閃[___]著金色的光芒。",
                options: [ 
                    { char: "濯", pinyin: "ㄓㄨㄛˊ" }, { char: "擢", pinyin: "ㄓㄨㄛˊ" }, 
                    { char: "躍", pinyin: "ㄩㄝˋ" }, { char: "耀", pinyin: "ㄧㄠˋ" } 
                ],
                answer: "耀",
                explanation: "「耀」有光線強烈、炫耀的意思，如「閃耀」、「耀眼」。",
                memoryTip: "【部首記憶法】閃閃發光、非常刺眼。找找看哪個字旁邊有個「光」字！"
            },

            // 第四組：蔓 漫 謾
            {
                text: "森林裡濃霧彌[___]，開車在路上幾乎看不見前方的車輛。",
                options: [ { char: "蔓", pinyin: "ㄇㄢˋ" }, { char: "漫", pinyin: "ㄇㄢˋ" }, { char: "謾", pinyin: "ㄇㄢˋ" } ],
                answer: "漫",
                explanation: "「漫」有水滿溢出、遍布的意思，如「彌漫」、「漫山遍野」。",
                memoryTip: "【部首記憶法】想像大水滿出來，到處都是！跟水有關，找找看有沒有「氵」（水部）！"
            },
            {
                text: "外婆家後院的藤[___]，不知不覺已經爬滿了整面紅磚牆壁。",
                options: [ { char: "蔓", pinyin: "ㄇㄢˋ" }, { char: "漫", pinyin: "ㄇㄢˋ" }, { char: "謾", pinyin: "ㄇㄢˋ" } ],
                answer: "蔓",
                explanation: "「蔓」指植物細長會攀爬的莖，如「藤蔓」、「蔓延」。",
                memoryTip: "【部首記憶法】藤蔓是植物的一種喔！跟植物有關的字通常會有「艹」（草字頭）。"
            },
            {
                text: "在網路上對他人進行不理性的[___]罵，可能會觸犯法律。",
                options: [ { char: "蔓", pinyin: "ㄇㄢˋ" }, { char: "漫", pinyin: "ㄇㄢˋ" }, { char: "謾", pinyin: "ㄇㄢˋ" } ],
                answer: "謾",
                explanation: "「謾」有欺騙、胡亂辱罵的意思，如「謾罵」。",
                memoryTip: "【部首記憶法】罵人是用嘴巴「說話」，跟語言有關。找找看哪個選項是「言」部！"
            }
        ];

        // --- 遊戲狀態管理 ---
        let gameQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

        // --- DOM 元素 ---
        const screens = {
            start: document.getElementById('screen-start'),
            game: document.getElementById('screen-game'),
            result: document.getElementById('screen-result')
        };
        const uiQuestionNum = document.getElementById('ui-question-num');
        const uiTotalQuestions = document.getElementById('ui-total-questions');
        const uiScore = document.getElementById('ui-score');
        const uiQuestionText = document.getElementById('ui-question-text');
        const uiOptions = document.getElementById('ui-options');
        const uiFeedback = document.getElementById('ui-feedback');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDesc = document.getElementById('feedback-desc');
        const btnNext = document.getElementById('btn-next');
        const uiHintText = document.getElementById('ui-hint-text');
        const btnShowHint = document.getElementById('btn-show-hint');
        const hintContent = document.getElementById('hint-content');

        // --- 工具函數 ---
        // 陣列洗牌
        function shuffleArray(array) {
            let curId = array.length;
            while (0 !== curId) {
                let randId = Math.floor(Math.random() * curId);
                curId -= 1;
                let tmp = array[curId];
                array[curId] = array[randId];
                array[randId] = tmp;
            }
            return array;
        }

        // 切換畫面
        function showScreen(screenName) {
            Object.values(screens).forEach(screen => screen.classList.add('hidden-screen'));
            screens[screenName].classList.remove('hidden-screen');
        }

        // 顯示提示
        function showHint() {
            btnShowHint.classList.add('hidden');
            hintContent.classList.remove('hidden');
            hintContent.classList.add('animate-bounce-in');
        }

        // --- 遊戲核心邏輯 ---
        function startGame() {
            // 隨機挑選 10 題 (如果題庫超過 10 題的話) 並打亂順序
            gameQuestions = shuffleArray([...allQuestions]).slice(0, 10);
            currentQuestionIndex = 0;
            score = 0;
            updateScoreUI();
            uiTotalQuestions.textContent = gameQuestions.length;
            
            showScreen('game');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswered = false;
            const currentQ = gameQuestions[currentQuestionIndex];
            
            // 更新進度
            uiQuestionNum.textContent = currentQuestionIndex + 1;
            
            // 隱藏回饋區
            uiFeedback.classList.add('hidden');
            uiFeedback.classList.remove('h-auto');
            uiFeedback.style.height = '0';

            // 渲染題目，將 [___] 替換為樣式化的空格
            const formattedText = currentQ.text.replace('[___]', '<span id="blank-target" class="blank-space">？</span>');
            uiQuestionText.innerHTML = formattedText;
            
            // 加上進場動畫
            uiQuestionText.classList.remove('animate-bounce-in');
            void uiQuestionText.offsetWidth; // 觸發重繪
            uiQuestionText.classList.add('animate-bounce-in');

            // 設置部首記憶提示 (預設隱藏並顯示按鈕)
            btnShowHint.classList.remove('hidden');
            hintContent.classList.add('hidden');
            hintContent.classList.remove('animate-bounce-in');
            uiHintText.textContent = currentQ.memoryTip;

            // 渲染選項
            uiOptions.innerHTML = '';
            // 把選項順序打亂
            const shuffledOptions = shuffleArray([...currentQ.options]);
            
            // 動態設定 grid column 數量
            if(shuffledOptions.length === 4) {
                uiOptions.className = "grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 justify-center";
            } else if (shuffledOptions.length === 3) {
                uiOptions.className = "grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 justify-center";
            } else {
                uiOptions.className = "grid grid-cols-2 gap-4 md:gap-6 justify-center";
            }

            shuffledOptions.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = `btn-3d option-btn text-4xl md:text-5xl font-bold py-6 px-4 rounded-2xl flex flex-col items-center gap-2 animate-bounce-in`;
                btn.style.animationDelay = `${index * 0.1}s`;
                
                // 使用 ruby 標籤顯示注音
                btn.innerHTML = `<ruby>${opt.char}<rt>${opt.pinyin}</rt></ruby>`;
                
                btn.onclick = () => handleAnswer(opt.char, btn);
                uiOptions.appendChild(btn);
            });
        }

        function handleAnswer(selectedChar, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const currentQ = gameQuestions[currentQuestionIndex];
            const isCorrect = (selectedChar === currentQ.answer);

            // 停用所有按鈕
            const allBtns = uiOptions.querySelectorAll('button');
            allBtns.forEach(btn => {
                btn.disabled = true;
                // 找出正確答案的按鈕，如果是錯的也讓正確答案亮起來
                if(btn.textContent.includes(currentQ.answer)) {
                     btn.classList.add('correct');
                }
            });

            const blankTarget = document.getElementById('blank-target');

            if (isCorrect) {
                // 答對邏輯
                score += 10;
                updateScoreUI();
                btnElement.classList.add('correct');
                blankTarget.textContent = currentQ.answer;
                blankTarget.style.color = '#16a34a'; // 綠色
                blankTarget.style.borderBottomColor = '#16a34a';
                
                showFeedback(true, currentQ.explanation);
            } else {
                // 答錯邏輯
                btnElement.classList.add('wrong');
                btnElement.classList.add('animate-shake');
                blankTarget.textContent = selectedChar;
                blankTarget.style.color = '#dc2626'; // 紅色
                blankTarget.style.borderBottomColor = '#dc2626';
                blankTarget.style.textDecoration = 'line-through';
                
                showFeedback(false, currentQ.explanation);
            }

            // 如果是最後一題，更改下一題按鈕文字
            if (currentQuestionIndex === gameQuestions.length - 1) {
                btnNext.innerHTML = '看結果 🏆';
                btnNext.classList.replace('btn-blue', 'btn-yellow');
            } else {
                btnNext.innerHTML = '下一題 ➡️';
                btnNext.classList.replace('btn-yellow', 'btn-blue');
            }
        }

        function showFeedback(isCorrect, explanation) {
            uiFeedback.classList.remove('hidden');
            uiFeedback.style.height = 'auto';
            
            if (isCorrect) {
                feedbackIcon.textContent = '🎉';
                feedbackTitle.textContent = '太棒了！答對啦！';
                feedbackTitle.className = 'text-2xl font-black text-green-600';
                uiFeedback.className = 'h-auto bg-green-50 border-t-4 border-green-300 p-6 flex flex-col items-center transition-all duration-300';
            } else {
                feedbackIcon.textContent = '👀';
                feedbackTitle.textContent = '哎呀！選錯囉～';
                feedbackTitle.className = 'text-2xl font-black text-red-600';
                uiFeedback.className = 'h-auto bg-red-50 border-t-4 border-red-300 p-6 flex flex-col items-center transition-all duration-300';
            }

            feedbackDesc.textContent = explanation;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < gameQuestions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function updateScoreUI() {
            uiScore.textContent = score;
            // 簡單的分數跳動特效
            uiScore.classList.remove('animate-bounce-in');
            void uiScore.offsetWidth;
            uiScore.classList.add('animate-bounce-in');
        }

        function endGame() {
            showScreen('result');
            document.getElementById('ui-final-score').textContent = score;
            
            const msgEl = document.getElementById('result-message');
            const emojiEl = document.getElementById('result-emoji');
            
            const maxScore = gameQuestions.length * 10;
            if (score === maxScore) {
                msgEl.textContent = "太神啦！你是相似字大師！完美通關！";
                emojiEl.textContent = "🥇";
                fireConfetti();
            } else if (score >= maxScore * 0.7) {
                msgEl.textContent = "表現得非常好！只差一點點就完美囉！";
                emojiEl.textContent = "🥈";
                fireConfetti();
            } else {
                msgEl.textContent = "再多練習幾次，你一定會越來越厲害的！";
                emojiEl.textContent = "💪";
            }
        }

        function resetGame() {
            stopConfetti();
            startGame();
        }

        // --- 簡易粒子特效 (過關用) ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function fireConfetti() {
            canvas.classList.remove('hidden');
            resizeCanvas();
            particles = [];
            const colors = ['#fce7f3', '#fef08a', '#bbf7d0', '#bfdbfe', '#e9d5ff', '#ef4444', '#3b82f6', '#22c55e'];
            
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2 + 100,
                    r: Math.random() * 6 + 4,
                    dx: Math.random() * 10 - 5,
                    dy: Math.random() * -10 - 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10,
                    tiltAngleIncrement: (Math.random() * 0.07) + 0.05,
                    tiltAngle: 0
                });
            }
            animateConfetti();
        }

        function animateConfetti() {
            requestAnimationFrame(animateConfetti);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach((p, index) => {
                p.tiltAngle += p.tiltAngleIncrement;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.dy += 0.05; // 重力
                p.x += p.dx;
                p.y += p.dy;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();

                // 移除掉出畫面的粒子
                if (p.y > canvas.height) {
                    particles.splice(index, 1);
                }
            });
        }

        function stopConfetti() {
            canvas.classList.add('hidden');
            particles = [];
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

    </script>
</body>
