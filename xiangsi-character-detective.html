<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相似字小偵探｜形近字練習</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--tx:#2b2540;--mu:#6b6480;--pri:#3b6cff;--on:#fff;--ok:#1fa366;--bad:#e5484d;--g:#8b87a0;--rad:#e8590c;--bd:#eadfc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--card:#221e30;--tx:#f3efff;--mu:#b5aed0;--pri:#8aa4ff;--on:#17141f;--ok:#3ccf8e;--bad:#ff6b70;--g:#9a94b5;--rad:#ffa94d;--bd:#383152;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141f;--card:#221e30;--tx:#f3efff;--mu:#b5aed0;--pri:#8aa4ff;--on:#17141f;--ok:#3ccf8e;--bad:#ff6b70;--g:#9a94b5;--rad:#ffa94d;--bd:#383152;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.5}
#app{max-width:540px;margin:0 auto;padding:12px 14px 30px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px}
#st{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:2px 12px;font-size:16px}
.bar{height:10px;background:var(--bd);border-radius:6px;margin:10px 0 14px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .4s}
.card{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:12px}
h1,h2{margin:4px 0 8px}h2{font-size:21px}.mu{color:var(--mu);font-size:15px}
.cz{position:relative;display:inline-block;font-weight:500;line-height:1.15}
.cz .g{color:var(--g)}.cz.one .g{color:var(--tx)}
.cz .r{position:absolute;left:0;top:0;color:var(--rad);animation:blink 1.6s infinite}
@keyframes blink{50%{filter:brightness(1.25) saturate(1.3)}}
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:18px;font-weight:800;background:var(--pri);color:var(--on);cursor:pointer;font-family:inherit;min-height:56px}
.btn.g{background:transparent;color:var(--pri);border:3px solid var(--pri)}.btn.s{padding:8px 14px;min-height:40px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.fam{display:flex;flex-direction:column;gap:8px}.fam .chs{display:flex;gap:6px;justify-content:center;font-size:44px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{border:3px solid var(--bd);border-radius:18px;background:var(--card);padding:10px 6px;text-align:center;cursor:pointer;font-family:inherit;color:var(--tx)}
.cc.on{border-color:var(--rad)}.cc .py{color:var(--pri);font-weight:800;font-size:18px}.cc .em{font-size:34px}.cc .w{font-size:16px}
.det{border:3px dashed var(--rad);border-radius:18px;padding:12px;margin-top:12px;text-align:center}
.eq{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:20px;font-weight:800;margin:8px 0}
.chip{border:3px solid var(--rad);border-radius:14px;padding:4px 12px;color:var(--rad);animation:in1 .7s both}.chip.gr{border-color:var(--g);color:var(--g);animation-delay:.5s}
.eq .res{animation:in1 .7s 1s both}.eq .pl{animation:in1 .5s .4s both}.eq .eqs{animation:in1 .5s .8s both}
@keyframes in1{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.bounce{display:inline-block;animation:bn .9s}@keyframes bn{0%{transform:translateY(-30px);opacity:0}60%{transform:translateY(6px);opacity:1}100%{transform:none}}
.prompt{text-align:center}.prompt .pic{font-size:72px;line-height:1.1}.prompt .wb{font-size:40px;font-weight:800;letter-spacing:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{border:3px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit;min-height:92px;font-size:52px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px}
.opt small{font-size:16px;font-weight:700}.opt .oe{font-size:44px}.opt.w{font-size:30px;font-weight:800}
.opt:hover{border-color:var(--pri)}.opt.ok{border-color:var(--ok);background:rgba(31,163,102,.15)}.opt.no{border-color:var(--bad);background:rgba(229,72,77,.13);animation:sk .4s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{display:none;border-radius:16px;padding:12px;margin:8px 0;font-size:17px}.fb.show{display:block}
.fb.ok{background:rgba(31,163,102,.13);border:3px solid var(--ok)}.fb.no{background:rgba(229,72,77,.1);border:3px solid var(--bad)}.fb.hint{background:rgba(59,108,255,.1);border:3px solid var(--pri)}
.big{font-size:60px;text-align:center}ul{padding-left:20px}
</style></head><body>
<div id="app"><header><span>🔍 相似字小偵探</span><span id="st">⭐ 0</span></header><div class="bar"><i id="pg"></i></div><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),main=$('#main'),pg=$('#pg');
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const canSay='speechSynthesis' in window;
function say(t){if(!canSay)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
const C=(c,py,w,wb,pic,rad,re,rn,dir,cut,st,x)=>Object.assign({c,py,w,wb,pic,rad,re,rn,dir,cut,st},x||{});
const FAM=[
{id:'ce',name:'冊字族',ph:'冊',chars:[
C('柵','ㄓㄚˋ','柵欄','＿欄','🚧','木','🌳','木頭','l',.46,'木 🌳 + 冊 = 柵：木頭做的欄杆（柵欄）。<br>⚠️ 這個字念 ㄓㄚˋ，和其他三個字不一樣！',{odd:1}),
C('跚','ㄕㄢ','蹣跚','蹣＿','🧓','足','🦶','腳','l',.46,'足 🦶 + 冊 = 跚：用腳慢慢走（蹣跚）。'),
C('珊','ㄕㄢ','珊瑚','＿瑚','🪸','玉','💎','玉石','l',.44,'玉 💎 + 冊 = 珊：像寶石的珊瑚。'),
C('姍','ㄕㄢ','姍姍來遲','＿＿來遲','🕒','女','👩','女生','l',.44,'女 👩 + 冊 = 姍：女生慢慢走來（姍姍來遲）。')]},
{id:'yu',name:'臾字族',ph:'臾',chars:[
C('腴','ㄩˊ','豐腴','豐＿','🥩','肉','🥩','肉','l',.42,'肉（月）🥩 + 臾 = 腴：肉多、胖胖的（豐腴）。'),
C('諛','ㄩˊ','阿諛','阿＿','💬','言','💬','說話','l',.46,'言 💬 + 臾 = 諛：說好聽的話討好人（阿諛）。'),
C('臾','ㄩˊ','須臾','須＿','⏳',null,null,null,null,0,'臾 ⏳：一下子的意思（須臾）。這個字沒有部首，是另外兩個字的「聲音」來源。')]},
{id:'hu',name:'黃字族',ph:'黃',chars:[
C('簧','ㄏㄨㄤˊ','彈簧','彈＿','🌀','竹','🎋','竹子','t',.4,'竹 🎋 + 黃 = 簧：竹片做的彈簧片（彈簧）。'),
C('潢','ㄏㄨㄤˊ','裝潢','裝＿','🏠','水','💧','水','l',.3,'水 💧 + 黃 = 潢：像水一樣刷牆面（裝潢）。'),
C('磺','ㄏㄨㄤˊ','硫磺','硫＿','🌋','石','🪨','石頭','l',.46,'石 🪨 + 黃 = 磺：黃色的礦石（硫磺）。')]},
{id:'qu',name:'拳字族',ph:null,chars:[
C('拳','ㄑㄩㄢˊ','拳頭','＿頭','👊','手','✋','手','b',.42,'手 ✋ 握起來 = 拳：拳頭。'),
C('眷','ㄐㄩㄢˋ','家眷','家＿','👨‍👩‍👧','目','👁️','眼睛','b',.38,'目 👁️ 看顧家人 = 眷：家眷、眷顧。'),
C('券','ㄑㄩㄢˋ','入場券','入場＿','🎫','刀','🔪','刀','b',.4,'刀 🔪 刻下憑證 = 券：入場券。'),
C('豢','ㄏㄨㄢˋ','豢養','＿養','🐖','豕','🐷','豬','b',.46,'豕（豬）🐷 = 豢：養豬、養動物（豢養）。')]}];
FAM.forEach(f=>f.chars.forEach(c=>c.f=f));
function cz(c,sz){const o=c.dir?{l:`inset(0 ${100-c.cut*100}% 0 0)`,t:`inset(0 0 ${100-c.cut*100}% 0)`,b:`inset(${100-c.cut*100}% 0 0 0)`}[c.dir]:'';
return `<span class="cz${c.dir?'':' one'}" style="font-size:${sz}px"><span class="g">${c.c}</span>${c.dir?`<span class="r" style="clip-path:${o}">${c.c}</span>`:''}</span>`}
function eq(c){const f=c.f;if(!c.dir)return `<div class="eq"><span class="res">${cz(c,64)}</span></div>`;
return `<div class="eq"><span class="chip">${c.re} ${c.rad}</span><span class="pl">+</span><span class="chip gr">${f.ph||'相同的上半部'}</span><span class="eqs">=</span><span class="res">${cz(c,64)}</span></div>`}
const sayBtn=(t)=>canSay?`<button class="btn g s" onclick="say('${t}')">🔊 聽聽看</button>`:'';
let stars=0,tot=0;
function star(){$('#st').textContent='⭐ '+stars}
function home(){pg.style.width='0';
main.innerHTML=`<div class="card"><div class="big">🔍</div><h1 style="text-align:center">相似字小偵探</h1><p>有些字長得很像，只有一小塊不一樣。<br><b style="color:var(--rad)">橘色</b>的部分是「部首」，它會告訴你這個字跟什麼有關。<br>一起來當偵探，把相似字分清楚！</p></div>`+
FAM.map(f=>`<div class="card fam"><h2>${f.name}</h2><div class="chs">${f.chars.map(c=>cz(c,44)).join('')}</div><div class="row"><button class="btn g" onclick="learn('${f.id}')">📖 先看卡片</button><button class="btn" onclick="quiz('${f.id}')">🎮 開始挑戰</button></div></div>`).join('')+
`<div class="card"><h2>🎲 全部混合挑戰</h2><p class="mu">從四個字族隨機出 16 題</p><button class="btn" onclick="quiz('all')">開始</button></div>`}
function learn(id,sel){const f=FAM.find(x=>x.id==id);sel=sel==null?-1:sel;pg.style.width='0';
const c=f.chars[sel];
main.innerHTML=`<div class="card"><h2>📖 ${f.name}</h2><p class="mu">橘色＝部首（它告訴你這個字跟什麼有關）。點一點卡片，看看怎麼變成這個字！</p><div class="grid">${f.chars.map((x,k)=>`<button class="cc${k==sel?' on':''}" onclick="learn('${id}',${k})">${cz(x,72)}<div class="py">${x.py}</div><div class="em">${x.pic}</div><div class="w">${x.w}</div></button>`).join('')}</div>
${c?`<div class="det">${eq(c)}<div class="bounce" style="font-size:64px">${c.pic}</div><p>${c.st}</p>${sayBtn(c.w)}</div>`:''}
<div class="row"><button class="btn g" onclick="home()">⬅ 回首頁</button><button class="btn" onclick="quiz('${id}')">🎮 去挑戰</button></div></div>`}
let Qs=[],qi=0,tr=0,hn=false,dn=false,lastPick=null;
function mkQs(f){const q=[];
sh(f.chars).forEach(c=>q.push({t:'pic',f,c}));
sh(f.chars.filter(c=>c.rad)).slice(0,2).forEach(c=>q.push({t:'rad',f,c}));
if(f.id=='ce')q.push({t:'odd',f});
if(f.id=='qu')sh(f.chars).slice(0,2).forEach(c=>q.push({t:'py',f,c}));
sh(f.chars).slice(0,2).forEach(c=>q.push({t:'word',f,c}));
return q}
function quiz(id){stars=0;tot=0;star();
Qs=id=='all'?sh(FAM.flatMap(mkQs)).slice(0,16):mkQs(FAM.find(x=>x.id==id));qi=0;showQ()}
function showQ(){const q=Qs[qi],f=q.f,c=q.c;tr=0;hn=false;dn=false;pg.style.width=(qi/Qs.length*100)+'%';
let p='',o=[];
if(q.t=='pic'){p=`<div class="pic">${c.pic}</div><div class="wb">${c.wb}</div><p class="mu">看圖片，選出空格要填的字</p>`;o=f.chars.map(x=>({k:x.c,h:x.c,ok:x===c}));q.h=`💡 ${c.re?c.re+' 「'+c.rad+'」跟「'+c.rn+'」有關。':'這個字的意思是「一下子」。'}想想看：${c.pic} 是什麼詞？`;}
if(q.t=='rad'){p=`<div>${cz(c,96)}</div><p style="font-size:19px;font-weight:800">橘色的部分，跟什麼有關？</p>`;const rs=[...new Map(f.chars.filter(x=>x.rad).map(x=>[x.re,x])).values()];o=rs.map(x=>({k:x.re,h:`<span class="oe">${x.re}</span><small>${x.rn}</small>`,ok:x===c||x.re==c.re}));q.h=`💡 橘色的部分叫「${c.rad}」。想想看它的樣子像什麼？`}
if(q.t=='odd'){p=`<div class="pic">🤔</div><p style="font-size:20px;font-weight:800">哪一個字的讀音和其他字<u>不一樣</u>？</p>`;o=f.chars.map(x=>({k:x.c,h:x.c,ok:!!x.odd}));q.h='💡 「蹣跚」、「珊瑚」、「姍姍來遲」都念ㄕㄢ，想想「柵欄」怎麼唸？'}
if(q.t=='py'){p=`<div class="pic">👂</div><p style="font-size:20px;font-weight:800">哪一個字念 <span style="color:var(--pri);font-size:28px">${c.py}</span>？</p>`;o=f.chars.map(x=>({k:x.c,h:x.c,ok:x===c}));q.h=`💡 ${c.pic} ${c.w}，想想這個詞怎麼唸。`}
if(q.t=='word'){const w1=c.wb.replace(/＿/g,c.c),oth=sh(f.chars.filter(x=>x!==c))[0],w2=c.wb.replace(/＿/g,oth.c);p=`<div class="pic">${c.pic}</div><p style="font-size:20px;font-weight:800">哪一個詞是對的？</p>`;o=sh([{k:w1,h:w1,ok:true,w:1},{k:w2,h:w2,ok:false,w:1}]);q.h=`💡 看看圖片：${c.pic}，這個詞的意思是什麼？`}
if(q.t!='word')o=sh(o);q.o=o;
main.innerHTML=`<div class="card"><div class="mu">第 ${qi+1} / ${Qs.length} 題・${f.name}</div><div class="prompt">${p}</div><div class="opts" id="ops">${o.map((x,k)=>`<button class="opt${x.w?' w':''}" data-k="${k}">${x.h}</button>`).join('')}</div><div class="fb" id="fb"></div><div class="row"><button class="btn g" id="hb">💡 提示</button>${canSay&&c?`<button class="btn g" onclick="say('${c.w}')">🔊 聽詞語</button>`:''}<button class="btn" id="nx" hidden>${qi==Qs.length-1?'看結果 🏁':'下一題 ➜'}</button></div></div>`;
$('#ops').onclick=e=>{const b=e.target.closest('.opt');if(b&&!dn)pick(b,q)};
$('#hb').onclick=()=>{if(dn)return;hn=true;fb('hint',q.h)};
$('#nx').onclick=()=>{qi++;qi<Qs.length?showQ():end()}}
function fb(c,h){const b=$('#fb');b.className='fb show '+c;b.innerHTML=h}
function reveal(q,won){dn=true;tot++;const c=q.c||q.f.chars.find(x=>x.odd);
[...document.querySelectorAll('.opt')].forEach((b,k)=>{if(q.o[k].ok)b.classList.add('ok')});
$('#nx').hidden=false;$('#hb').hidden=true;
if(won&&tr==0&&!hn){stars++;star()}
fb(won?'ok':'no',`${won?'✅ 答對了！':'答案在綠色的地方喔。'}<div class="eq" style="margin:4px 0">${cz(c,64)}<span class="bounce" style="font-size:52px">${c.pic}</span></div>${c.st}`)}
function pick(b,q){const k=+b.dataset.k,o=q.o[k];
if(o.ok){b.classList.add('ok');reveal(q,true)}
else{tr++;b.classList.add('no');
if(tr>=2){reveal(q,false)}
else{let m='再試一次！可以按「💡 提示」。';const s=q.f.chars.find(x=>x.c==o.k);
if(s&&q.t!='word')m=`你選的是 ${cz(s,40)}：${s.re?s.re+' 「'+s.rad+'」跟「'+s.rn+'」有關，':''}是「${s.w}」的字。<br>再看看圖片，想一想！`;
fb('no','❌ '+m)}}}
function end(){pg.style.width='100%';const r=stars/Qs.length,k=r>=.85?['🏆','相似字大偵探',3]:r>=.55?['🥈','相似字小偵探',2]:['🌱','相似字見習生',1];
main.innerHTML=`<div class="card"><div class="big">${k[0]}</div><h1 style="text-align:center">${'⭐'.repeat(k[2])}<br>${k[1]}</h1><p style="text-align:center;font-size:19px">第一次就答對：${stars} / ${Qs.length} 題</p><div class="row" style="justify-content:center"><button class="btn" onclick="home()">回首頁</button></div></div>`}
home();
</script></body></html>
