<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一章｜比例線段與相似形－數學研究室</title>
<style>
:root{--navy:#183d63;--blue:#347eae;--sky:#eaf5fc;--gold:#f1c765;--ink:#243b50}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background-color:#eaf4fb;background-image:linear-gradient(rgba(79,143,184,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(79,143,184,.09) 1px,transparent 1px),radial-gradient(circle at 80% 8%,#fff 0,transparent 28%),linear-gradient(135deg,#eaf5fc,#dcecf7);background-size:28px 28px,28px 28px,auto,auto}
header{max-width:1050px;margin:auto;padding:26px 20px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a.back{color:#245c83;text-decoration:none;font-weight:700;background:#fff;border:1px solid #c7deed;border-radius:999px;padding:10px 16px}
.hero{max-width:1010px;margin:8px auto 20px;padding:26px 24px;background:linear-gradient(120deg,#214f79,#397fa9);color:white;border-radius:24px;box-shadow:0 12px 28px #2457782b;position:relative;overflow:hidden}
.hero:after{content:"△  ◯  □  ∠";position:absolute;right:25px;bottom:12px;font-size:38px;letter-spacing:8px;color:#ffffff38}
.kicker{font-size:14px;letter-spacing:2px;color:#f8d986}.hero h1{margin:8px 0;font-size:clamp(25px,4vw,36px)}.hero p{margin:0;line-height:1.8;color:#e6f4ff;max-width:720px}
main{max-width:1010px;margin:0 auto;padding:0 20px 48px}.guide{background:#fff;border:1px solid #d8e7f1;border-radius:18px;padding:16px 20px;margin-bottom:18px;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.unit{border:1px solid #d1e2ee;background:#fff;border-radius:20px;padding:19px;text-align:left;box-shadow:0 7px 18px #254e6710;cursor:pointer;transition:.18s;color:var(--ink);min-height:178px}.unit:hover{transform:translateY(-3px);box-shadow:0 12px 24px #254e6720;border-color:#77b2d3}.num{display:inline-block;background:#e7f3fb;color:#28658f;border-radius:9px;padding:5px 10px;font-weight:800}.unit h2{font-size:21px;margin:13px 0 7px}.unit p{line-height:1.65;color:#5c7181;margin:0}.unit .go{display:block;color:#2c78a8;font-weight:700;margin-top:13px}
.panel{display:none;margin-top:20px;background:#fff;border:1px solid #d3e4ef;border-radius:20px;padding:22px;box-shadow:0 10px 24px #214f7914}.panel.show{display:block}.panel h2{margin:0 0 8px}.hint{color:#5b7183;line-height:1.7}.visual{margin:14px 0 18px;padding:14px;background:linear-gradient(135deg,#f2f9fd,#e8f3fa);border:1px solid #d5e7f2;border-radius:16px}.visual svg{display:block;width:100%;max-height:230px}.visual-note{font-size:14px;color:#557086;margin:8px 0 0;line-height:1.7}.step-card{display:flex;gap:10px;align-items:flex-start;background:#fff8e6;border:1px solid #f0dda7;border-radius:13px;padding:12px 14px;margin:12px 0;color:#674f1d;line-height:1.7}.step-card strong{white-space:nowrap}.question{font-size:20px;font-weight:800;line-height:1.7;margin:20px 0 14px}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{border:2px solid #d6e5ef;background:#f8fbfd;border-radius:13px;padding:13px;text-align:left;font-size:17px;cursor:pointer;color:#243b50}.answer:hover{border-color:#75b3d4}.answer:disabled{cursor:default}.answer.correct{border-color:#48a47c;background:#e8f7ef}.answer.wrong{border-color:#dc8c82;background:#fff0ee}.feedback{margin-top:15px;line-height:1.8;font-weight:700;min-height:48px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.action{border:0;border-radius:999px;padding:11px 18px;background:#286f9e;color:white;font-weight:800;font-size:15px;cursor:pointer}.action.secondary{background:#edf4f8;color:#28536f}.progress{height:8px;background:#e8f0f5;border-radius:10px;margin-top:18px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#55a2c8;transition:width .2s}
@media(max-width:560px){header{padding-top:18px}.hero{margin:8px 12px 16px;padding:22px 18px}.hero:after{font-size:23px}.answers{grid-template-columns:1fr}main{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<header><strong>🔬 數學研究室｜九年級</strong><a class="back" href="./index.html">← 返回學習島</a></header>
<section class="hero"><div class="kicker">南一版・九年級上學期・第一章</div><h1>比例線段與相似形</h1><p>先選擇小節，再開始練習。題目採用生活情境、短句與分步提示，幫助你一步一步理解比例和相似圖形。</p></section>
<main>
<div class="guide"><strong>🧭 本章學習地圖</strong><br>依照南一版章節順序：1-1 連比 → 1-2 比例線段 → 1-3 相似形 → 1-4 相似三角形的應用。每個小節都可以分開練習。</div>
<div class="grid" id="units">
<button class="unit" onclick="startUnit(0)"><span class="num">1-1</span><h2>連比</h2><p>認識三個數量的比，練習把比化簡與分配。</p><span class="go">進入小節練習 →</span></button>
<button class="unit" onclick="startUnit(1)"><span class="num">1-2</span><h2>比例線段</h2><p>看懂線段的長短比例，認識平行線截比例線段。</p><span class="go">進入小節練習 →</span></button>
<button class="unit" onclick="startUnit(2)"><span class="num">1-3</span><h2>相似形</h2><p>從放大、縮小圖形，認識相似多邊形與三角形。</p><span class="go">進入小節練習 →</span></button>
<button class="unit" onclick="startUnit(3)"><span class="num">1-4</span><h2>相似三角形的應用</h2><p>運用相似三角形解決身高、影子與距離問題。</p><span class="go">進入小節練習 →</span></button>
</div>
<section class="panel" id="practice" aria-live="polite"><div class="num" id="unitNum">1-1</div><h2 id="unitTitle">連比</h2><p class="hint" id="unitHint"></p><div class="visual" id="visual" aria-label="本題數學示意圖"></div><div class="step-card" id="stepCard"><strong>🔎 下一步</strong><span id="stepText">先觀察圖形，再找出題目給你的數字。</span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="progress"><span id="bar"></span></div><div class="actions"><button class="action" onclick="nextQuestion()">下一題</button><button class="action secondary" onclick="backToUnits()">返回小節選單</button></div></section>
</main>
<script>
const units=[
{n:'1-1',title:'連比',hint:'連比是三個數量之間的比。先找出共同的倍數，再把比化簡。',qs:[
{q:'紅球 2 顆、藍球 4 顆、黃球 6 顆。紅：藍：黃的連比是？',a:['1：2：3','2：4：5','2：3：4','3：2：1'],c:0,w:'2：4：6 同除以 2，得到 1：2：3。'},
{q:'甲：乙：丙＝2：3：4，甲有 6 個。乙有幾個？',a:['8 個','9 個','10 個','12 個'],c:1,w:'甲的 2 份變成 6 個，每份是 3 個；乙有 3 份，3×3＝9。'},
{q:'把 3：6：9 化成最簡整數比，答案是？',a:['3：2：1','1：2：3','1：3：6','2：3：4'],c:1,w:'三個數都除以最大公因數 3，得到 1：2：3。'}]},
{n:'1-2',title:'比例線段',hint:'比例線段比較的是線段長度的比。遇到平行線時，可以找出對應線段的比例關係。',qs:[
{q:'兩條線段長度是 2 公分和 4 公分，它們的比是？',a:['1：2','2：3','1：3','2：4：6'],c:0,w:'2：4 同除以 2，得到 1：2。'},
{q:'甲線段 3 公分，乙線段 9 公分。甲：乙＝？',a:['3：1','1：3','1：2','2：3'],c:1,w:'3：9 同除以 3，得到 1：3。'},
{q:'平行線截兩條直線時，對應線段通常會形成什麼關係？',a:['長度都相等','成比例','一定垂直','一定是直角'],c:1,w:'平行線截兩條直線，所形成的對應線段成比例。'}]},
{n:'1-3',title:'相似形',hint:'相似圖形的形狀相同：對應角相等，對應邊長的比相同。大小可以不同。',qs:[
{q:'一張照片長和寬都放大 2 倍，照片的形狀會？',a:['改變形狀','保持相同形狀','變成圓形','變成正方形'],c:1,w:'長和寬都用相同倍數放大，形狀保持相同。'},
{q:'兩個相似三角形的對應角有什麼關係？',a:['對應角相等','對應角都變大','對應角都變小','一定都是 90 度'],c:0,w:'相似三角形的對應角相等。'},
{q:'小正方形邊長 2 公分，大正方形邊長 4 公分。大正方形是小正方形的幾倍？',a:['1 倍','2 倍','3 倍','4 倍'],c:1,w:'4÷2＝2，所以大正方形的邊長是 2 倍。'}]},
{n:'1-4',title:'相似三角形的應用',hint:'先找出兩個相似三角形，再用對應邊的比例解決問題。',qs:[
{q:'小旗桿高 1 公尺，影子長 2 公尺。旁邊大旗桿影子長 6 公尺，高度是？',a:['2 公尺','3 公尺','4 公尺','6 公尺'],c:1,w:'影子從 2 公尺變成 6 公尺，是 3 倍；高度也乘以 3：1×3＝3 公尺。'},
{q:'兩個相似三角形的對應邊比是 1：3，小三角形一邊長 4 公分，大三角形對應邊長？',a:['7 公分','8 公分','12 公分','16 公分'],c:2,w:'大三角形是 3 倍：4×3＝12 公分。'},
{q:'利用相似三角形測量大樹高度時，常會比較哪一項？',a:['影子的長度','樹葉的顏色','樹幹的粗細','樹的種類'],c:0,w:'可以利用大樹和人的影子長度比例，推算大樹高度。'}]}
];
let current=0,index=0,answered=false;
function startUnit(i){current=i;index=0;document.getElementById('units').style.display='none';document.getElementById('practice').classList.add('show');document.getElementById('unitNum').textContent=units[i].n;document.getElementById('unitTitle').textContent=units[i].title;document.getElementById('unitHint').textContent=units[i].hint;render()}
function illustration(i){
const art=[
'<svg viewBox="0 0 560 190" role="img" aria-label="三種顏色球的數量比例圖"><text x="280" y="25" text-anchor="middle" font-size="17" fill="#294e69">把數量排成三組來比較</text><g font-size="15" text-anchor="middle" fill="#294e69"><text x="95" y="55">紅球 2 顆</text><text x="280" y="55">藍球 4 顆</text><text x="465" y="55">黃球 6 顆</text></g><g><rect x="48" y="70" width="94" height="26" rx="8" fill="#e88b80"/><rect x="48" y="103" width="94" height="26" rx="8" fill="#e88b80"/><rect x="233" y="70" width="40" height="26" rx="8" fill="#6aa9d2"/><rect x="280" y="70" width="40" height="26" rx="8" fill="#6aa9d2"/><rect x="233" y="103" width="40" height="26" rx="8" fill="#6aa9d2"/><rect x="280" y="103" width="40" height="26" rx="8" fill="#6aa9d2"/><rect x="418" y="70" width="28" height="26" rx="8" fill="#efc45c"/><rect x="451" y="70" width="28" height="26" rx="8" fill="#efc45c"/><rect x="484" y="70" width="28" height="26" rx="8" fill="#efc45c"/><rect x="418" y="103" width="28" height="26" rx="8" fill="#efc45c"/><rect x="451" y="103" width="28" height="26" rx="8" fill="#efc45c"/><rect x="484" y="103" width="28" height="26" rx="8" fill="#efc45c"/></g><text x="280" y="165" text-anchor="middle" font-size="16" fill="#315f80">一起除以 2 → 1：2：3</text></svg>',
'<svg viewBox="0 0 560 190" role="img" aria-label="平行線截線示意圖"><path d="M85 42 L475 42 M85 142 L475 142" stroke="#438db8" stroke-width="5" stroke-linecap="round"/><path d="M155 15 L250 170 M405 15 L310 170" stroke="#596f82" stroke-width="3"/><path d="M85 42 L475 42 M85 142 L475 142" stroke="#438db8" stroke-width="5"/><g fill="#285c80" font-size="16"><text x="20" y="47">平行線</text><text x="20" y="147">平行線</text><text x="180" y="88">對應線段</text><text x="345" y="113">對應線段</text></g><text x="280" y="184" text-anchor="middle" font-size="14" fill="#315f80">平行線截線段 → 對應線段成比例</text></svg>',
'<svg viewBox="0 0 560 190" role="img" aria-label="兩個形狀相同大小不同的相似三角形"><polygon points="70,155 190,155 130,45" fill="#91c9e8" fill-opacity=".55" stroke="#347eae" stroke-width="4"/><polygon points="300,155 510,155 405,35" fill="#f2c765" fill-opacity=".5" stroke="#bb8c28" stroke-width="4"/><g fill="#294e69" font-size="16"><text x="130" y="178" text-anchor="middle">小三角形</text><text x="405" y="178" text-anchor="middle">放大後</text><text x="130" y="105" text-anchor="middle">形狀相同</text><text x="405" y="105" text-anchor="middle">大小不同</text></g><path d="M215 92 L270 92 M258 80 L270 92 L258 104" fill="none" stroke="#347eae" stroke-width="3" stroke-linecap="round"/></svg>',
'<svg viewBox="0 0 560 190" role="img" aria-label="利用影子比例估計旗桿高度"><circle cx="75" cy="35" r="20" fill="#f2c765"/><path d="M30 155 L525 155" stroke="#63836d" stroke-width="4"/><path d="M125 155 L125 95 L185 155" fill="none" stroke="#347eae" stroke-width="5"/><path d="M340 155 L340 35 L460 155" fill="none" stroke="#d18d3d" stroke-width="5"/><g fill="#294e69" font-size="16"><text x="125" y="85" text-anchor="middle">1 公尺</text><text x="155" y="178" text-anchor="middle">影子 2 公尺</text><text x="340" y="25" text-anchor="middle">？</text><text x="400" y="178" text-anchor="middle">影子 6 公尺</text></g><text x="280" y="115" text-anchor="middle" font-size="15" fill="#315f80">影子變 3 倍 → 高度也變 3 倍</text></svg>'
];
const notes=['數一數三組數量，再找可以一起除的數字。','先找出兩條平行線，再辨認被截出的對應線段。','比較角度與邊長比例：角相等、邊成比例。','先比較影子的長度，再用相同比例推算高度。'];
document.getElementById('visual').innerHTML=art[i]+'<p class="visual-note">看圖小提醒：'+notes[i]+'</p>';
}
function render(){const q=units[current].qs[index];answered=false;illustration(current);const steps=['第一步：先圈出三組數量。第二步：找共同的除數。第三步：把比化簡。','第一步：找出題目中的線段。第二步：找對應線段。第三步：寫出長度的比。','第一步：觀察兩個圖形。第二步：比較對應角。第三步：確認對應邊的比例。','第一步：找出兩個三角形。第二步：比較影子長度。第三步：依比例求出未知高度。'];document.getElementById('stepText').textContent=steps[current]+' 做完這一步，再選答案。';document.getElementById('question').textContent='第 '+(index+1)+' 題｜'+q.q;document.getElementById('feedback').textContent='';document.getElementById('bar').style.width='0%';const box=document.getElementById('answers');box.innerHTML='';q.a.forEach((v,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'．'+v;b.onclick=()=>answer(i,b);box.appendChild(b)})}
function answer(i,btn){if(answered)return;answered=true;const q=units[current].qs[index];document.querySelectorAll('.answer').forEach((b,n)=>{b.disabled=true;if(n===q.c)b.classList.add('correct')});if(i===q.c){document.getElementById('feedback').textContent='🎉 答對了！'+q.w;document.getElementById('stepText').textContent='做得好！下一步：按「下一題」，繼續練習。'}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='再試著理解一次。正確答案已標示。'+q.w;document.getElementById('stepText').textContent='先看圖上的線索，再讀一次解題提示；準備好後按「下一題」。'}document.getElementById('bar').style.width='100%'}
function nextQuestion(){if(!answered){document.getElementById('feedback').textContent='先選一個答案，再繼續喔！';return}index=(index+1)%units[current].qs.length;render()}
function backToUnits(){document.getElementById('practice').classList.remove('show');document.getElementById('units').style.display='grid'}
</script>
</body></html>
