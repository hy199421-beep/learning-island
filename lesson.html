<script>
const params=new URLSearchParams(location.search);
const key=params.get('lesson')||'ailian';
const isAilian=key==='ailian';
document.getElementById('lessonTitle').textContent=isAilian?'愛蓮說':'生命中的碎珠';
const sections=isAilian?{
text:`<h3>《愛蓮說》｜周敦頤</h3><div class="poem">水陸草木之花，可愛者甚蕃。
晉陶淵明獨愛菊；自李唐來，世人甚愛牡丹。
予獨愛蓮之出淤泥而不染，濯清漣而不妖，
中通外直，不蔓不枝，香遠益清，亭亭淨植，
可遠觀而不可褻玩焉。

予謂菊，花之隱逸者也；
牡丹，花之富貴者也；
蓮，花之君子者也。
噫！菊之愛，陶後鮮有聞。
蓮之愛，同予者何人？
牡丹之愛，宜乎眾矣。</div><p class="muted">※ 課文標點與用字請以學校使用的課本版本為準。</p>`,
zhuyin:`<h3>重要國字注音</h3><p>以下整理課文中較容易讀錯的字：</p>
<div class="note"><ruby>蕃<rt>ㄈㄢˊ</rt></ruby>：多。　<ruby>濯<rt>ㄓㄨㄛˊ</rt></ruby>：洗滌。　<ruby>漣<rt>ㄌㄧㄢˊ</rt></ruby>：水面細小的波紋。</div>
<div class="note"><ruby>蔓<rt>ㄇㄢˋ</rt></ruby>：細長、延伸的莖。　<ruby>褻<rt>ㄒㄧㄝˋ</rt></ruby>：不莊重、不尊敬。　<ruby>鮮<rt>ㄒㄧㄢˇ</rt></ruby>：少。</div>
<div class="note"><ruby>逸<rt>ㄧˋ</rt></ruby>：安閒、隱居。　<ruby>宜<rt>ㄧˊ</rt></ruby>：應當、理所當然。</div>`,
meaning:`<h3>語句解釋</h3>
<div class="note"><b>出淤泥而不染：</b>蓮花從污泥中長出，卻不被污泥沾染。比喻身處不良環境，仍能保持純潔。</div>
<div class="note"><b>濯清漣而不妖：</b>經過清水洗滌，卻不顯得過分艷麗。形容端莊而不媚俗。</div>
<div class="note"><b>中通外直：</b>蓮的內部通透、外形挺直，比喻胸襟通達、行為正直。</div>
<div class="note"><b>不蔓不枝：</b>不牽牽連連，也不旁生枝節，比喻處事簡潔、不攀附。</div>
<div class="note"><b>香遠益清，亭亭淨植：</b>香氣傳得越遠越清幽，蓮花潔淨地挺立著。</div>
<div class="note"><b>花之君子者也：</b>蓮是花中的君子，作者藉蓮花讚美正直、清廉、自持的品格。</div>
<div class="note"><b>全文主旨：</b>作者以菊、牡丹、蓮象徵不同的人生態度，藉愛蓮表達對君子品格的推崇。</div>`
}:{
text:`<h3>《生命中的碎珠》｜課文</h3>
<div class="poem" style="text-align:left;font-size:18px;line-height:2.15;white-space:normal">
<p>沒有一樣事物，比現在的按鍵電話更能具體地說明這是一個分秒必爭的世界了。的確，現代人連讓電話轉盤撥轉回來的一兩秒時間都不願等待，我們還能懷疑這不是個節奏迅速、步履匆忙的時代嗎？</p>
<p>也許，正因為點點滴滴的時間，都可能是致勝的關鍵，值得我們加以珍惜、爭取。因此，能掌握時間—尤其是零碎時間—的人，往往也都是令人欽佩仰慕的智者、成功者。</p>
<p>胡適先生曾以「不做無益事，一日當三日，人活五十歲，我活百五十」的生活哲學來自勉。雖然他每日在著書立說<sup>1</sup>、從事學術研究和教育工作之外，還要親自處理諸多繁雜事務，但由於能充分掌握、支配零碎時間，因此，仍然生活得從容自如<sup>2</sup>，處處流露出一個溫藹<sup>3</sup>學者的修養與風範，從不覺得時間不敷<sup>4</sup>使用。</p>
<p>美國歷史上最年輕的總統甘迺迪先生，常常在他接見的第一位客人起身離去，第二位客人尚未踏進會客室之前，也必拿起手邊的書籍閱讀，絕不輕易浪費這些短暫的空檔。正因為他善用時間來充實學識，所以當有人批評他的髮型過於古板難看時，甘迺迪才能自信地回答：「我相信治國的本領，不在頭皮上面，而在頭皮下面。」</p>
<p>撇開<sup>5</sup>近人不談，在古代從容、悠閒的農業社會裡，就已有許多懂得珍惜生命、善於利用瑣碎時間的哲人了。陶淵明曾經說過：「盛年不重來，一日難再晨，及時當勉勵，歲月不待人<sup>6</sup>。」千字文<sup>7</sup>中也有「尺璧非寶，寸陰是競<sup>8</sup>」的格言。而宋代大儒歐陽脩，更是一個善於利用零碎時間的生活藝術家。他常利用「三上」的工夫構思文章，何謂「三上」？那便是「枕上、廁上、馬上」。生活在今天的我們，如果每天也能利用這些短暫的時間，有恆地記誦一首唐詩、宋詞、一句格言或背幾個英文單字，一年下來，該有多少的收穫啊！</p>
<p>有一個發人深省的比喻：在一個空無一物的箱子裡，我們最初可以放進一些大石頭，等到再也放不進大石頭時，餘下的空隙，我們可放進不少小石頭；當小石頭已放滿時，還可容納許多細沙；等到細沙也把箱子裡所有的空間都填實了，我們仍可再注入不少清水……。</p>
<p>如果我們每天的二十四小時，就是這口大箱，而我們吃飯、睡覺、洗澡、上學、辦公、休閒、沉思的時間，就相當於箱裡大大小小的石頭，那麼，仍有不少零星、分散的空隙，可供我們完成許多事務。能不能掌握、利用它們，讓每天的生活更加充實，就全靠我們自己了。</p>
<p>積沙能夠成塔<sup>9</sup>，集腋可以成裘<sup>10</sup>。零碎的時間，應該是生命中的碎珠、沙金、片玉，能勤於撿拾，並集合它們，那的確是一宗<sup>11</sup>可觀的財富！</p>
</div>`,
zhuyin:`<h3>國字注音</h3>
<p class="muted">整理課文中較重要或容易讀錯的字詞。</p>
<div class="note"><ruby>鍵<rt>ㄐㄧㄢˋ</rt></ruby>（按鍵）　<ruby>秒<rt>ㄇㄧㄠˇ</rt></ruby>（分秒）　<ruby>競<rt>ㄐㄧㄥˋ</rt></ruby>（競爭）　<ruby>致<rt>ㄓˋ</rt></ruby>（致勝）</div>
<div class="note"><ruby>欽<rt>ㄑㄧㄣ</rt></ruby>佩　仰<ruby>慕<rt>ㄇㄨˋ</rt></ruby>　繁<ruby>雜<rt>ㄗㄚˊ</rt></ruby>　從<ruby>容<rt>ㄖㄨㄥˊ</rt></ruby>　不<ruby>敷<rt>ㄈㄨ</rt></ruby></div>
<div class="note"><ruby>撇<rt>ㄆㄧㄝ</rt></ruby>開　悠<ruby>閒<rt>ㄒㄧㄢˊ</rt></ruby>　瑣<ruby>碎<rt>ㄙㄨㄟˋ</rt></ruby>　哲<ruby>人<rt>ㄖㄣˊ</rt></ruby>　勉<ruby>勵<rt>ㄌㄧˋ</rt></ruby></div>
<div class="note">尺<ruby>璧<rt>ㄅㄧˋ</rt></ruby>　<ruby>脩<rt>ㄒㄧㄡ</rt></ruby>（歐陽脩）　<ruby>廁<rt>ㄘㄜˋ</rt></ruby>上　<ruby>腋<rt>ㄧㄝˋ</rt></ruby>下　成<ruby>裘<rt>ㄑㄧㄡˊ</rt></ruby></div>
<div class="note">撿<ruby>拾<rt>ㄕˊ</rt></ruby>　<ruby>宗<rt>ㄗㄨㄥ</rt></ruby>　<ruby>藹<rt>ㄞˇ</rt></ruby>（溫藹）　<ruby>勵<rt>ㄌㄧˋ</rt></ruby>（勉勵）</div>`,
meaning:`<h3>詞語、典故與句意解釋</h3>
<div class="note"><b>1. 著書立說：</b>寫作書籍，建立自己的學說或主張。</div>
<div class="note"><b>2. 從容自如：</b>沉著、不慌張，能自在地處理事情。</div>
<div class="note"><b>3. 溫藹：</b>溫和親切。形容待人和善、態度親切。</div>
<div class="note"><b>4. 不敷：</b>不夠、不足以應付所需。</div>
<div class="note"><b>5. 撇開：</b>暫時不談、不把某件事列入考慮。</div>
<div class="note"><b>6. 歲月不待人：</b>時間不會停下來等待任何人，提醒人要珍惜光陰、及時努力。</div>
<div class="note"><b>7. 《千字文》：</b>中國古代的啟蒙讀物，全文由一千個不重複的漢字組成。</div>
<div class="note"><b>8. 尺璧非寶，寸陰是競：</b>珍貴的玉璧不算真正的寶物，短暫的光陰才值得珍惜、努力爭取。</div>
<div class="note"><b>9. 積沙成塔：</b>一粒粒沙子累積起來，也能形成高塔。比喻小量累積，終能成就大事。</div>
<div class="note"><b>10. 集腋成裘：</b>把許多狐狸腋下的小塊皮毛集合起來，就能縫成皮衣。比喻聚少成多。</div>
<div class="note"><b>11. 一宗：</b>一項、一件；此處指一筆可觀的財富。</div>
<h3>段落大意與文章主旨</h3>
<div class="note"><b>第一至二段：</b>說明現代生活步調快速，零碎時間也值得珍惜與把握。</div>
<div class="note"><b>第三至五段：</b>以胡適、甘迺迪、陶淵明、歐陽脩為例，說明善用零碎時間的重要。</div>
<div class="note"><b>第六至七段：</b>以石頭、細沙和清水的比喻，說明妥善安排時間能讓生活更充實。</div>
<div class="note"><b>第八段：</b>總結零碎時間如同生命中的珍珠，只要勤於累積，就能成為珍貴的財富。</div>
<div class="note"><b>全文主旨：</b>提醒我們珍惜並善用零碎時間，持之以恆地累積知識與能力，讓生命更加充實。</div>`

};
for(const id of ['text','zhuyin','meaning'])document.getElementById(id).innerHTML=sections[id];

/* 課文生難詞語注音四選一：逐題呈現，A～D 正確答案各 3 題 */
const wordPronunciations={
 ailian:[
  ['濯清漣','ㄓㄨㄛˊ ㄑㄧㄥ ㄌㄧㄢˊ'],['褻玩','ㄒㄧㄝˋ ㄨㄢˊ'],['隱逸','ㄧㄣˇ ㄧˋ'],
  ['鮮有聞','ㄒㄧㄢˇ ㄧㄡˇ ㄨㄣˊ'],['不蔓不枝','ㄅㄨˋ ㄇㄢˋ ㄅㄨˋ ㄓ'],['淤泥','ㄩ ㄋㄧˊ'],
  ['君子','ㄐㄩㄣ ㄗˇ'],['亭亭淨植','ㄊㄧㄥˊ ㄊㄧㄥˊ ㄐㄧㄥˋ ㄓˊ'],['不染','ㄅㄨˋ ㄖㄢˇ'],
  ['清漣','ㄑㄧㄥ ㄌㄧㄢˊ'],['濯洗','ㄓㄨㄛˊ ㄒㄧˇ'],['宜乎','ㄧˊ ㄏㄨ']
 ],
 life:[
  ['分秒必爭','ㄈㄣ ㄇㄧㄠˇ ㄅㄧˋ ㄓㄥ'],['零碎時間','ㄌㄧㄥˊ ㄙㄨㄟˋ ㄕˊ ㄐㄧㄢ'],['欽佩仰慕','ㄑㄧㄣ ㄆㄟˋ ㄧㄤˇ ㄇㄨˋ'],
  ['著書立說','ㄓㄨˋ ㄕㄨ ㄌㄧˋ ㄕㄨㄛ'],['繁雜事務','ㄈㄢˊ ㄗㄚˊ ㄕˋ ㄨˋ'],['從容自如','ㄘㄨㄥ ㄖㄨㄥˊ ㄗˋ ㄖㄨˊ'],
  ['溫藹','ㄨㄣ ㄞˇ'],['不敷使用','ㄅㄨˋ ㄈㄨ ㄕˇ ㄩㄥˋ'],['悠閒','ㄧㄡ ㄒㄧㄢˊ'],
  ['瑣碎','ㄙㄨㄛˇ ㄙㄨㄟˋ'],['哲人','ㄓㄜˊ ㄖㄣˊ'],['勉勵','ㄇㄧㄢˇ ㄌㄧˋ']
 ]
};
const wordBank=wordPronunciations[isAilian?'ailian':'life'];
const wordLetters=['A','B','C','D'];
const wordQuiz=wordBank.map((entry,i)=>{
 const correct=i%4;
 const wrong=wordBank.filter((w,j)=>j!==i).map(w=>w[1]);
 let cursor=(i*5)%wrong.length;
 const options=[];
 for(let k=0;k<4;k++) options.push(k===correct?entry[1]:wrong[(cursor++)%wrong.length]);
 return {word:entry[0],answer:correct,options};
});
const zy=document.getElementById('zhuyin');
zy.innerHTML='<h3>🔤 課文生難詞語注音挑戰</h3><p class="muted">每次只練習一個詞語。請選出整個詞語正確的注音，再按「下一題」。</p><div id="wordProgress" class="note"></div><div id="wordCard" class="note" style="min-height:220px"></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="wordPrev" type="button" style="padding:11px 18px;border:0;border-radius:9px;background:#9a805f;color:white;font-weight:bold">上一題</button><button id="wordNext" type="button" style="padding:11px 18px;border:0;border-radius:9px;background:#765034;color:white;font-weight:bold">下一題</button><button id="wordFinish" type="button" style="padding:11px 18px;border:0;border-radius:9px;background:#547b55;color:white;font-weight:bold">完成作答</button></div><p id="wordResult" aria-live="polite"></p>';
let wordIndex=0;
const wordAnswers=Array(wordQuiz.length).fill(null);
let wordFinished=false;
const wordCard=zy.querySelector('#wordCard');
function renderWordQuestion(){
 const q=wordQuiz[wordIndex];
 zy.querySelector('#wordProgress').textContent='第 '+(wordIndex+1)+' 題／共 '+wordQuiz.length+' 題';
 wordCard.innerHTML='';
 const heading=document.createElement('h2');heading.style.cssText='font-size:30px;text-align:center;margin:16px 0 22px;color:#68452e';heading.textContent='「'+q.word+'」的正確注音是？';wordCard.appendChild(heading);
 const choices=document.createElement('div');choices.style.cssText='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px';
 q.options.forEach((opt,k)=>{
  const label=document.createElement('label');label.style.cssText='display:flex;align-items:center;gap:9px;background:#fff9ed;border:2px solid #d7bd91;border-radius:9px;padding:13px;cursor:pointer;font-size:18px';
  const radio=document.createElement('input');radio.type='radio';radio.name='wordPronunciation';radio.value=String(k);radio.checked=wordAnswers[wordIndex]===k;radio.disabled=wordFinished;radio.style.transform='scale(1.2)';
  radio.addEventListener('change',()=>{wordAnswers[wordIndex]=k;});
  const span=document.createElement('span');span.textContent=wordLetters[k]+'．'+opt;
  label.appendChild(radio);label.appendChild(span);choices.appendChild(label);
 });
 wordCard.appendChild(choices);
 if(wordFinished){const p=document.createElement('p');p.textContent='正確答案：'+wordLetters[q.answer]+'．'+q.options[q.answer];p.style.color=wordAnswers[wordIndex]===q.answer?'#26734d':'#a33d2e';wordCard.appendChild(p);}
 zy.querySelector('#wordPrev').disabled=wordIndex===0;
 zy.querySelector('#wordNext').disabled=wordIndex===wordQuiz.length-1||wordFinished;
 zy.querySelector('#wordFinish').disabled=wordFinished;
}
zy.querySelector('#wordPrev').addEventListener('click',()=>{if(wordIndex>0){wordIndex--;renderWordQuestion();}});
zy.querySelector('#wordNext').addEventListener('click',()=>{if(wordIndex<wordQuiz.length-1){wordIndex++;renderWordQuestion();}});
zy.querySelector('#wordFinish').addEventListener('click',()=>{
 if(wordAnswers.some(a=>a===null)){zy.querySelector('#wordResult').textContent='還有題目尚未作答，請逐題完成後再交卷。';return;}
 wordFinished=true;
 const score=wordQuiz.filter((q,i)=>wordAnswers[i]===q.answer).length;
 zy.querySelector('#wordResult').textContent='本次得分：'+score+'／'+wordQuiz.length+'。可逐題查看正確注音。';
 renderWordQuestion();
});
renderWordQuestion();

if(!isAilian){
 // 學習中心版本：不顯示長篇課文，只保留題目與圖像提示
 document.getElementById('text').innerHTML='<h3>🌟 看圖想一想・選一選</h3><p class="muted">不用先讀整篇課文，看看圖片、聽聽句子，再選出答案。</p>';
 const visuals=[
  ['⏱️','時間很寶貴','分秒必爭','看到時鐘，想到要珍惜時間。'],
  ['📚','利用空檔','零碎時間','等候或休息的短短時間，也能閱讀。'],
  ['🧘','不慌不忙','從容自如','做事情很自在，不急、不慌。'],
  ['🪨','大石頭、小石頭','安排時間','先放大石頭，再放小石頭和細沙。'],
  ['💧','清水','清水','箱子最後還能裝進清水。'],
  ['💎','生命中的碎珠','碎珠','一點一點累積，就像收集珍珠。']
 ];
 const visualBox=document.createElement('div');
 visualBox.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:18px 0 26px;';
 visuals.forEach(v=>{const c=document.createElement('div');c.style.cssText='background:#fff0d4;border:2px solid #d4b27a;border-radius:14px;padding:14px 8px;text-align:center;';c.innerHTML='<div style="font-size:48px;line-height:1.4" role="img" aria-label="'+v[1]+'">'+v[0]+'</div><b>'+v[1]+'</b><div style="font-size:14px;color:#806f5c;margin-top:5px">'+v[3]+'</div>';visualBox.appendChild(c);});
 document.getElementById('text').appendChild(visualBox);
 const gameTitle=document.createElement('h3');gameTitle.textContent='🎯 分段詞語填空';document.getElementById('text').appendChild(gameTitle);
}
if(!isAilian){
 const paragraphs=[
  {p:"第一段｜現代生活步調快速",q:"現代人連讓電話轉盤撥轉回來的一兩秒時間都不願等待，說明這是個＿＿＿＿的世界。",a:"分秒必爭",opts:["分秒必爭","從容自如","集腋成裘"]},
  {p:"第二段｜珍惜零碎時間",q:"能掌握時間，尤其是＿＿＿＿的人，往往是令人欽佩的智者、成功者。",a:"零碎時間",opts:["休閒時間","零碎時間","睡眠時間"]},
  {p:"第三段｜胡適善用時間",q:"胡適以「不做無益事，一日當三日」自勉，並能生活得＿＿＿＿。",a:"從容自如",opts:["步履匆忙","從容自如","不敷使用"]},
  {p:"第四段｜甘迺迪利用空檔",q:"甘迺迪在接見客人之間拿起書籍閱讀，善用短暫的＿＿＿＿充實學識。",a:"空檔",opts:["空檔","瑣事","清漣"]},
  {p:"第五段｜古人珍惜光陰",q:"歐陽脩利用「三上」構思文章，分別是枕上、廁上和＿＿＿＿。",a:"馬上",opts:["桌上","馬上","路上"]},
  {p:"第六段｜大箱子的比喻",q:"箱子先放大石頭，再放小石頭、細沙，最後還能注入＿＿＿＿。",a:"清水",opts:["黃金","清水","泥土"]},
  {p:"第七段｜安排每天時間",q:"作者把每天的二十四小時比喻成大箱子，提醒我們善用零星、分散的＿＿＿＿。",a:"空隙",opts:["空隙","石壁","碎珠"]},
  {p:"第八段｜累積零碎時間",q:"「積沙成塔，集腋成裘」比喻聚少成多；零碎時間就像生命中的＿＿＿＿。",a:"碎珠",opts:["碎珠","清水","大石頭"]}
 ];
 const game=document.createElement('section');
 game.id='paragraphGame';
 game.innerHTML='<h3>🎮 分段慣用詞句配對・填空挑戰</h3><p class="muted">讀完每一段，選出最適合填入句子的詞語。完成八題看看自己能得幾分！</p><div id="gameScore" class="note">目前得分：0 / 8</div><div id="gameQuestions"></div>';
 document.getElementById('text').appendChild(game);
 const host=game.querySelector('#gameQuestions');
 paragraphs.forEach((item,index)=>{
  const card=document.createElement('div');card.className='note';card.style.margin='18px 0';card.innerHTML='<b>'+item.p+'</b><p>'+item.q+'</p>';
  const readBtn=document.createElement('button');readBtn.textContent='🔊 報讀題目';readBtn.style.cssText='padding:9px 14px;margin:0 0 10px;border:0;border-radius:8px;background:#765034;color:white;font-weight:bold;cursor:pointer;';readBtn.addEventListener('click',()=>{if(!('speechSynthesis' in window)){feedback.textContent='此裝置暫不支援語音報讀，請由老師協助念題。';return;}speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(item.p.replace(/[｜]/g,'。')+'。'+item.q);utterance.lang='zh-TW';utterance.rate=0.78;speechSynthesis.speak(utterance);feedback.textContent='正在報讀題目，請仔細聆聽。';});
  card.appendChild(readBtn);
  const select=document.createElement('select');select.setAttribute('aria-label','第'+(index+1)+'題答案');select.style.cssText='padding:10px 12px;border:1px solid #bd9253;border-radius:8px;background:#fffdf7;color:#493321;font-size:16px;max-width:100%;';
  const empty=document.createElement('option');empty.value='';empty.textContent='請選擇答案';select.appendChild(empty);
  item.opts.forEach(opt=>{const o=document.createElement('option');o.value=opt;o.textContent=opt;select.appendChild(o);});
  const check=document.createElement('button');check.textContent='確認答案';check.style.cssText='margin-left:8px;padding:10px 16px;border:0;border-radius:8px;background:#765034;color:white;font-weight:bold;cursor:pointer;';
  const feedback=document.createElement('p');feedback.setAttribute('aria-live','polite');feedback.style.marginBottom='0';
  check.addEventListener('click',()=>{if(!select.value){feedback.textContent='請先選擇一個答案。';feedback.style.color='#9b5b24';return;}const correct=select.value===item.a;card.dataset.correct=correct?'1':'0';feedback.textContent=correct?'答對了！很棒！':'再想一想，正確答案是「'+item.a+'」。';feedback.style.color=correct?'#26734d':'#a33d2e';select.disabled=true;check.disabled=true;game.querySelector('#gameScore').textContent='目前得分：'+host.querySelectorAll('[data-correct="1"]').length+' / 8';});
  card.appendChild(select);card.appendChild(check);card.appendChild(feedback);host.appendChild(card);
 });
}

document.querySelectorAll('.tabs button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===btn.dataset.tab));}));
</script>
</body></html>
