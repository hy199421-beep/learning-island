<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>學習島｜學生準時簽到</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eaf5fb,#fbf5e8);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#263746}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}.hero{background:linear-gradient(120deg,#477da8,#6f9eb9);color:#fff;padding:24px;border-radius:22px;text-align:center;box-shadow:0 10px 25px #315c7a22}.hero .island{font-size:36px}h1{font-size:27px;margin:8px 0}.hero p{margin:0;opacity:.92}
.card{background:#fffdf7;border:1px solid #e7e1d5;border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 5px 18px #4353630b}
label{display:block;font-weight:700;margin:0 0 7px}select,input{width:100%;padding:13px;border:1px solid #d8dfe4;border-radius:11px;font:inherit;background:white;color:#263746;margin-bottom:15px}
button{width:100%;border:0;border-radius:13px;padding:15px;font:700 17px inherit;background:#477da8;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.note{font-size:13px;line-height:1.7;color:#687887}.status{padding:13px;border-radius:12px;margin-top:14px;background:#eef4f7;color:#36556b;line-height:1.6;min-height:48px}.status.ok{background:#eaf5ee;color:#236744}.status.err{background:#fff0ed;color:#9b3932}.award{text-align:center;font-size:25px;font-weight:800;color:#287a55;margin:10px 0}
</style></head>
<body><main>
<header class="hero"><div class="island">🏝️</div><h1>學習島・每日準時簽到</h1><p>完成簽到，準時出席獲得 2 點積分！</p></header>
<section class="card">
<label for="group">選擇班級</label><select id="group"><option value="數學9A">數學9A</option><option value="國文8A">國文8A</option><option value="國文8B">國文8B</option></select>
<label for="student">選擇自己的姓名</label><select id="student"><option value="">請先選擇班級</option></select>
<label for="date">簽到日期</label><input id="date" type="date" readonly>
<button id="checkin">確認準時簽到</button>
<div id="status" class="status">請選擇班級與姓名，再按下簽到。</div>
<div class="note" style="margin-top:14px">每位學生同一天只能成功簽到一次。準時簽到可獲得 2 點；本頁為測試版，請勿轉傳公開。</div>
</section></main>
<script>
const API="https://script.google.com/macros/s/AKfycbyZZ_i7LTq9pxuRAjPI9HUyy07CAK0TfTBcXT7HIfzxGPQpy3n5o6VsbE00daDZuHAd/exec";
const rosters={"數學9A":["慶豐","詠甯","祺叡","冠閔","鴻昱","聖民","柏曜"],"國文8A":["淮喆","鼎杰","佳瑋","子田","司浩"],"國文8B":["昱佑","奕訢","日良","羽琪","世賢","宣澔"]};
const $=id=>document.getElementById(id);
function today(){const a=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const o=Object.fromEntries(a.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`}
function fill(){const list=rosters[$("group").value];$("student").innerHTML='<option value="">請選擇姓名</option>';list.forEach(n=>{const o=document.createElement("option");o.value=n;o.textContent=n;$("student").append(o)});$("status").className="status";$("status").textContent="請選擇自己的姓名，再按下簽到。"}
function msg(s,c=""){$("status").className="status "+c;$("status").textContent=s}
async function getData(){const r=await fetch(API+"?action=getData&t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("讀取資料失敗");return await r.json()}
async function submit(){
 const group=$("group").value,name=$("student").value,date=$("date").value;
 if(!name){msg("請先選擇姓名。","err");return}
 const eventId=`daily-${date}-${group}-${name}`;
 $("checkin").disabled=true;msg("正在送出簽到，請稍候……");
 try{
   const before=await getData();
   if(!before.ok)throw Error("資料庫暫時無法讀取");
   const existed=before.attendance.some(x=>x.event_id===eventId);
   if(existed){msg("你今天已經簽到過囉！每人每天只能簽到一次。","err");return}
   await fetch(API,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"markAttendance",eventId,date,group,name,status:"準時"})});
   await new Promise(r=>setTimeout(r,1200));
   const after=await getData();
   const saved=after.attendance.find(x=>x.event_id===eventId);
   if(saved){$("checkin").textContent="今日已完成簽到";msg(`簽到成功！🎉 ${name} 獲得 2 點積分。`,"ok")}
   else{msg("簽到資料尚未確認寫入，請稍候按「重新確認」或聯絡老師。","err");$("checkin").textContent="重新確認簽到"}
 }catch(e){msg("簽到失敗："+e.message,"err")}
 finally{$("checkin").disabled=false}
}
$("group").addEventListener("change",fill);$("checkin").addEventListener("click",submit);$("date").value=today();fill();
</script></body></html>
