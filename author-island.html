<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#563b29;background:linear-gradient(#75c7e5 0 35%,#b4d990 35% 100%)}
.scene{max-width:850px;margin:auto;padding:28px 18px 55px}
.back{display:inline-block;padding:10px 17px;border-radius:22px;background:#fff4d8;border:3px solid #b9824b;color:#654127;text-decoration:none;font-weight:900;box-shadow:0 4px 0 #87552f}
.hero{margin:24px auto 28px;text-align:center;padding:28px 18px;border:8px solid #e6c68a;border-radius:32px;background:linear-gradient(145deg,#fff8e7ed,#f2dfb9ed);box-shadow:0 12px 0 #9a7049}
.island-icon{font-size:68px;filter:drop-shadow(0 6px 2px #80613e55)}
h1{font-size:clamp(30px,5vw,46px);margin:6px 0;color:#744126}
.subtitle{font-weight:800;color:#987047}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.name{display:grid;place-items:center;min-height:150px;padding:22px;border-radius:26px;background:#fff8e8;border:5px solid #c99c5e;box-shadow:0 9px 0 #865b38;color:#80452b;text-decoration:none;font-size:30px;font-weight:900;transition:transform .2s,box-shadow .2s}
.name:hover{transform:translateY(-4px);box-shadow:0 13px 0 #865b38}
.name:focus-visible{outline:4px solid #386f9b;outline-offset:5px}
@media(max-width:560px){.names{grid-template-columns:1fr}.name{min-height:110px}}
</style>
</head>
