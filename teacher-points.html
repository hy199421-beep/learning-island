<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>學習島｜教師積分管理</title>
<style>
:root{--ink:#263746;--blue:#477da8;--gold:#d6ad58;--paper:#fffdf7;--muted:#687887;--line:#e7e1d5;--green:#287a55;--red:#b94a48}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eaf5fb,#f8f4e9);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
.wrap{max-width:1050px;margin:0 auto;padding:24px 16px 48px}.hero{background:linear-gradient(120deg,#477da8,#6f9eb9);color:white;padding:24px;border-radius:22px;box-shadow:0 10px 26px #315c7a22}
h1{margin:0 0 8px;font-size:clamp(24px,4vw,34px)}.hero p{margin:0;opacity:.93}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px;box-shadow:0 5px 18px #4353630b}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field label{display:block;font-weight:700;font-size:14px;margin:0 0 7px}.field select,.field input{width:100%;padding:12px;border:1px solid #d8dfe4;border-radius:11px;background:white;font:inherit;color:var(--ink)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.class-title{font-size:21px;font-weight:800}.hint{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:16px}
.student-card{border:1px solid var(--line);border-radius:15px;padding:14px;background:white;min-height:150px;color:var(--ink)}
.student-card .name{font-size:18px;font-weight:800;display:block}.student-card .score{display:block;color:var(--green);font-size:14px;margin-top:8px}.student-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}.student-actions input{width:78px;min-width:0;padding:9px 8px;border:1px solid #d8dfe4;border-radius:9px;font:inherit}.student-actions button{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:800;cursor:pointer;background:#477da8;color:white}.student-actions button.quick{background:#287a55}.student-actions button:disabled{opacity:.55;cursor:wait}.student-actions .unit{font-size:12px;color:var(--muted)}
.status{margin-top:14px;padding:12px 14px;border-radius:12px;background:#eef4f7;color:#36556b;font-size:14px;min-height:44px}.status.ok{background:#eaf5ee;color:#236744}.status.err{background:#fff0ed;color:#9b3932}
.summary{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#f4f0e6;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px}
button.secondary{border:1px solid #cbd6dc;background:white;color:var(--ink);border-radius:10px;padding:9px 13px;font:inherit;cursor:pointer}
.foot{font-size:12px;color:var(--muted);line-height:1.7;margin:16px 3px}
@media(max-width:650px){.controls{grid-template-columns:1fr}.wrap{padding:14px 12px 32px}.hero{padding:20px}}

.back-island{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:11px 17px;border:1px solid #d6ad58;border-radius:999px;background:linear-gradient(135deg,#fffdf7,#f7e9c7);color:#36556b;text-decoration:none;font-weight:800;box-shadow:0 4px 12px #315c7a18;transition:transform .15s,box-shadow .15s}.back-island:hover{transform:translateY(-2px);box-shadow:0 7px 16px #315c7a25}.back-island:focus-visible{outline:3px solid #477da8;outline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
<a class="back-island" href="./index.html" aria-label="返回學習島首頁">🏝️ 返回學習島</a>
  <header class="hero">
    <h1>🏝️ 學習島｜教師積分管理</h1>
    <p>日期由電腦台灣時間自動帶入；教師後台不限上課時段，任何時間選擇班級並點選學生即可加 1 分。</p>
  </header>

  <section class="panel">
    <div class="controls">
      <div class="field"><label for="group">選擇班級</label><select id="group"><option value="數學9A">數學9A</option><option value="國文8A">國文8A</option><option value="國文8B">國文8B</option></select></div>
      <div class="field"><label>電腦自動判定日期</label><div class="hint" id="dateDisplay" style="padding:12px;background:#f4f7f8;border:1px solid #d8dfe4;border-radius:11px">讀取中…</div></div>
      <div class="field"><label>電腦自動判定節次</label><div class="hint" id="periodDisplay" style="padding:12px;background:#f4f7f8;border:1px solid #d8dfe4;border-radius:11px">讀取中…</div></div>
    </div>
  </section>

  <section class="panel">
    <div class="topline">
      <div><div class="class-title" id="classTitle">數學9A</div><div class="hint" id="lessonLabel">請選擇日期與節次</div></div>
      <button class="secondary" id="refresh">↻ 更新積分</button>
    </div>
    <div class="summary" style="margin-top:12px">
      <span class="pill" id="studentCount">學生：讀取中</span>
      <span class="pill" id="classPointCount">本堂已加分：0 次</span>
    </div>
    <div class="grid" id="students"></div>
    <div class="status" id="status">正在連接新積分資料庫……</div>
  </section>
  <p class="foot">資料來源：學習島全新積分系統 v1.2. 每次點選會新增一筆課堂加分紀錄；請確認班級、日期與節次正確後再點選學生。</p>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyZZ_i7LTq9pxuRAjPI9HUyy07CAK0TfTBcXT7HIfzxGPQpy3n5o6VsbE00daDZuHAd/exec";
let db = null;
let busy = new Set();
const $ = id => document.getElementById(id);
let currentDate="",currentPeriod="",inClassTime=false;
const periods=[{n:"1",s:"08:15",e:"09:00"},{n:"2",s:"09:10",e:"09:55"},{n:"3",s:"10:05",e:"10:50"},{n:"4",s:"11:00",e:"11:45"},{n:"5",s:"13:15",e:"14:00"},{n:"6",s:"14:10",e:"14:55"},{n:"7",s:"15:05",e:"15:50"},{n:"8",s:"16:00",e:"16:45"}];
const weekly={"1":{"1":"數學9A","2":"國文8A","7":"國文8B"},"2":{"3":"數學9A","4":"國文8B","7":"國文8A"},"3":{"1":"國文8A","3":"國文8B"},"4":{"3":"數學9A","5":"國文8A","6":"國文8B"},"5":{"1":"國文8B","2":"數學9A","3":"國文8A"}};
function taipeiParts(){
 const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
 return Object.fromEntries(parts.map(p=>[p.type,p.value]));
}
function detectClock(){
 const p=taipeiParts();
 currentDate=p.year+"-"+p.month+"-"+p.day;
 const weekdayMap={"Mon":"星期一","Tue":"星期二","Wed":"星期三","Thu":"星期四","Fri":"星期五","Sat":"星期六","Sun":"星期日"};
 const weekday=weekdayMap[p.weekday]||"";
 const now=Number(p.hour)*60+Number(p.minute);
 const selected=$("group").value;
 const schedule=(db?.schedule||[]).find(row=>{
   if(row.group!==selected || row.weekday!==weekday) return false;
   const a=String(row.start_time||"00:00").split(":").map(Number);
   const b=String(row.end_time||"00:00").split(":").map(Number);
   return now>=a[0]*60+a[1] && now<=b[0]*60+b[1];
 });
 currentPeriod=schedule?String(schedule.period):"";
 inClassTime=!!schedule;
 $("dateDisplay").textContent=currentDate;
 $("periodDisplay").textContent=schedule?("第 "+schedule.period+" 節｜"+schedule.start_time+"–"+schedule.end_time):"目前非此班上課時段";
 if(!db){setStatus("正在讀取課表與積分資料……");}
 else if(schedule){setStatus("時間已依資料庫課表判定："+weekday+" 第 "+schedule.period+" 節；可進行教師加分。","ok");}
 else{setStatus("今天（"+(weekday||"非上課日")+"）目前不是「"+selected+"」的排課時段；教師仍可自由加分，並記錄為課後加分。","ok");}
 if(db)render();
}
function sessionId(){return `${currentDate}_${currentPeriod||"課後"}_${$("group").value}`;}

function setStatus(msg,type=""){ $("status").textContent=msg; $("status").className="status "+type; }
function num(v){return Number(v)||0;}
function balanceFor(group,name){
  if(!db)return 0;
  const a=db.attendance.filter(x=>x.group===group&&x.name===name).reduce((s,x)=>s+num(x.points),0);
  const row=(db.pointBalances||[]).find(x=>x.group===group&&x.name===name);
  const p=row?num(row.total_points):0;
  const r=db.redemptions.filter(x=>x.group===group&&x.name===name).reduce((s,x)=>s+num(x.cost),0);
  return a+p-r;
}
function render(){
  if(!db)return;
  const group=$("group").value, sid=sessionId();
  const roster=db.students.filter(s=>s.group===group && (s.active===true || String(s.active).toUpperCase()==="TRUE"));
  $("classTitle").textContent=group;
  $("lessonLabel").textContent=currentPeriod?`${currentDate}｜第 ${currentPeriod} 節`:`${currentDate}｜教師自由加分（非課堂時段）`;
  $("studentCount").textContent=`學生：${roster.length} 人`;
  $("classPointCount").textContent="教師加分採累計制";
  $("students").innerHTML="";
  roster.forEach(s=>{
    const card=document.createElement("div");card.className="student-card";
    const n=document.createElement("span");n.className="name";n.textContent=s.name;
    const score=document.createElement("span");score.className="score";score.textContent=`目前總積分：${balanceFor(group,s.name)} 分`;
    const actions=document.createElement("div");actions.className="student-actions";
    const input=document.createElement("input");input.type="number";input.min="1";input.step="1";input.value="1";input.inputMode="numeric";input.setAttribute("aria-label",s.name+"加分數量");
    const unit=document.createElement("span");unit.className="unit";unit.textContent="分";
    const add=document.createElement("button");add.textContent=busy.has(s.name)?"處理中…":"確認加分";add.disabled=busy.has(s.name);add.addEventListener("click",()=>addPoint(group,s.name,input.value));
    const quick=document.createElement("button");quick.className="quick";quick.textContent="+1 快速加分";quick.disabled=busy.has(s.name);quick.addEventListener("click",()=>addPoint(group,s.name,1));
    actions.append(input,unit,add,quick);card.append(n,score,actions);$("students").appendChild(card);
  });
}
async function loadData(){
  setStatus("正在讀取最新積分資料……");
  try{
    const res=await fetch(API_URL+"?action=getData&t="+Date.now(),{method:"GET",cache:"no-store"});
    if(!res.ok)throw new Error("資料庫回應異常："+res.status);
    const data=await res.json();
    if(!data.ok)throw new Error(data.error||"讀取資料失敗");
    db=data;detectClock();render();setStatus("v1.2 資料庫連線成功，學生名單、課表與積分已更新。","ok");
  }catch(e){setStatus("目前無法讀取資料庫："+e.message+"。若持續發生，請把此畫面截圖給我協助排查。","err");}
}
async function addPoint(group,name,rawPoints=1){
  if(busy.has(name))return;
  const points=Number(rawPoints);
  if(!Number.isSafeInteger(points)||points<1||points>1000){setStatus("加分數量請輸入 1 到 1000 的正整數。","err");return;}
  detectClock();
  const beforeRow=(db.pointBalances||[]).find(x=>x.group===group&&x.name===name);
  const before=beforeRow?num(beforeRow.total_points):0;
  const payload={action:"addClassPoint",group,name,date:currentDate,sessionId:sessionId(),eventId:"teacher-"+crypto.randomUUID(),points,note:currentPeriod?(`教師後台加分 ${points} 分｜第 ${currentPeriod} 節`):(`教師後台自由加分 ${points} 分｜非課堂時段`)};
  busy.add(name);render();setStatus(`正在為「${name}」送出 +${points} 分……`);
  try{
    // text/plain avoids a cross-origin JSON preflight; Apps Script parses the JSON body.
    await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    setStatus(`已送出「${name}」+${points} 分，正在確認資料同步……`);
    let confirmed=false;
    for(const delay of [350,650,1000,1500]){
      await new Promise(r=>setTimeout(r,delay));
      const res=await fetch(API_URL+"?action=getData&t="+Date.now(),{cache:"no-store"});
      const latest=await res.json();
      const row=(latest.pointBalances||[]).find(x=>x.group===group&&x.name===name);
      if(latest.ok && row && Number(row.total_points||0)>=before+points) {db=latest;confirmed=true;break;}
    }
    if(confirmed)setStatus(`✅ 已確認「${name}」+${points} 分，總積分已更新。`,"ok");
    else setStatus(`已送出「${name}」+${points} 分，但尚未確認同步。請按「更新積分」核對，勿立即重複點選。`,"err");
  }catch(e){setStatus("加分送出時發生問題："+e.message,"err");}
  finally{busy.delete(name);if(db)render();}
}
$("group").addEventListener("change",render);
$("refresh").addEventListener("click",loadData);
detectClock();
loadData();
setInterval(detectClock,15000);
</script>
</body>
</html>
