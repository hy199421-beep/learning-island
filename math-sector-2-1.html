<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扇形探險隊｜弧長與扇形面積漸進練習</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--tx:#1f2a44;--mu:#5d6b8a;--pri:#3b6cff;--on:#fff;--ok:#1fa366;--bad:#e5484d;--line:#3b4a6b;--fill:#cfe0ff;--bd:#d6def0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10162a;--card:#1a2340;--tx:#e8edff;--mu:#9aa8cc;--pri:#7c9bff;--on:#10162a;--ok:#3ccf8e;--bad:#ff6b70;--line:#b8c4e8;--fill:#35509a;--bd:#2c3860;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10162a;--card:#1a2340;--tx:#e8edff;--mu:#9aa8cc;--pri:#7c9bff;--on:#10162a;--ok:#3ccf8e;--bad:#ff6b70;--line:#b8c4e8;--fill:#35509a;--bd:#2c3860;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:12px 14px 28px}
header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
#sc{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:2px 12px;font-size:15px}
.bar{height:8px;background:var(--bd);border-radius:6px;margin:10px 0 14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .4s}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px}
.tag{color:var(--pri);font-weight:800;font-size:14px}
h1,h2{margin:4px 0 8px}h2{font-size:19px}.sub{color:var(--mu);font-size:14px;margin:0 0 6px}
svg{width:100%;max-height:260px;display:block;margin:0 auto}
.dsh{stroke:var(--mu);stroke-width:2;stroke-dasharray:5 4;fill:none}
.sx{fill:var(--fill);fill-opacity:.65;stroke:var(--line);stroke-width:2.5}
.hl{fill:none;stroke:var(--pri);stroke-width:7;stroke-linecap:round}
.lb{font:700 15px sans-serif;fill:var(--tx)}.lq{font:800 15px sans-serif;fill:var(--pri)}
.fm{background:var(--bg);border-radius:12px;padding:10px 14px;margin:10px 0;font-weight:700}
.sl{font-weight:700;margin-top:8px}
.in{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
input{width:130px;font-size:20px;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-family:inherit}
input:focus{outline:none;border-color:var(--pri)}
.dn{padding:8px 12px;border-radius:12px;margin:8px 0;font-size:15px}
.dn.ok{background:rgba(31,163,102,.13);border:2px solid var(--ok)}.dn.no{background:rgba(229,72,77,.1);border:2px solid var(--bad)}
.fb{margin:10px 0;padding:10px 12px;border-radius:12px;font-size:15px;display:none}
.fb.show{display:block}.fb.ok{background:rgba(31,163,102,.15);border:2px solid var(--ok)}.fb.no{background:rgba(229,72,77,.13);border:2px solid var(--bad)}.fb.hint{background:rgba(59,108,255,.12);border:2px solid var(--pri)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:700;background:var(--pri);color:var(--on);cursor:pointer;font-family:inherit}
.btn.g{background:transparent;color:var(--pri);border:2px solid var(--pri)}
.big{font-size:56px;text-align:center}ul{padding-left:20px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 4px;line-height:1.3;font-weight:700}.fr>span{padding:0 6px}.fr>span:first-child{border-bottom:2px solid currentColor}
.fin{display:inline-flex;flex-direction:column;align-items:center}.fin input{width:96px;text-align:center}.fin hr{width:100%;border:0;border-top:3px solid var(--tx);margin:5px 0}
#cb{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;border-radius:28px;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#cp{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:420px;z-index:30;box-sizing:border-box;background:var(--card);border:2px solid var(--bd);border-bottom:0;border-radius:18px 18px 0 0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 18px rgba(0,0,0,.25);display:none}
#cp.on{display:block}
.ch{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.cx{border:0;background:none;color:var(--tx);font-size:22px;cursor:pointer}
#cd{background:var(--bg);border-radius:12px;padding:6px 12px;margin:6px 0 8px;text-align:right;min-height:58px;overflow:hidden}
#cd small{display:block;color:var(--mu);min-height:20px;font-size:14px}
#cd b{font-size:28px;word-break:break-all}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp button{height:44px;border:0;border-radius:10px;font-size:20px;font-weight:700;background:var(--bg);color:var(--tx);cursor:pointer;font-family:inherit}
.kp .o{background:var(--fill)}.kp .eq{background:var(--pri);color:var(--on);grid-row:span 2;height:auto}.kp .z{grid-column:span 2}
body.co #app{padding-bottom:440px}
</style></head><body>
<div id="app">
<header><span>🧭 扇形探險隊</span><span id="sc">0 分</span></header>
<div class="bar"><i id="pg"></i></div>
<main id="main"></main>
<button class="btn" id="cb">🧮 計算機</button>
<div id="cp" role="dialog" aria-label="計算機"><div class="ch"><span>🧮 計算機</span><button class="cx" id="cc" aria-label="關閉">✕</button></div><div id="cd"><small id="c1"></small><b id="c2">0</b></div><div class="kp" id="kp"></div><button class="btn" id="cf" style="width:100%;margin-top:8px">填入答案</button></div>
</div>
<script>
const $=s=>document.querySelector(s),main=$('#main'),pg=$('#pg'),scr=$('#sc');
const f=n=>n.toFixed(1),pt=(x,y,r,d)=>[x+r*Math.cos(d*Math.PI/180),y-r*Math.sin(d*Math.PI/180)];
const mv=q=>`M${f(q[0])} ${f(q[1])}`;
const arc=(x,y,r,a,b)=>{const q=pt(x,y,r,b);return `A${r} ${r} 0 ${((b-a+360)%360)>180?1:0} 0 ${f(q[0])} ${f(q[1])}`};
const sec=(x,y,r,a,b)=>mv([x,y])+'L'+f(pt(x,y,r,a)[0])+' '+f(pt(x,y,r,a)[1])+arc(x,y,r,a,b)+'Z';
const gc=(a,b)=>b?gc(b,a%b):a;
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const tx=(q,s,c='lb')=>`<text class="${c}" x="${f(q[0])}" y="${f(q[1]+5)}" text-anchor="middle">${s}</text>`;
function fig(q){const a=20,b=a+q.th,m=a+q.th/2,P=(r,d)=>pt(150,150,r,d),A=q.k=='arc';
let s=`<circle class="dsh" cx="150" cy="150" r="100"/><path class="sx" d="${sec(150,150,100,a,b)}"/>`;
if(A)s+=`<path class="hl" d="${mv(P(100,a))+arc(150,150,100,a,b)}"/>`;
const p=P(55,a);
s+=`<circle cx="150" cy="150" r="3.5" fill="currentColor"/>`+(q.c=='d'?`<line class="dsh" x1="${f(P(100,200)[0])}" y1="${f(P(100,200)[1])}" x2="${f(P(100,a)[0])}" y2="${f(P(100,a)[1])}"/>`+tx([P(56,200)[0],P(56,200)[1]+20],`直徑 = ${2*q.r}`):tx([p[0],p[1]+16],`半徑 = ${q.r}`))+tx(P(q.th<50?66:42,m),`${q.th}°`)+tx(P(122,m),A?'弧長 = ?':'面積 = ?','lq');
return `<svg viewBox="0 0 300 300" role="img">${s}</svg>`}
const T={arc:(r,th)=>`如圖，圓心角 ${th}° 的扇形，弧長是多少公分？（半徑要從圖上找）`,area:(r,th)=>`如圖，圓心角 ${th}° 的扇形，面積是多少平方公分？（半徑要從圖上找）`};
const M=(lv,k,r,th,c)=>({lv,k,r,th,c,t:T[k](r,th)});
const Q=[M(0,'arc',6,60,'r'),M(0,'arc',9,120,'r'),M(0,'arc',8,90,'r'),
M(1,'area',6,60,'r'),M(1,'area',4,90,'r'),M(1,'area',9,120,'d'),
M(2,'arc',12,45,'d'),M(2,'arc',15,240,'r'),M(2,'arc',10,90,'d'),
M(3,'area',12,30,'r'),M(3,'area',10,36,'d'),M(3,'area',6,120,'d'),
M(4,'arc',8,135,'d'),M(4,'area',9,40,'d'),M(4,'area',12,150,'r'),
M(5,'arc',14,90,'d'),M(5,'area',20,72,'r'),M(5,'arc',21,120,'d')];
const L=['弧長・跟著做','面積・跟著做','弧長・少一點提示','面積・少一點提示','三步驟・自己想','獨立挑戰'],LE=['📏','🍕','🔍','🧩','🚀','🏆'];
const LN=['五步驟：寫比例 → 約分 → 填半徑 → 算整個圓周長 → 算弧長','五步驟：寫比例 → 約分 → 填半徑 → 算整個圓面積 → 算扇形面積','四步驟：自己從圖上找半徑，比例直接約分','四步驟：面積版本，提示變少了','三步驟：找半徑、算比例、算答案（弧長或面積都可能出現）','一步到位：半徑、比例、答案都自己算！'];
const NUM=['①','②','③','④','⑤'],W={1:[10],2:[3,7],3:[2,2,6],4:[1,2,2,5],5:[1,1,1,2,5]};
function steps(q){const g=gc(q.th,360),n=q.th/g,d=360/g,r=q.r,l=q.lv,A=q.k=='arc',w=A?2*r:r*r,a=A?2*r*q.th/360:r*r*q.th/360,u=A?'π 公分':'π 平方公分';
const D=q.c=='d',rad={kind:'num',a:r,u:'公分',show:r+' 公分',p:l<2?(A?'整個圓的圓周長 = 2π × 半徑。圖上的半徑是多少公分？':'整個圓的面積 = π × 半徑 × 半徑。圖上的半徑是多少公分？'):'從圖上找出半徑是多少公分？',h:D?['先看清楚：圖上標的是「半徑」還是「直徑」？','圖上標的是直徑，半徑是直徑的一半。']:['先看清楚：圖上標的是「半徑」還是「直徑」？','圖上寫的是「半徑」，那個數字就是半徑的長度。'],e:D?`半徑 = ${2*r} ÷ 2 = ${r}（公分）`:`半徑 = ${r} 公分`};
const raw={kind:'raw',p:'圓心角占整圓幾分之幾？分子填圓心角，分母填 360',show:F(q.th,360),h:[`比例 = ${F('圓心角',360)}，寫成分數。`,`分子是圓心角 ${q.th}，分母是 360。`],e:`${F(q.th,360)}，就是圓心角占整圓 360° 的比例。`};
const sp={kind:'simp',p:l<2?`把 ${F(q.th,360)} 約分到最簡`:'圓心角占整圓的比例（約分到最簡）',show:F(n,d),h:[l<2?'分子分母同時除以同一個數，直到不能再約。':`比例 = ${F('圓心角',360)}，再約分。`,`${q.th} 和 360 的最大公因數是 ${g}，同時除以 ${g}。`],e:`${F(q.th,360)} = ${F(n,d)}`};
const wh={kind:'num',a:w,u,show:w+u,p:A?(l<2?'整個圓的圓周長 = 2π × 半徑，是幾 π 公分？':'整個圓的圓周長是多少？'):(l<2?'整個圓的面積 = π × 半徑²，是幾 π 平方公分？':'整個圓的面積是多少？'),
h:A?['圓周長 = 2πr，也就是 2 × 半徑 × π。','用 2 乘上你剛剛找到的半徑。']:['圓面積 = πr² = π × 半徑 × 半徑。','用你剛剛找到的半徑，自己乘自己。'],
e:A?`圓周長 = 2π × ${r} = ${w}π（公分）`:`圓面積 = π × ${r}² = ${w}π（平方公分）`};
const fin={kind:'num',a,u,show:a+u,
p:l<2?(A?`弧長 = ${w}π × ${F(n,d)}，填 π 前面的數字`:`扇形面積 = ${w}π × ${F(n,d)}，填 π 前面的數字`):l<4?(A?'弧長 = 整個圓周長 × 比例，填 π 前面的數字':'扇形面積 = 整個圓面積 × 比例，填 π 前面的數字'):'你的答案',
h:[(l==5?'先從圖上找半徑（標的是直徑，半徑要再除以 2）。<br>':'')+(A?'弧長 = 圓周長 × 比例，圓周長 = 2π × 半徑':'扇形面積 = 圓面積 × 比例，圓面積 = π × 半徑²'),`${w}π × ${F(n,d)}：先算 ${w}×${n}，再除以 ${d}。`],
e:A?`弧長 = ${w}π × ${F(n,d)} = ${a}π（公分）`:`扇形面積 = ${w}π × ${F(n,d)} = ${a}π（平方公分）`};
return[[raw,sp,rad,wh,fin],[raw,sp,rad,wh,fin],[rad,sp,wh,fin],[rad,sp,wh,fin],[rad,sp,fin],[fin]][l]}
const norm=s=>s.replace(/[０-９]/g,c=>c.charCodeAt(0)-65248).replace(/／/g,'/').replace(/[π度°\s]|公分|cm/gi,'');
const pf=s=>{const m=s.match(/^(\d+)\/(\d+)$/);return m?[+m[1],+m[2]]:null};
function val(s){s=norm(s);const m=pf(s);if(m)return m[1]?m[0]/m[1]:NaN;return s===''?NaN:Number(s)}
function judge(st,s,q){if(st.kind=='num'){const v=val(s);return isNaN(v)?'nan':Math.abs(v-st.a)<.01?'ok':'no'}
const x=norm(s[0]),y=norm(s[1]);if(!/^\d+$/.test(x)||!/^\d+$/.test(y)||+y==0)return'nan';const n=+x,d=+y;
if(st.kind=='raw')return n==q.th&&d==360?'ok':n*360==q.th*d?'form':'no';
const g=gc(q.th,360),en=q.th/g,ed=360/g;return n==en&&d==ed?'ok':n*ed==en*d?'form2':'no'}
let i=0,si=0,S=[],sc=0,tr=0,hc=0,dn=false,res=[];
function start(){i=sc=0;res=[];scr.textContent='0 分';pg.style.width='0';
main.innerHTML=`<div class="card"><div class="big">🧭</div><h1 style="text-align:center">扇形探險隊</h1><p>6 關、18 題，每一題的目標都是算出<b>弧長</b>或<b>扇形面積</b>。前面的關卡拆成小步驟帶著你做，越往後步驟越少，最後自己一步完成。<b>題目不會直接告訴你半徑</b>，要從圖上的線索自己找出來。</p><div class="fm">直徑 = 2 × 半徑<br>比例 = ${F('圓心角',360)}<br>弧長 = 圓周長 × 比例（圓周長 = 2πr）<br>扇形面積 = 圓面積 × 比例（圓面積 = πr²）</div><ul><li>分數要分開輸入：上面的格子填分子，下面的格子填分母</li><li>算圓周長、弧長、面積時，只要填 π 前面的數字</li><li>每步一次就對拿滿分，用提示或第二次才對拿一半</li><li>不會算的時候，點右下角的 <b>🧮 計算機</b>，算完按「填入答案」就會自動填進格子</li></ul><button class="btn" id="go">出發！</button></div>`;
$('#go').onclick=show}
function show(){const q=Q[i];S=steps(q);si=0;dn=false;
main.innerHTML=`<div class="card"><div class="tag">${LE[q.lv]} 第 ${q.lv+1} 關・${L[q.lv]}　(${i+1}/${Q.length})</div><p class="sub">${LN[q.lv]}</p><h2>${q.t}</h2>${fig(q)}<div id="steps"></div><div class="fb" id="fb"></div><div class="row"><button class="btn g" id="hb">💡 提示</button><button class="btn" id="nx" hidden>${i==Q.length-1?'看成績 🏁':'下一題 ➜'}</button></div></div>`;
$('#hb').onclick=()=>{if(dn)return;const H=S[si].h;fb('hint','💡 '+H[Math.min(hc,H.length-1)]);hc++;$('#hb').textContent=hc<H.length?'💡 再給我一點提示':'💡 提示已全部顯示'};
$('#nx').onclick=()=>{i++;i<Q.length?show():end()};addStep()}
const lab=()=>S.length>1?NUM[si]+' ':'';
function addStep(){const st=S[si];tr=0;hc=0;$('#hb').textContent='💡 提示';
const box=st.kind=='num'?`<input id="ip" inputmode="decimal" autocomplete="off" placeholder="答案"><b>${st.u||''}</b>`:`<span class="fin"><input id="ip1" inputmode="numeric" autocomplete="off" placeholder="分子"><hr><input id="ip2" inputmode="numeric" autocomplete="off" placeholder="分母"></span>`;
$('#steps').insertAdjacentHTML('beforeend',`<div id="cur"><div class="sl">${lab()}${st.p}</div><div class="in">${box}<button class="btn" id="ck">送出</button></div></div>`);
$('#ck').onclick=sub;
if(st.kind=='num')$('#ip').onkeydown=e=>{if(e.key=='Enter')sub()};else{$('#ip1').onkeydown=e=>{if(e.key=='Enter')$('#ip2').focus()};$('#ip2').onkeydown=e=>{if(e.key=='Enter')sub()}}
pg.style.width=((i+si/S.length)/Q.length*100)+'%'}
function fb(c,h){const b=$('#fb');b.className='fb show '+c;b.innerHTML=h}
function sub(){if(dn)return;const st=S[si],q=Q[i],r=judge(st,st.kind=='num'?$('#ip').value:[$('#ip1').value,$('#ip2').value],q);
if(r=='nan'){fb('hint',st.kind=='num'?'請輸入數字喔！':'分子和分母都要填整數喔！');return}
if(r=='form'){fb('hint','比例的值對了！不過這一步請先照「圓心角 ÷ 360」寫：分子填圓心角，分母填 360。');return}
if(r=='form2'){fb('hint','數值對了，但還可以再約分喔！');return}
if(r=='ok'){const full=tr==0&&hc==0,w=W[S.length][si];fin(true,full?w:Math.ceil(w/2),full)}
else{tr++;if(tr>=2)fin(false,0,false);else fb('no','❌ 再想想，還有一次機會！可以按「💡 提示」。')}}
function fin(ok,p,full){const st=S[si];sc+=p;scr.textContent=sc+' 分';res.push({lv:Q[i].lv,full});
$('#cur').outerHTML=`<div class="dn ${ok?'ok':'no'}"><b>${lab()}${st.p}</b><br>${ok?'✅':'正確答案：'} <b>${st.show}</b>${ok?`　+${p} 分`:''}</div>`;
fb(ok?'ok':'no',(ok?'答對了！':'這一步的答案在上面喔。')+'<br>'+st.e);
si++;if(si<S.length)addStep();else{dn=true;pg.style.width=((i+1)/Q.length*100)+'%';$('#nx').hidden=false;$('#hb').hidden=true}}
function end(){pg.style.width='100%';const tot=Q.length*10,pc=sc/tot,r=pc>=.9?['🏆','扇形大師',3]:pc>=.6?['🥈','扇形探險家',2]:['🌱','扇形小學徒',1];
const per=L.map((n,l)=>{const z=res.filter(x=>x.lv==l);return `<li>${LE[l]} ${n}：${z.filter(x=>x.full).length}/${z.length} 步一次就對</li>`}).join('');
main.innerHTML=`<div class="card"><div class="big">${r[0]}</div><h1 style="text-align:center">${'⭐'.repeat(r[2])}<br>${r[1]}</h1><p style="text-align:center">總分 ${sc} / ${tot}</p><ul>${per}</ul><button class="btn" id="again">再玩一次</button></div>`;
$('#again').onclick=start}
let ce='',cr='',cdn=false,lastIn=null;
const KS=['C','⌫','÷','×','7','8','9','-','4','5','6','+','1','2','3','=','0','.'];
$('#kp').innerHTML=KS.map(k=>`<button class="${'C⌫÷×-+'.includes(k)?'o':''}${k=='='?'eq':''}${k=='0'?'z':''}" data-k="${k}">${k}</button>`).join('');
function ev(s){const t=s.match(/\d+\.?\d*|\.\d+|[+\-×÷]/g);if(!t||t.join('')!==s)return null;
if(t[0]=='-'&&t.length>1&&!isNaN(+t[1]))t.splice(0,2,'-'+t[1]);
const n=[],o=[];for(let i=0;i<t.length;i++){if(i%2==0){if(isNaN(+t[i]))return null;n.push(+t[i])}else{if(t[i].length!=1||'+-×÷'.indexOf(t[i])<0)return null;o.push(t[i])}}
if(n.length!=o.length+1)return null;
const m=[n[0]],p=[];for(let i=0;i<o.length;i++){if(o[i]=='×')m[m.length-1]*=n[i+1];else if(o[i]=='÷'){if(n[i+1]==0)return null;m[m.length-1]/=n[i+1]}else{p.push(o[i]);m.push(n[i+1])}}
let r=m[0];p.forEach((x,i)=>{r=x=='+'?r+m[i+1]:r-m[i+1]});return r}
const fm=v=>String(+v.toFixed(8));
function cp(k){const was=cdn;cdn=false;cr='';
if(k=='C')ce='';
else if(k=='⌫')ce=was?'':ce.slice(0,-1);
else if(k=='='){const v=ev(ce);if(v===null)cr=ce?'算式不完整喔':'';else{cr=ce+' =';ce=fm(v);cdn=true}}
else{if(was&&/[0-9.]/.test(k))ce='';if('÷×-+'.includes(k)&&ce.length>1&&/[÷×\-+]$/.test(ce))ce=ce.slice(0,-1);ce+=k}
$('#c1').textContent=cr;$('#c2').textContent=ce||'0'}
$('#kp').onclick=e=>{const b=e.target.closest('button');if(b)cp(b.dataset.k)};
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('#ip,#ip1,#ip2'))lastIn=e.target});
$('#cf').onclick=()=>{const v=ev(ce);if(v===null){$('#c1').textContent='先輸入算式，再按 =';return}
const el=lastIn&&document.body.contains(lastIn)&&!lastIn.disabled?lastIn:($('#ip')||$('#ip1'));
if(!el){$('#c1').textContent='現在沒有可以填的格子';return}
el.value=fm(v);$('#c1').textContent='已填入 ✅'};
$('#cb').onclick=()=>{$('#cp').classList.add('on');document.body.classList.add('co');$('#cb').hidden=true};
$('#cc').onclick=()=>{$('#cp').classList.remove('on');document.body.classList.remove('co');$('#cb').hidden=false};
start();
</script></body></html>
