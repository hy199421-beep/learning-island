<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8fbd76"><title>學習島｜一起闖關學習</title>
<style>
:root{--ink:#493523;--wood:#a96832;--cream:#fff1d5;--grass:#a7ce83;--shadow:#593d29}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;background:#70c5dc;overflow-x:hidden}
button{font:inherit;cursor:pointer}.game{min-height:100vh;position:relative;overflow:hidden;background:linear-gradient(#58b7dc 0 18%,#a7cf86 18% 100%)}
.sky{position:absolute;inset:0 0 auto;height:24%;background:linear-gradient(180deg,#48b4dc,#a5d9e7);clip-path:polygon(0 0,100% 0,100% 75%,0 100%)}
.island{position:relative;min-height:100vh;max-width:1500px;margin:auto;padding:30px 3vw 100px;background:radial-gradient(ellipse at 50% 45%,#c1dc91 0,#a9ce83 62%,#8fbd70 100%);clip-path:polygon(50% 0,94% 12%,100% 40%,94% 88%,50% 100%,6% 88%,0 40%,6% 12%);isolation:isolate}
.island:before{content:"";position:absolute;inset:10px;border:13px solid #e8cf91;border-radius:48% 52% 45% 55%/35% 40% 60% 65%;opacity:.9;z-index:-1;box-shadow:inset 0 0 0 7px #d0a76a}
.cloud{position:absolute;color:#fff8d9;font-size:44px;opacity:.65;filter:blur(.3px);animation:drift 18s ease-in-out infinite alternate}.c1{top:5%;left:9%}.c2{top:12%;right:8%;animation-delay:-8s}@keyframes drift{to{transform:translateX(35px)}}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;max-width:1100px;margin:0 auto;position:relative;z-index:4}.brand{display:flex;align-items:center;gap:12px;background:#fff5dfd9;padding:10px 18px;border:3px solid #d6a56b;border-radius:22px;box-shadow:0 5px 0 #9b6a43}.brand-icon{font-size:34px}.brand h1{font-size:clamp(20px,3vw,30px);margin:0}.brand p{font-size:12px;margin:2px 0 0;color:#8c6746}.stats{background:#364b43;color:white;border-radius:30px;padding:12px 18px;font-weight:800;box-shadow:0 5px 0 #263b33}
.welcome{text-align:center;margin:25px auto 0;position:relative;z-index:2}.welcome h2{font-size:clamp(24px,4vw,38px);margin:0;text-shadow:0 2px #fff}.welcome p{margin:7px 0;color:#4e693d;font-weight:700}
.villages{position:relative;max-width:1050px;height:560px;margin:5px auto 0}
.village{position:absolute;width:34%;min-width:230px;height:215px;border-radius:22% 20% 18% 18%;background:#f4e9d7;border:12px solid var(--edge);box-shadow:0 12px 0 color-mix(in srgb,var(--edge),#65452e 25%),0 18px 22px #4a6c3d55;transform:perspective(700px) rotateX(8deg);display:flex;align-items:center;justify-content:center}
.village:before{content:"";position:absolute;inset:9px;border:2px dashed #ffffffa8;border-radius:inherit}
.village .trees{position:absolute;top:-30px;left:12%;font-size:34px;filter:drop-shadow(0 4px 1px #547347)}
.buildings{display:flex;gap:14px;align-items:end;position:relative;z-index:1}.house{width:64px;height:82px;position:relative;background:var(--wall);border:4px solid #e6d1a2;border-radius:5px;box-shadow:5px 6px 0 #79573a;display:flex;justify-content:center;align-items:center;font-size:28px}.house:before{content:"";position:absolute;top:-22px;left:-8px;width:70px;height:34px;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%);filter:drop-shadow(0 3px 0 #70452e)}.house:after{content:"";position:absolute;bottom:0;width:16px;height:29px;background:#86533a;border-radius:5px 5px 0 0}
.village-label{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(#c88b4c,#a86630);color:#fff;border:4px solid #80502d;border-radius:17px;padding:10px 23px;font-size:clamp(18px,2.2vw,25px);font-weight:1000;text-shadow:0 2px #754b2e;box-shadow:0 6px 0 #704528,0 9px 12px #38552c66;transition:.18s}.village:hover .village-label{transform:translate(-50%,-5px)}.village:focus-within{outline:4px solid white}
.v-cn{--edge:#277c6b;--wall:#f0d7a2;--roof:#277b65;top:3%;left:3%}.v-math{--edge:#315fbd;--wall:#e2e8f8;--roof:#2860bd;top:3%;right:3%}.v-en{--edge:#7040b6;--wall:#e7def5;--roof:#7547b9;bottom:4%;left:3%}.v-special{--edge:#bd5938;--wall:#f4d7ac;--roof:#c65b37;bottom:4%;right:3%}
.center{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:14px;z-index:2}.mascot{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:58px;background:radial-gradient(circle at 35% 25%,#fff,#8fe0e7 65%,#4ba6aa);border:7px solid #d7f3eb;box-shadow:0 9px 0 #468c80,0 14px 18px #486c4b66}.center-note{background:#fff5d9;border:3px solid #c99c5e;border-radius:14px;padding:9px 12px;font-weight:900;box-shadow:0 5px 0 #98663e}
.bottom{position:relative;text-align:center;margin:0 auto;z-index:3}.daily{display:inline-block;background:#344b43;color:#fff;border-radius:30px;padding:13px 22px;font-weight:900;box-shadow:0 5px 0 #263b33}
.tree-deco{position:absolute;font-size:40px;opacity:.9;pointer-events:none}.t1{left:1%;top:49%}.t2{right:1%;top:54%}.t3{left:17%;bottom:4%}.t4{right:18%;bottom:5%}
button.village-label{border-style:solid}
.modal{position:fixed;inset:0;background:#172c27a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.panel{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff7e7;border:7px solid #bd8953;border-radius:26px;box-shadow:0 12px 0 #67452e;padding:24px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.panel h2{margin:0;font-size:28px}.close{border:0;border-radius:50%;background:#ead5b6;width:42px;height:42px;font-size:23px;color:#66452e}.subline{color:#876746;margin:8px 0 18px}.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.topic{border:3px solid #d9b98d;background:#fffdf7;border-radius:16px;padding:16px;text-align:left;color:#573d2a;box-shadow:0 4px 0 #c59b6d;display:flex;align-items:center;gap:12px}.topic:hover{background:#fff0cf;transform:translateY(-2px)}.topic .emoji{font-size:30px}.topic strong{display:block;font-size:17px}.topic small{color:#927451}.back{margin-top:20px;border:0;background:#426c53;color:white;padding:11px 20px;border-radius:12px;font-weight:800}
.practice{display:none;margin-top:18px;padding:18px;background:#f2e5cb;border-radius:16px}.practice.show{display:block}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{border:2px solid #c79d6d;border-radius:12px;padding:12px;background:white;color:#553d2b;font-weight:800}.answer.correct{background:#d9f1d7;border-color:#4e9b5a}.answer.wrong{background:#ffe0d8;border-color:#d46c5c}.feedback{font-weight:900;min-height:28px;margin-top:10px}.progress{height:12px;background:#e6d4b7;border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;background:#5c9b69;width:0;transition:width .3s}
@media(max-width:700px){.island{clip-path:none;padding:18px 14px 30px}.header{align-items:flex-start}.stats{font-size:12px;padding:9px 12px}.welcome{margin-top:22px}.villages{height:auto;display:grid;grid-template-columns:1fr 1fr;gap:48px 14px;margin:35px auto 30px}.village{position:relative;inset:auto;width:100%;min-width:0;height:150px;border-width:8px}.house{width:45px;height:61px;font-size:22px}.house:before{width:52px;height:27px;left:-7px;top:-18px}.buildings{gap:8px}.village-label{font-size:16px;padding:8px 13px;bottom:-30px}.center{position:relative;top:auto;left:auto;transform:none;justify-content:center;grid-column:1/-1;grid-row:2;order:5;margin:0}.mascot{width:76px;height:76px;font-size:42px}.center-note{font-size:13px}.v-en,.v-special{margin-top:0}.v-cn{grid-column:1}.v-math{grid-column:2}.v-en{grid-column:1}.v-special{grid-column:2}.tree-deco{display:none}.bottom{margin-top:15px}.topic-grid{grid-template-columns:1fr}.brand p{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 3D冒險角色與島嶼細節 */
.game{background:linear-gradient(#55b8df 0 18%,#a5ce80 18% 100%);background-attachment:fixed}
.island{filter:drop-shadow(0 18px 0 #69995b)}
.village{transform:perspective(850px) rotateX(10deg) translateZ(0);transition:transform .25s,filter .25s}
.village:hover{transform:perspective(850px) rotateX(7deg) translateY(-7px);filter:brightness(1.04)}
.village:after{content:"";position:absolute;bottom:9px;left:12%;width:76%;height:12px;border-radius:50%;background:#927b5a33;filter:blur(5px)}
.house{border-radius:9px 9px 4px 4px;box-shadow:6px 7px 0 #79573a, inset 5px 0 8px #ffffff66}
.house:after{box-shadow:inset 0 0 0 3px #b9854e}
.center{gap:10px}
.mascot{position:relative;isolation:isolate;animation:buddy-float 2.8s ease-in-out infinite;box-shadow:0 10px 0 #468c80,0 16px 20px #486c4b66,inset -8px -8px 0 #3d9c9b33}
.mascot:before{content:"";position:absolute;z-index:-1;inset:-10px;border-radius:50%;background:linear-gradient(145deg,#fff9c9,#ffd56b);box-shadow:0 7px 0 #c68a43}
.mascot:after{content:"✦";position:absolute;right:-16px;top:-14px;color:#fff4a4;font-size:26px;text-shadow:0 2px #d89d40}
@keyframes buddy-float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.center-note{position:relative;max-width:185px;line-height:1.55;background:linear-gradient(145deg,#fffdf0,#ffe5a9);border:3px solid #c99c5e}
.center-note:before{content:"";position:absolute;left:-10px;top:24px;border-width:9px 11px 9px 0;border-style:solid;border-color:transparent #c99c5e transparent transparent}
.character-row{display:flex;justify-content:center;gap:12px;position:relative;z-index:3;margin:-4px auto 0}
.hero{width:62px;height:72px;border:3px solid #fff4d7;border-radius:24px 24px 19px 19px;display:grid;place-items:center;font-size:34px;box-shadow:0 6px 0 #76533a,0 10px 13px #466a3e55;position:relative;animation:hero-bob 3s ease-in-out infinite}
.hero:nth-child(2){animation-delay:-.7s}.hero:nth-child(3){animation-delay:-1.4s}.hero:nth-child(4){animation-delay:-2.1s}
.hero:after{content:attr(data-name);position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;background:#fff4d7;padding:2px 7px;border-radius:9px;font-weight:900;color:#60452e}
.hero:nth-child(1){background:linear-gradient(145deg,#ffe6ad,#d98e4c)}.hero:nth-child(2){background:linear-gradient(145deg,#d5f1ff,#68b9dc)}.hero:nth-child(3){background:linear-gradient(145deg,#e6d9ff,#9b79d6)}.hero:nth-child(4){background:linear-gradient(145deg,#ffe0e4,#ed8e9d)}
@keyframes hero-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.quest-banner{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px auto 10px;max-width:520px;background:#fff5d9;border:3px solid #c99c5e;border-radius:18px;padding:10px 16px;box-shadow:0 6px 0 #98663e;color:#67482d;font-weight:900}
.quest-banner .quest-icon{font-size:26px}
.panel{background:linear-gradient(145deg,#fff9eb,#f4e1bf)}
.panel-head h2{color:#68472c}
.topic{transition:transform .18s,box-shadow .18s}.topic:active{transform:translateY(3px);box-shadow:0 1px 0 #c59b6d}
.adventure-tip{margin:14px 0 0;padding:12px 14px;background:#e4f3d8;border:2px solid #a5c98d;border-radius:14px;font-weight:800;color:#45653d}
@media(max-width:700px){.character-row{gap:8px;margin:5px auto 0}.hero{width:50px;height:58px;font-size:27px}.center{flex-wrap:wrap}.center-note{max-width:160px}.center-note:before{display:none}.quest-banner{font-size:13px;margin-top:20px}}

</style></head>
<body><main class="game"><div class="sky"></div><span class="cloud c1">☁</span><span class="cloud c2">☁</span>
<div class="island">
<header class="header"><div class="brand"><span class="brand-icon">🏝️</span><div><h1>學習島</h1><p>每天一小步，能力大冒險！</p></div></div><div class="stats">⭐ <span id="stars">0</span> 星星　🏅 <span id="done">0</span> 次練習</div></header>
<section class="welcome"><h2>嗨！小小探險家，今天想去哪一村？</h2><p>選一座學習村莊，開始你的知識冒險吧！</p></section>
<div class="villages">
<section class="village v-cn"><span class="trees">🌲 🌳</span><div class="buildings"><div class="house">📖</div><div class="house">📚</div></div><button class="village-label" onclick="openVillage('cn')">📘 國文村</button></section>
<section class="village v-math"><span class="trees">🌳 🌲</span><div class="buildings"><div class="house">🔢</div><div class="house">📐</div></div><button class="village-label" onclick="openVillage('math')">🔢 數學村</button></section>
<section class="village v-en"><span class="trees">🌲 🌳</span><div class="buildings"><div class="house">🔤</div><div class="house">🗣️</div></div><button class="village-label" onclick="openVillage('en')">🔤 英文村</button></section>
<section class="village v-special"><span class="trees">🌳 🌲</span><div class="buildings"><div class="house">🤝</div><div class="house">💡</div></div><button class="village-label" onclick="openVillage('special')">🤝 特需村</button></section>
<div class="center"><div class="mascot" aria-label="學習夥伴">🤖</div><div class="center-note" id="buddyLine">嗨！我是島島隊長<br>今天一起完成冒險任務！</div></div>
</div>
<div class="character-row" aria-label="冒險夥伴小隊"><div class="hero" data-name="島島隊長">🤖</div><div class="hero" data-name="語文精靈">🦊</div><div class="hero" data-name="數學博士">🐼</div><div class="hero" data-name="勇氣夥伴">🐰</div></div>
<div class="quest-banner"><span class="quest-icon">🗺️</span><span>今日任務：挑選一座村莊，完成一個挑戰！</span></div>
<div class="bottom"><div class="daily">📌 今日練了 <span id="today">0</span> 回・點村莊出發</div></div>
<span class="tree-deco t1">🌳</span><span class="tree-deco t2">🌲</span><span class="tree-deco t3">🌳</span><span class="tree-deco t4">🌲</span>
</div></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" onclick="if(event.target===this)closeModal()"><section class="panel"><div class="panel-head"><h2 id="modalTitle">國文村</h2><button class="close" onclick="closeModal()" aria-label="關閉">×</button></div><p class="subline" id="subline">選擇想挑戰的學習任務</p><div class="topic-grid" id="topics"></div><div class="practice" id="practice"><h3 id="question"></h3><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="progress"><span id="bar"></span></div><button class="back" onclick="nextQuestion()">下一題 ➜</button></div><button class="back" onclick="closeModal()">返回學習島</button></section></div>
<script>
const data={
cn:{title:'📘 國文村',desc:'讀一讀、想一想，讓文字變成你的超能力！',topics:[['📖','閱讀理解','找出文章重點與線索'],['🈶','識字與詞語','認識常用字詞與意思'],['✍️','造句與表達','練習完整說出自己的想法'],['📚','成語小學堂','理解成語並用在生活中']]},
math:{title:'🔢 數學村',desc:'動動腦、找方法，數學任務等你來解鎖！',topics:[['➕','數與計算','整數、小數與四則運算'],['🧩','代數入門','認識符號與簡單算式'],['📐','幾何世界','圖形、角度與周長面積'],['🛒','生活數學','時間、金錢與數量應用']]},
en:{title:'🔤 英文村',desc:'Say hello! 從字母、單字到簡單對話。',topics:[['🔠','字母與發音','認識英文字母與基本發音'],['🍎','生活單字','累積常見生活英語單字'],['💬','基礎句型','練習日常問候與句子'],['📗','簡易閱讀','讀懂短句與生活情境']]},
special:{title:'🤝 特需村',desc:'練習生活中的重要能力，讓每天都更有自信！',topics:[['🤝','社會技巧','打招呼、輪流、合作與交友'],['🧠','學習策略','訂目標、整理步驟與記憶'],['💬','溝通表達','表達需求、傾聽與適當回應'],['🌈','情緒管理','辨認情緒並找到調節方法'],['🎒','自我管理','時間安排、物品整理與負責']]}}
const quiz=[
{q:'看到一篇文章的標題，最適合先做什麼？',a:['猜猜文章可能談什麼','直接跳到最後一段','只看標點符號','把書本合起來'],c:0,why:'先從標題預測內容，可以幫助理解文章。'},
{q:'下列哪一個數字最大？',a:['0.8','0.65','0.75','0.5'],c:0,why:'0.8 等於 0.80，比 0.75 大。'},
{q:'「Good morning!」通常是在什麼時候說？',a:['早上','晚上睡前','道別時','生日當天'],c:0,why:'Good morning 是早安，通常在上午使用。'},
{q:'同學正在說話時，友善的做法是？',a:['先聽對方說完','大聲打斷','轉身走掉','嘲笑對方'],c:0,why:'先聆聽對方說完，再輪流表達想法。'}
];
let activeQuiz=0,answered=false;const store=JSON.parse(localStorage.getItem('learningIsland')||'{"stars":0,"done":0,"today":0}');
function sync(){document.getElementById('stars').textContent=store.stars;document.getElementById('done').textContent=store.done;document.getElementById('today').textContent=store.today}
function openVillage(key){const d=data[key];const lines={cn:'語文精靈：出發去文字森林，找找文章裡的寶藏！',math:'數學博士：準備好了嗎？一起破解數字謎題！',en:'語文精靈：Let’s go！今天來收集英文單字吧！',special:'勇氣夥伴：每一次練習，都是更棒的自己！'};document.getElementById('buddyLine').innerHTML=lines[key];document.getElementById('modalTitle').textContent=d.title;document.getElementById('subline').textContent=d.desc;document.getElementById('practice').classList.remove('show');const box=document.getElementById('topics');box.innerHTML='';d.topics.forEach((t,i)=>{const b=document.createElement('button');b.className='topic';b.innerHTML='<span class="emoji">'+t[0]+'</span><span><strong>'+t[1]+'</strong><small>'+t[2]+'</small></span>';b.onclick=()=>startPractice(i);box.appendChild(b)});document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function startPractice(i){activeQuiz=i%quiz.length;document.getElementById('buddyLine').innerHTML='島島隊長：勇者任務開始！仔細想一想，你一定做得到！';answered=false;document.getElementById('practice').classList.add('show');document.getElementById('feedback').textContent='';renderQuestion()}
function renderQuestion(){const q=quiz[activeQuiz];document.getElementById('question').textContent=q.q;const box=document.getElementById('answers');box.innerHTML='';q.a.forEach((a,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>checkAnswer(i,b);box.appendChild(b)});document.getElementById('bar').style.width='0%';answered=false}
function checkAnswer(i,btn){if(answered)return;answered=true;const q=quiz[activeQuiz];const buttons=[...document.querySelectorAll('.answer')];buttons.forEach((b,n)=>{b.disabled=true;if(n===q.c)b.classList.add('correct')});if(i===q.c){store.stars+=1;store.done+=1;store.today+=1;document.getElementById('feedback').textContent='🎉 答對了！'+q.why}else{btn.classList.add('wrong');document.getElementById('feedback').textContent='再想一想！正確答案已標示。'+q.why}if(i!==q.c){store.done+=1;store.today+=1}localStorage.setItem('learningIsland',JSON.stringify(store));sync();document.getElementById('bar').style.width='100%'}
function nextQuestion(){if(!answered){document.getElementById('feedback').textContent='先選一個答案再繼續喔！';return}activeQuiz=(activeQuiz+1)%quiz.length;renderQuestion()}
sync();document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
