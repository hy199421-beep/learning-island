<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三角函數入門:sin、cos、tan</title>
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#1b2a38;--mute:#5b6b7a;--line:#d3dee6;--o:#d9432b;--a:#1f74d1;--h:#12875a;--hl:#fff1b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1921;--card:#18252f;--ink:#e8eef3;--mute:#9db0bf;--line:#2c3d4a;--o:#ff7b62;--a:#5aa8ff;--h:#3ccf93;--hl:#4a4020}}
:root[data-theme="dark"]{--bg:#0f1921;--card:#18252f;--ink:#e8eef3;--mute:#9db0bf;--line:#2c3d4a;--o:#ff7b62;--a:#5aa8ff;--h:#3ccf93;--hl:#4a4020}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:0}h2{margin:0 0 6px}
.sub,.mute{color:var(--mute);margin:2px 0 12px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:6px 0;border-color:var(--line);font-size:15px;min-width:0}[hidden]{display:none!important}.lt{display:flex;gap:8px;margin:8px 0}.lt button{flex:1;font-size:18px}.lt button[aria-pressed=true]{background:var(--hl);border-color:var(--ink);font-weight:700}
nav button[aria-selected=true]{background:var(--hl);border-color:var(--ink);font-weight:700}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:14px;padding:14px}
svg{width:100%;height:auto;display:block}
.ctl{display:flex;align-items:center;gap:10px;margin:6px 0}
input[type=range]{flex:1;accent-color:var(--ink);min-width:0}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:6px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.chips{display:flex;gap:8px;margin:4px 0 10px}
.formula{font-size:22px;font-weight:700;background:var(--hl);padding:2px 10px;border-radius:6px;display:inline-block}
.live{font-size:18px;margin:8px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;font-size:19px}
.opt.bad{border-color:var(--o);color:var(--o);opacity:.6;text-decoration:line-through}
.opt.ok{background:var(--h);border-color:var(--h);color:var(--card);font-weight:700}
.hint{background:var(--hl);border-radius:8px;padding:8px 12px;margin:10px 0}
.primary{background:var(--ink);color:var(--card);margin-top:10px}
.qrow{display:grid;gap:10px;align-items:center}.qrow.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}.qrow .hint{margin:0}#hb{margin:4px 0 8px}.hp{width:100%;max-width:360px;height:auto;display:block;margin:0 auto 4px;border-radius:8px;background:#fff}.ask{font-size:19px;font-weight:700;margin:6px 0}
</style></head><body><main>
<h1>三角函數入門</h1>
<p class="sub">sin、cos、tan 其實只是「邊長的比」</p>
<nav id="tabs" role="tablist"></nav>
<section id="lesson" class="card">
<svg id="fig" viewBox="0 0 340 270" role="img" aria-label="會改變角度的直角三角形"></svg>
<div class="ctl"><button id="play">暫停</button><input id="ang" type="range" min="10" max="80" value="30" aria-label="角度 θ"><b id="angv">30°</b></div>
<div class="chips" id="chips"></div>
<div id="info"></div>
<button id="next" class="primary"></button>
</section>
<section id="quiz" hidden></section>
</main>
<script>
const $=s=>document.querySelector(s),PI=Math.PI;
const NAMES=['三邊','sin','cos','tan','記憶法','練習'];
function tri(deg,on,lab,dim){
 const r=deg*PI/180,L=220,x=40,y=235,bx=x+L*Math.cos(r),cy=y-L*Math.sin(r);
 const col=k=>on.includes(k)?`var(--${k})`:dim,w=k=>on.includes(k)?6:3;
 const ln=(k,a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" style="stroke:${col(k)};stroke-width:${w(k)};stroke-linecap:round"/>`;
 const tx=(k,px,py,an)=>lab[k]?`<text x="${px}" y="${py}" text-anchor="${an}" style="font-weight:700;font-size:16px;fill:${on.includes(k)?`var(--${k})`:'var(--mute)'}">${lab[k]}</text>`:'';
 const mx=(x+bx)/2,my=(y+cy)/2,m=Math.PI/2;
 return ln('a',x,y,bx,y)+ln('o',bx,y,bx,cy)+ln('h',x,y,bx,cy)
 +`<path d="M${bx-12} ${y}V${y-12}H${bx}" style="fill:none;stroke:var(--mute);stroke-width:1.5"/>`
 +`<path d="M${x+36} ${y}A36 36 0 0 0 ${x+36*Math.cos(r)} ${y-36*Math.sin(r)}" style="fill:none;stroke:var(--ink);stroke-width:2"/>`
 +`<text x="${x+62*Math.cos(r/2)}" y="${y-62*Math.sin(r/2)+6}" text-anchor="middle" style="font-size:20px;font-style:italic;fill:var(--ink)">θ</text>`
 +tx('o',bx+10,my+5,'start')+tx('a',mx,y+26,'middle')+tx('h',mx-20*Math.sin(r),my-20*Math.cos(r),'middle');
}
/* ---- 動畫教學 ---- */
let step=0,deg=30,ph=Math.asin(-.5),playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
$('#tabs').innerHTML=NAMES.map((n,i)=>`<button role="tab" data-i="${i}">${n}</button>`).join('');
$('#chips').innerHTML=[30,45,60].map(d=>`<button data-d="${d}">${d}°</button>`).join('');
function info(){
 const r=deg*PI/180,o=+(10*Math.sin(r)).toFixed(2),a=+(10*Math.cos(r)).toFixed(2),s=Math.sin(r).toFixed(2),c=Math.cos(r).toFixed(2),t=Math.tan(r).toFixed(2);
 const d=k=>`<span class="dot" style="background:var(--${k})"></span>`;
 return [
 `<p>站在 <b>θ</b> 這個角往外看:</p><p>${d('o')}<b>對邊</b>:正對著 θ 的那條(${o})</p><p>${d('a')}<b>鄰邊</b>:貼著 θ 的直角邊(${a})</p><p>${d('h')}<b>斜邊</b>:最長、對著直角的那條(10)</p><p class="mute">拖動滑桿看看:斜邊一直是 10,但對邊和鄰邊會跟著 θ 一起變。</p>`,
 `<div class="formula">sin θ = 對邊 ÷ 斜邊</div><p class="live">sin ${deg}° ≈ ${o} ÷ 10 ≈ <b>${s}</b></p><p>θ 越大,對邊越高,sin 越大。對邊不會比斜邊長,所以 sin 最大是 1。</p><p class="mute">口訣:sin 是「對斜」;更好記:寫一個 s,先沿斜邊(分母)、再沿對邊(分子)。到「記憶法」看示範。</p>`,
 `<div class="formula">cos θ = 鄰邊 ÷ 斜邊</div><p class="live">cos ${deg}° ≈ ${a} ÷ 10 ≈ <b>${c}</b></p><p>θ 越大,鄰邊越短,cos 越小。注意:它跟 sin 剛好相反。</p><p class="mute">口訣:cos 是「鄰斜」;更好記:寫一個 c,先沿斜邊(分母)、再沿鄰邊(分子)。到「記憶法」看示範。</p>`,
 `<div class="formula">tan θ = 對邊 ÷ 鄰邊</div><p class="live">tan ${deg}° ≈ ${o} ÷ ${a} ≈ <b>${t}</b></p><p>θ 越大,斜坡越陡,tan 越大。tan 不用斜邊,而且可以比 1 大。</p><p class="mute">口訣:tan 是「對鄰」;更好記:寫一個 t,先沿鄰邊(分母)、再沿對邊(分子)。到「記憶法」看示範。</p>`][step];
}
function draw(){
 if(step==4)return mnUI();
 const r=deg*PI/180,o=+(10*Math.sin(r)).toFixed(2),a=+(10*Math.cos(r)).toFixed(2);
 const on=['oah','oh','ah','oa'][step];
 $('#fig').innerHTML=tri(deg,on,{o:'對邊 '+o,a:'鄰邊 '+a,h:'斜邊 10'},'var(--line)');
 $('#angv').textContent=deg+'°';$('#ang').value=deg;$('#info').innerHTML=info();
}
function go(i){
 step=i;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.i==i));
 $('#lesson').hidden=i==5;$('#quiz').hidden=i!=5;$('.ctl').hidden=$('#chips').hidden=i==4;
 if(i==5){qi=0;score=0;hints=0;showQ()}else{pen=RM?2:0;draw();$('#next').textContent=i<4?`下一步:${NAMES[i+1]}`:'開始練習'}
 window.scrollTo(0,0);
}
function setPlay(p){playing=p;$('#play').textContent=p?'暫停':'播放';if(p)ph=Math.asin(Math.max(-1,Math.min(1,(deg-45)/30)))}
$('#tabs').onclick=e=>{if(e.target.dataset.i)go(+e.target.dataset.i)};
$('#next').onclick=()=>go(step+1);
$('#play').onclick=()=>setPlay(!playing);
$('#ang').oninput=e=>{playing=false;$('#play').textContent='播放';deg=+e.target.value;draw()};
$('#chips').onclick=e=>{if(e.target.dataset.d){playing=false;$('#play').textContent='播放';deg=+e.target.dataset.d;draw()}};
function loop(ts){
 const dt=last?ts-last:0;last=ts;
 if(playing&&step<4){ph+=dt*.0009;const d=Math.round(45+30*Math.sin(ph));if(d!==deg){deg=d;draw()}}if(step==4&&!RM){pen=(pen+dt*.0007)%3;drawMn()}
 requestAnimationFrame(loop);
}
/* ---- 寫字記憶法 ---- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches,NM={o:'對邊',a:'鄰邊',h:'斜邊'},VAL={o:3,a:4,h:5},PT={A:[40,235],B:[216,235],C:[216,103]};
const MN=[{n:'sin',l:'s',st:[['h','A','C'],['o','C','B']]},{n:'cos',l:'c',st:[['h','C','A'],['a','A','B']]},{n:'tan',l:'t',st:[['a','A','B'],['o','C','B']]}];
let mn=0,pen=0;
function mnUI(){
 const m=MN[mn],[s1,s2]=m.st;
 $('#info').innerHTML=`<div class="lt">${MN.map((x,i)=>`<button data-m="${i}" aria-pressed="${i==mn}">寫 ${x.l}</button>`).join('')}</div><div class="formula">${m.n} = ${NM[s2[0]]} ÷ ${NM[s1[0]]}</div><p>用手指跟著三角形寫一個 <b>${m.l}</b>:<br>① 第一筆沿著<b>${NM[s1[0]]}</b>,它是<b>分母</b>(下面那個)。<br>② 第二筆沿著<b>${NM[s2[0]]}</b>,它是<b>分子</b>(上面那個)。</p><p class="mute">不管寫哪個字母:先寫的是分母,後寫的是分子。</p>`;
 drawMn();
}
function drawMn(){
 const m=MN[mn],pos=(i,u)=>{const[,f,t]=m.st[i],F=PT[f],T=PT[t];return[F[0]+(T[0]-F[0])*u,F[1]+(T[1]-F[1])*u]};
 let s=tri(Math.atan2(3,4)*180/PI,'',{},'var(--line)');
 m.st.forEach(([k,f],i)=>{
  const u=Math.max(0,Math.min(1,pen-i));if(!u)return;
  const F=PT[f],[x,y]=pos(i,u),q={o:[226,172,'start'],a:[128,262,'middle'],h:[96,148,'middle']}[k];
  s+=`<line x1="${F[0]}" y1="${F[1]}" x2="${x}" y2="${y}" style="stroke:var(--${k});stroke-width:8;stroke-linecap:round"/><text x="${q[0]}" y="${q[1]}" text-anchor="${q[2]}" style="font-weight:700;font-size:17px;fill:var(--${k})">${'①②'[i]}${NM[k]} ${VAL[k]}</text>`;
 });
 if(pen<2){const i=Math.floor(pen),[x,y]=pos(i,pen-i);s+=`<circle cx="${x}" cy="${y}" r="8" style="fill:var(--ink)"/>`}
 else s+=`<text x="330" y="40" text-anchor="end" style="font-weight:700;font-size:24px;fill:var(--ink)">${m.n} = ${VAL[m.st[1][0]]}/${VAL[m.st[0][0]]}</text>`;
 $('#fig').innerHTML=s;
}
$('#info').onclick=e=>{const b=e.target.closest('[data-m]');if(b){mn=+b.dataset.m;pen=RM?2:0;mnUI()}};

const Q=[
 {t:[3,4,5],lab:['3','4','5'],ask:'sin θ 等於多少?',ans:'3/5',opts:['3/5','4/5','3/4','5/3'],hint:'sin 是「對邊 ÷ 斜邊」。先找對著 θ 的邊,再找最長的邊。',ex:'對邊 3、斜邊 5,所以 sin θ = 3/5。'},
 {t:[3,4,5],lab:['3','4','5'],ask:'同一個三角形,cos θ 等於多少?',ans:'4/5',opts:['3/5','4/5','3/4','4/3'],hint:'cos 是「鄰邊 ÷ 斜邊」。鄰邊是貼著 θ 的那條直角邊。',ex:'鄰邊 4、斜邊 5,所以 cos θ = 4/5。'},
 {t:[3,4,5],lab:['3','4','5'],ask:'同一個三角形,tan θ 等於多少?',ans:'3/4',opts:['3/5','4/5','3/4','4/3'],hint:'tan 是「對邊 ÷ 鄰邊」,這次不會用到斜邊。',ex:'對邊 3、鄰邊 4,所以 tan θ = 3/4。'},
 {t:[5,12,13],lab:['5','12','13'],ask:'cos θ 等於多少?',ans:'12/13',opts:['12/13','5/13','5/12','13/12'],hint:'cos 是「鄰邊 ÷ 斜邊」。先分清楚哪一條是鄰邊、哪一條是斜邊。',ex:'鄰邊 12、斜邊 13,所以 cos θ = 12/13。'},
 {t:[6,8,10],lab:['?','','10'],ask:'斜邊是 10,而且 sin θ = 0.6。對邊「?」是多少?',ans:'6',opts:['6','8','4','0.6'],hint:'sin θ = 對邊 ÷ 斜邊。把 0.6 和 10 放進去,想想「?」要用乘的還是除的。',ex:'對邊 = 斜邊 × sin θ = 10 × 0.6 = 6。'}
];
const USE=['oh','ah','oa','ah','oh'];
let qi=0,score=0,hints=0,miss=0,hintOn=false;
function qfig(){
 const q=Q[qi],[o,a,h]=q.t,nm=['對邊','鄰邊','斜邊'],L=q.lab.map((v,i)=>hintOn&&USE[qi].includes('oah'[i])?(nm[i]+(v?' '+v:'')):v);
 $('#qf').innerHTML=tri(Math.atan2(o,a)*180/PI,hintOn?USE[qi]:'',{o:L[0],a:L[1],h:L[2]},'var(--mute)');
}
function showQ(){
 const q=Q[qi];hintOn=false;miss=0;
 $('#quiz').innerHTML=`<div class="card"><p class="sub">第 ${qi+1} / ${Q.length} 題</p><div class="qrow" id="qr"><svg id="qf" viewBox="0 0 340 270" role="img" aria-label="直角三角形,θ 在左下角"></svg><div id="hx"></div></div><p class="ask">${q.ask}</p><button id="hb">提示</button><div id="opts">${[...q.opts].sort(()=>Math.random()-.5).map(o=>`<button class="opt">${o}</button>`).join('')}</div><div id="fb"></div></div>`;
 qfig();
 $('#hb').onclick=()=>{if(hintOn)return;hintOn=true;hints++;$('#qr').classList.add('two');qfig();$('#hx').innerHTML=`<div class="hint"><img class="hp" src="${HINT_IMG}" alt="手寫提示:沿著三角形寫 s、c、t,先寫的筆畫是分母,後寫的是分子"></div>`;$('#hb').disabled=true};
 $('#opts').onclick=e=>{
  if(!e.target.classList.contains('opt')||e.target.disabled)return;
  if(e.target.textContent===q.ans){
   document.querySelectorAll('.opt').forEach(b=>b.disabled=true);e.target.classList.add('ok');
   if(!miss&&!hintOn)score++;
   $('#fb').innerHTML=`<p><b>答對了!</b>${q.ex}</p><button class="primary" id="nx">${qi<Q.length-1?'下一題':'看結果'}</button>`;
   $('#nx').onclick=()=>{qi++;qi<Q.length?showQ():result()};
  }else{miss++;e.target.classList.add('bad');e.target.disabled=true;$('#fb').innerHTML='<p>還不對,再想想看。不確定的話,點「提示」。</p>'}
 };
}
function result(){
 $('#quiz').innerHTML=`<div class="card"><h2>練習完成</h2><p>不靠提示、一次就答對 <b>${score} / ${Q.length}</b> 題,用了 ${hints} 次提示。</p><p>${score>=4?'很穩!你已經會用 sin、cos、tan 了。':'再看一次動畫、再練一次會更順。用提示是學習的一部分,不是失敗。'}</p><button id="again">再練一次</button> <button id="back">回到動畫複習</button></div>`;
 $('#again').onclick=()=>go(5);$('#back').onclick=()=>go(0);
}
setPlay(playing);go(0);requestAnimationFrame(loop);
</script></body></html>
