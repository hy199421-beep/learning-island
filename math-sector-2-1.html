<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>扇形探險隊｜弧長與扇形面積漸進練習</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--tx:#1f2a44;--mu:#5d6b8a;--pri:#3b6cff;--ok:#1fa366;--bad:#e5484d;--bd:#d6def0;--fill:#cfe0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 "Noto Sans TC","Microsoft JhengHei",sans-serif}#app{max-width:620px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;font-weight:800}.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:18px;margin-top:14px}.bar{height:8px;background:var(--bd);border-radius:9px;margin:12px 0}.bar span{display:block;height:100%;background:var(--pri);width:0}.tag{color:var(--pri);font-weight:800}.muted{color:var(--mu);font-size:14px}h1,h2{margin:6px 0}svg{width:100%;max-height:260px}.formula{background:var(--bg);padding:12px;border-radius:12px;font-weight:700;margin:12px 0}.step{padding:12px 0;border-bottom:1px solid var(--bd)}input{font-size:19px;padding:9px;border:2px solid var(--bd);border-radius:10px;width:130px;background:white;color:#1f2a44}.btn{border:0;background:var(--pri);color:white;border-radius:12px;padding:11px 17px;font-size:16px;font-weight:800;cursor:pointer;margin:6px 6px 0 0}.ghost{background:white;color:var(--pri);border:2px solid var(--pri)}.feedback{padding:10px;border-radius:12px;margin-top:12px;min-height:42px}.ok{background:#e7f7ef;border:1px solid var(--ok)}.no{background:#fff0ef;border:1px solid var(--bad)}.hint{background:#eef3ff;border:1px solid var(--pri)}.fraction{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.25;margin:0 4px}.fraction b:first-child{border-bottom:2px solid;padding:0 6px}
</style></head><body><div id="app"><div class="top"><span>🧭 扇形探險隊</span><span id="score">0 分</span></div><div class="bar"><span id="progress"></span></div><main id="main"></main></div>
<script>
const $=s=>document.querySelector(s), qs=[
['弧長',6,60,0],['弧長',9,120,0],['弧長',8,90,0],['面積',6,60,0],['面積',4,90,0],['面積',9,120,1],
['弧長',12,45,1],['弧長',15,240,0],['弧長',10,90,1],['面積',12,30,0],['面積',10,36,1],['面積',6,120,1],
['弧長',8,135,1],['面積',9,40,1],['面積',12,150,0],['弧長',14,90,1],['面積',20,72,0],['弧長',21,120,1]];
const levels=['弧長・跟著做','面積・跟著做','弧長・少一點提示','面積・少一點提示','三步驟・自己想','獨立挑戰'];
let i=0,step=0,score=0,tries=0,help=0;
const gcd=(a,b)=>b?gcd(b,a%b):a, frac=(n,d)=>'<span class="fraction"><b>'+n+'</b><b>'+d+'</b></span>';
function question(){return qs[i]}
function vals(){let [kind,r,deg,dia]=question();if(dia)r*=1;let g=gcd(deg,360),n=deg/g,d=360/g,whole=kind==='弧長'?2*r:r*r,ans=whole*deg/360;return {kind,r,deg,dia,n,d,whole,ans}}
function drawing(v){let radius=100,a=20,b=a+v.deg,rad=x=>x*Math.PI/180,p=x=>[150+radius*Math.cos(rad(x)),150- radius*Math.sin(rad(x))],A=p(a),B=p(b),large=v.deg>180?1:0;return '<svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="100" fill="none" stroke="#8795ad" stroke-dasharray="5 4" stroke-width="2"/><path d="M150 150 L'+A.join(' ')+' A100 100 0 '+large+' 0 '+B.join(' ')+' Z" fill="#cfe0ff" stroke="#52627e" stroke-width="2"/><path d="M'+A.join(' ')+' A100 100 0 '+large+' 0 '+B.join(' ')+(v.kind==='弧長'?'" fill="none" stroke="#3b6cff" stroke-width="7" stroke-linecap="round"/>':'" fill="none"/>')+'<circle cx="150" cy="150" r="4" fill="#1f2a44"/><text x="150" y="145" text-anchor="middle" font-size="13" fill="#1f2a44">'+v.deg+'°</text><text x="150" y="282" text-anchor="middle" font-size="14" fill="#1f2a44">'+(v.dia?'直徑':'半徑')+' = '+(v.dia?v.r*2:v.r)+'</text></svg>'}
function start(){i=0;score=0;$('#score').textContent='0 分';render()}
function render(){step=0;tries=0;help=0;let v=vals();$('#progress').style.width=(i/qs.length*100)+'%';$('#main').innerHTML='<section class="card"><div class="tag">第 '+(Math.floor(i/3)+1)+' 關・'+levels[Math.floor(i/3)]+'　('+ (i+1)+'/18)</div><p class="muted">每一步答對得分，卡住可以看提示。題目要自己從圖上找出半徑。</p><h2>如圖，圓心角 '+v.deg+'° 的扇形，'+v.kind+'是多少？</h2>'+drawing(v)+'<div class="formula">直徑 = 2 × 半徑<br>弧長 = 圓周長 × '+frac('圓心角','360')+'（圓周長 = 2πr）<br>扇形面積 = 圓面積 × '+frac('圓心角','360')+'（圓面積 = πr²）</div><div id="task"></div><div id="fb" class="feedback"></div><button class="btn ghost" id="hint">💡 提示</button><button class="btn" id="next" hidden>下一題 ➜</button></section>';$('#hint').onclick=hint;$('#next').onclick=()=>{i++;i<qs.length?render():finish()};task()}
function plan(){let v=vals(),lv=Math.floor(i/3);if(lv<2)return [{k:'raw',x:v.deg+'/360'},{k:'simp',x:v.n+'/'+v.d},{k:'rad',x:String(v.r)},{k:'whole',x:String(v.whole)},{k:'final',x:String(v.ans)}];if(lv<4)return [{k:'rad',x:String(v.r)},{k:'simp',x:v.n+'/'+v.d},{k:'whole',x:String(v.whole)},{k:'final',x:String(v.ans)}];if(lv===4)return [{k:'rad',x:String(v.r)},{k:'simp',x:v.n+'/'+v.d},{k:'final',x:String(v.ans)}];return [{k:'final',x:String(v.ans)}]}
function task(){let v=vals(),lv=Math.floor(i/3),p=plan()[step],labels={raw:'圓心角占整圓的比例',simp:'把圓心角比例約分到最簡',rad:'找出半徑（公分）',whole:'整個圓的'+(v.kind==='弧長'?'圓周長':'面積')+'，填 π 前面的數字',final:'扇形'+v.kind+'，填 π 前面的數字'},prompts={raw:'分子填圓心角，分母填 360。',simp:'分子和分母同時除以最大公因數。',rad:'從圖上判斷標示的是半徑還是直徑。',whole:v.kind==='弧長'?'圓周長 = 2 × 半徑 × π。':'圓面積 = 半徑 × 半徑 × π。',final:'用整個圓的數值乘上圓心角比例。'};$('#task').innerHTML='<div class="step"><b>'+(step+1)+'. '+labels[p.k]+'</b><p>'+prompts[p.k]+'</p><input id="answer" placeholder="'+(p.k==='raw'||p.k==='simp'?'例如 1/6':'輸入數字')+'"> <button class="btn" id="check">送出</button></div>';$('#check').onclick=check;$('#answer').onkeydown=e=>{if(e.key==='Enter')check()}}
function check(){let a=$('#answer').value.trim().replace(/／/g,'/'),p=plan()[step],v=vals(),ok=false;if(!a){feedback('請輸入答案喔！','hint');return}if(p.k==='raw'||p.k==='simp'){let m=a.match(/^(\\d+)\\/(\\d+)$/);if(m){let n=+m[1],d=+m[2];ok=p.k==='raw'?(n===v.deg&&d===360):(n===v.n&&d===v.d);}}else ok=Math.abs(Number(a)-Number(p.x))<.01;if(ok){let pts=tries===0&&help===0?10:5;score+=pts;$('#score').textContent=score+' 分';feedback('✅ 答對了！答案：'+p.x+'　得分 +'+pts,'ok');step++;if(step<plan().length)setTimeout(task,500);else{$('#progress').style.width=((i+1)/qs.length*100)+'%';$('#next').hidden=false;$('#hint').hidden=true}}else{tries++;if(tries>=2){feedback('正確答案：'+p.x,'no');step++;if(step<plan().length)setTimeout(task,800);else{$('#next').hidden=false;$('#hint').hidden=true}}else feedback('再想想，還有一次機會！','no')}}function feedback(t,c){$('#fb').className='feedback '+c;$('#fb').textContent=t}
function hint(){let v=vals(),lv=Math.floor(i/3),h;if(lv>=4)h='弧長 = 2πr × 圓心角比例；扇形面積 = πr² × 圓心角比例。';else if(step===0)h=v.dia?'圖上標的是直徑，半徑要用直徑 ÷ 2。':'圖上標的是半徑，直接使用這個數字。';else if(step===1)h='先把圓心角寫在分子，360 寫在分母，再約分。';else if(step===2)h=v.kind==='弧長'?'整個圓周長 = 2 × 半徑 × π。':'整個圓面積 = 半徑 × 半徑 × π。';else h='扇形'+v.kind+' = 整個圓的'+(v.kind==='弧長'?'圓周長':'面積')+' × 圓心角比例。';help++;feedback('💡 '+h,'hint')}
function finish(){$('#progress').style.width='100%';$('#main').innerHTML='<section class="card"><div style="font-size:48px;text-align:center">🏆</div><h1 style="text-align:center">扇形探險完成！</h1><p style="text-align:center">總分 '+score+' 分</p><p>你完成了 6 關、18 題的弧長與扇形面積練習。</p><button class="btn" onclick="start()">再玩一次</button><a class="btn ghost" href="./math-circle.html" style="text-decoration:none;display:inline-block">返回 2-1</a></section>'}
start();
</script></body></html>
